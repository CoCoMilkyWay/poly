<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aggregate Token Exposure</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f9fb;
    }
    .page-title {
      padding: 18px 24px 8px 24px;
      font-size: 22px;
      font-weight: 700;
    }
    .page-subtitle {
      padding: 0 24px 12px 24px;
      color: #5f6368;
      font-size: 14px;
    }
    .toolbar {
      padding: 0 20px 8px 20px;
    }
    .summary-card {
      margin: 0 20px 14px 20px;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #e6e8ee;
      border-radius: 8px;
    }
    .summary-box {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #1f2937;
    }
    .btn {
      border: 1px solid #d0d7e2;
      border-radius: 6px;
      background: #ffffff;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
    }
    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .status {
      color: #5f6368;
      font-size: 13px;
    }
    .chart-card {
      margin: 14px 20px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #e6e8ee;
      border-radius: 8px;
    }
    .plot-box {
      width: 100%;
      height: 900px;
    }
  </style>
</head>
<body>
  <div class="page-title">Aggregate Token Exposure</div>
  <div id="subtitle" class="page-subtitle">loading...</div>
  <div class="toolbar">
    <button id="refresh-holdings-btn" class="btn">Refresh Holdings + Prices</button>
    <button id="refresh-price-btn" class="btn">Refresh Prices</button>
    <span id="status" class="status"></span>
  </div>
  <section class="summary-card"><pre id="summary" class="summary-box">loading summary...</pre></section>
  <section class="chart-card"><div id="plot" class="plot-box"></div></section>
  <script>
    const subtitleEl = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const refreshHoldingsBtn = document.getElementById("refresh-holdings-btn");
    const refreshPriceBtn = document.getElementById("refresh-price-btn");

    function assertCond(condition, message) {
      if (!condition) throw new Error(message);
    }

    function buildLookups(output) {
      const tokenMap = new Map();
      const conditionMap = new Map();
      for (const row of output.tokens || []) {
        tokenMap.set(row.token_id, row);
      }
      for (const row of output.conditions || []) {
        conditionMap.set(row.condition_id, row);
      }
      return { tokenMap, conditionMap };
    }

    function getTokenRow(row, lookups) {
      return lookups.tokenMap.get(row.token_id) || null;
    }

    function getConditionRow(tokenRow, lookups) {
      if (!tokenRow.condition_id) return null;
      return lookups.conditionMap.get(tokenRow.condition_id) || null;
    }

    function getOutcomeIndex(tokenRow, conditionRow) {
      if (!conditionRow) return null;
      const outcomeIndex = (conditionRow.token_ids || []).indexOf(tokenRow.token_id);
      return outcomeIndex >= 0 ? outcomeIndex : null;
    }

    function normalizeMarketOutcome(tokenRow, conditionRow) {
      const outcomes = conditionRow ? conditionRow.market_outcomes || [] : [];
      const outcomeIndex = getOutcomeIndex(tokenRow, conditionRow);
      if (Number.isInteger(outcomeIndex) && outcomeIndex >= 0 && outcomeIndex < outcomes.length) {
        return String(outcomes[outcomeIndex]);
      }
      return "";
    }

    function buildTokenLabel(row, index, lookups) {
      const tokenRow = getTokenRow(row, lookups);
      if (!tokenRow) return `#${index} token ${String(row.token_id).slice(0, 10)}`;
      const conditionRow = getConditionRow(tokenRow, lookups);
      const outcomeIndex = getOutcomeIndex(tokenRow, conditionRow);
      if (conditionRow && conditionRow.market_question) {
        const outcome = normalizeMarketOutcome(tokenRow, conditionRow);
        const suffix = outcome
          ? ` [${outcome}]`
          : (Number.isInteger(outcomeIndex) ? ` [o${outcomeIndex}]` : "");
        let question = String(conditionRow.market_question).trim();
        if (question.length > 60) question = question.slice(0, 57) + "...";
        return `#${index} ${question}${suffix}`;
      }
      if (conditionRow && conditionRow.question_id) {
        return Number.isInteger(outcomeIndex)
          ? `#${index} ${String(conditionRow.question_id).slice(2, 10)} o${outcomeIndex}`
          : `#${index} ${String(conditionRow.question_id).slice(2, 10)}`;
      }
      if (tokenRow.condition_id) {
        return Number.isInteger(outcomeIndex)
          ? `#${index} ${String(tokenRow.condition_id).slice(2, 10)} o${outcomeIndex}`
          : `#${index} ${String(tokenRow.condition_id).slice(2, 10)}`;
      }
      return `#${index} token ${String(tokenRow.token_id).slice(0, 10)}`;
    }

    function buildChart(output) {
      const lookups = buildLookups(output);
      const labels = [];
      const values = [];
      const customdata = [];
      for (let i = 0; i < output.aggregate.length; i += 1) {
        const row = output.aggregate[i];
        const tokenRow = getTokenRow(row, lookups);
        // Some aggregate rows refer to foreign instruments with no normalized
        // token metadata. Skip them in the chart instead of failing render.
        if (!tokenRow) continue;
        const conditionRow = getConditionRow(tokenRow, lookups);
        const outcomeIndex = getOutcomeIndex(tokenRow, conditionRow);
        const weight = Number(row.aggregate_weight);
        assertCond(Number.isFinite(weight), "invalid aggregate_weight");
        if (weight <= 0) continue;
        labels.push(buildTokenLabel(row, i + 1, lookups));
        values.push(weight);
        customdata.push([
          row.token_id,
          conditionRow ? conditionRow.question_id : null,
          tokenRow.condition_id,
          outcomeIndex,
          row.holder_count,
          row.holder_ratio,
          row.aggregate_weight,
          tokenRow.price,
          conditionRow ? conditionRow.market_question || "" : "",
          conditionRow ? conditionRow.market_description || "" : "",
          conditionRow ? conditionRow.market_url || "" : "",
          normalizeMarketOutcome(tokenRow, conditionRow),
        ]);
      }
      if (labels.length === 0) {
        labels.push("empty");
        values.push(1.0);
        customdata.push([null, null, null, null, 0, "0.0000000000", "0.0000000000", null, "", "", "", ""]);
      }
      return {
        traces: [
          {
            type: "pie",
            labels,
            values,
            sort: true,
            direction: "clockwise",
            textinfo: "percent+label",
            textposition: "inside",
            hovertemplate:
              "label=%{label}" +
              "<br>share=%{percent}" +
              "<br>aggregate_weight=%{customdata[6]}" +
              "<br>holder_count=%{customdata[4]}" +
              "<br>holder_ratio=%{customdata[5]}" +
              "<br>outcome_index=%{customdata[3]}" +
              "<br>price=%{customdata[7]}" +
              "<br>question_id=%{customdata[1]}" +
              "<br>condition_id=%{customdata[2]}" +
              "<br>token_id=%{customdata[0]}" +
              "<br>question=%{customdata[8]}" +
              "<br>description=%{customdata[9]}" +
              "<br>url=%{customdata[10]}" +
              "<br>outcome=%{customdata[11]}" +
              "<extra></extra>",
            customdata,
          },
        ],
        layout: {
          title: {
            text:
              "Aggregate Token Exposure" +
              `<br><sup>snapshot_block=${output.summary.snapshot_block} user_count=${output.summary.user_count} token_count=${output.summary.token_count} threshold=${output.summary.aggregate_weight_threshold}</sup>`,
          },
          template: "plotly_white",
          margin: { l: 20, r: 20, t: 80, b: 20 },
          showlegend: true,
        },
      };
    }

    function render(output) {
      const chart = buildChart(output);
      Plotly.react("plot", chart.traces, chart.layout, { responsive: true });
      summaryEl.textContent = JSON.stringify(output.summary, null, 2);
      subtitleEl.textContent =
        `address_file=address.txt, snapshot_block=${output.summary.snapshot_block}, users=${output.summary.user_count}, positions=${output.summary.position_count}, tokens=${output.summary.token_count}`;
    }

    async function fetchOutput() {
      const res = await fetch("/api/output");
      assertCond(res.ok, `/api/output status=${res.status}`);
      return await res.json();
    }

    async function postJson(url) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      assertCond(res.ok, `${url} status=${res.status}`);
      return await res.json();
    }

    async function runAction(actionName, fn) {
      refreshHoldingsBtn.disabled = true;
      refreshPriceBtn.disabled = true;
      statusEl.textContent = `${actionName}...`;
      const output = await fn();
      render(output);
      statusEl.textContent = `${actionName} done at ${new Date().toLocaleTimeString()}`;
      refreshHoldingsBtn.disabled = false;
      refreshPriceBtn.disabled = false;
    }

    refreshHoldingsBtn.addEventListener("click", async () => {
      await runAction("refresh holdings + prices", () => postJson("/api/refresh-holdings"));
    });
    refreshPriceBtn.addEventListener("click", async () => {
      await runAction("refresh prices", () => postJson("/api/refresh-price"));
    });

    runAction("load", fetchOutput);
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polymarket Explorer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2em;
      color: #fff;
      margin-bottom: 5px;
    }

    header p {
      color: #888;
      font-size: 0.9em;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.7em;
      font-weight: 500;
    }

    .badge-success {
      background: #166534;
      color: #4ade80;
    }

    .badge-warning {
      background: #854d0e;
      color: #fde047;
    }

    .badge-error {
      background: #991b1b;
      color: #fca5a5;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #1a1a1a;
      border: 2px solid #dc2626;
      border-radius: 8px;
      padding: 24px;
      max-width: 400px;
      text-align: center;
    }

    .modal-box h3 {
      color: #dc2626;
      margin-bottom: 12px;
      font-size: 1.3em;
    }

    .modal-box p {
      color: #fca5a5;
      margin-bottom: 20px;
    }

    .modal-box .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-box .btn-cancel {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    .modal-box .btn-danger {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body data-last-block="{{ stage1_state.last_block or 0 }}" data-head-block="{{ stage1_state.head_block or 0 }}"
  data-syncing="{{ 'true' if stage1_state.syncing else 'false' }}">
  <div class="container">
    <header>
      <h1>Polymarket Explorer</h1>
      <p>Polymarket 链上数据同步与查询</p>
    </header>

    {% include 'components/mem.html' %}
    {% include 'components/stage1.html' %}
    {% include 'components/stage2.html' %}
    {% include 'components/stage3_filter.html' %}
    {% include 'components/stage3.html' %}
  </div>

  <div class="modal-overlay" id="retag-modal">
    <div class="modal-box">
      <h3>⚠️ 警告</h3>
      <p>reTag 将会丢失所有 tagging 进度！</p>
      <div class="btn-group">
        <button class="btn-cancel" onclick="closeRetagModal()">取消</button>
        <button class="btn-danger" onclick="confirmRetag()">确认 reTag</button>
      </div>
    </div>
  </div>

  <script>
    function formatNumber(n) {
      return n.toLocaleString();
    }

    async function refresh() {
      try {
        const [stage0Res, syncRes, tablesRes] = await Promise.all([
          fetch("/api/stage0-status"),
          fetch("/api/stage1-status"),
          fetch("/api/tables"),
        ]);
        const stage0 = await stage0Res.json();
        const sync = await syncRes.json();
        const tables = await tablesRes.json();
        if (window.updateStage0Status) updateStage0Status(stage0, sync.head_block || 0);
        updateSyncStatus(sync);
        updateTables(tables);
        if (window.updateContractSync) updateContractSync(sync);
        if (window.updateContractTables) updateContractTables(tables);
      } catch (e) {
        console.error("Refresh failed:", e);
      }
    }

    async function exportAllCSV() {
      const btn = document.getElementById("export-all-btn");
      btn.disabled = true;
      btn.textContent = "导出中...";

      try {
        const resp = await fetch("/api/export-all", { method: "POST" });
        const result = await resp.json();

        if (result.exported.length === 0) {
          alert("所有表均无数据");
        } else {
          alert(`已导出 ${result.exported.length} 个表到 ${result.path}`);
        }
      } catch (e) {
        console.error("Export failed:", e);
        alert("导出失败: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "全部导出";
      }
    }

    function reTagStage0() {
      document.getElementById("retag-modal").classList.add("show");
    }

    function closeRetagModal() {
      document.getElementById("retag-modal").classList.remove("show");
    }

    async function confirmRetag() {
      closeRetagModal();
      const btn = document.getElementById("retag-btn");
      btn.disabled = true;
      btn.textContent = "reTag中...";
      try {
        await fetch("/api/stage0-retag", { method: "POST" });
        await refresh();
      } catch (e) {
        console.error("reTag failed:", e);
        alert("reTag失败: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "reTag";
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>

</html>

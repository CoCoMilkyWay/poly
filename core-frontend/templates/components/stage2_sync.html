<style>
  .stage2-card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .stage2-card h2 {
    font-size: 1.1em;
    color: #fff;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stage2-status {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
  }
  .stage2-stat {
    background: #252525;
    padding: 12px;
    border-radius: 6px;
  }
  .stage2-stat-label {
    font-size: 0.8em;
    color: #888;
    margin-bottom: 4px;
  }
  .stage2-stat-value {
    font-size: 1.2em;
    color: #fff;
    font-weight: 500;
  }
  .stage2-syncing {
    color: #fbbf24;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .stage2-idle {
    color: #10b981;
  }
  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.5;
    }
  }
</style>

<div class="stage2-card">
  <h2>
    <span id="stage2-status-icon" class="stage2-idle">●</span>
    Stage2 事件同步
    <span id="stage2-badge" class="badge badge-success">空闲</span>
  </h2>

  <div class="stage2-status">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Stage1 Transfer 总数</div>
      <div class="stage2-stat-value" id="stage2-s1-count">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">已构建 Transfer</div>
      <div class="stage2-stat-value" id="stage2-built-count">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">待处理</div>
      <div class="stage2-stat-value" id="stage2-pending">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">用户数</div>
      <div class="stage2-stat-value" id="stage2-users">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">事件数</div>
      <div class="stage2-stat-value" id="stage2-events">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">上次构建耗时</div>
      <div class="stage2-stat-value" id="stage2-build-time">-</div>
    </div>
  </div>
</div>

<script>
  async function refreshStage2Status() {
    try {
      const res = await fetch("/api/stage2-sync-status");
      const s = await res.json();

      document.getElementById("stage2-s1-count").textContent = formatNumber(
        s.stage1_transfer_count,
      );
      document.getElementById("stage2-built-count").textContent = formatNumber(
        s.last_build_transfer_count,
      );
      document.getElementById("stage2-pending").textContent = formatNumber(
        s.pending_transfers,
      );
      document.getElementById("stage2-users").textContent = formatNumber(
        s.last_build_users,
      );
      document.getElementById("stage2-events").textContent = formatNumber(
        s.last_build_events,
      );
      document.getElementById("stage2-build-time").textContent =
        s.last_build_ms > 0 ? (s.last_build_ms / 1000).toFixed(1) + "s" : "-";

      const icon = document.getElementById("stage2-status-icon");
      const badge = document.getElementById("stage2-badge");

      if (s.syncing || s.build_running) {
        icon.className = "stage2-syncing";
        badge.className = "badge badge-warning";
        badge.textContent = s.build_running
          ? `构建中 P${s.build_phase}`
          : "同步中";
      } else {
        icon.className = "stage2-idle";
        badge.className = "badge badge-success";
        badge.textContent = s.pending_transfers > 0 ? "待同步" : "已同步";
      }
    } catch (e) {
      console.error("Stage2 status refresh failed:", e);
    }
  }

  refreshStage2Status();
  setInterval(refreshStage2Status, 3000);
</script>

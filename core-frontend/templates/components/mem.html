<style>
  .mem-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .mem-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }

  .mem-header h2 {
    font-size: 1.1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .mem-header h2::before {
    content: "";
    width: 3px;
    height: 16px;
    background: #ef4444;
    border-radius: 2px;
  }

  .mem-updated {
    color: #666;
    font-size: 0.75em;
    font-family: monospace;
  }

  .mem-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .mem-kpi {
    background: #252525;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
  }

  .mem-kpi-label {
    font-size: 0.75em;
    color: #666;
    margin-bottom: 2px;
  }

  .mem-kpi-value {
    font-family: monospace;
    font-size: 1em;
    color: #fff;
    font-weight: 600;
  }

  .mem-kpi-value .muted {
    color: #666;
    font-weight: 500;
  }

  .mem-section {
    margin-top: 10px;
    background: #202020;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px;
  }

  .mem-section-title {
    font-size: 0.85em;
    color: #ddd;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .mem-stage-details {
    margin-top: 8px;
  }

  .mem-stage-summary {
    font-size: 0.85em;
    font-weight: 600;
    color: #ddd;
    font-family: inherit;
  }

  .mem-table-wrap {
    overflow-x: auto;
  }

  .mem-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75em;
    font-family: monospace;
  }

  .mem-table th,
  .mem-table td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #333;
    white-space: nowrap;
  }

  .mem-table th {
    color: #9ca3af;
    font-weight: 600;
    background: #252525;
    position: sticky;
    top: 0;
  }

  .mem-empty {
    color: #666;
    font-size: 0.8em;
    padding: 6px 0;
  }
</style>

<div class="mem-card">
  <div class="mem-header">
    <h2>进程内存分解</h2>
    <div class="mem-updated" id="mem-updated-at">-</div>
  </div>

  <div class="mem-kpi-grid">
    <div class="mem-kpi">
      <div class="mem-kpi-label">Free Chunks (reserved by Malloc)</div>
      <div class="mem-kpi-value" style="color: #f59e0b;" id="mem-kpi-free-chunks">-</div>
    </div>
    <div class="mem-kpi">
      <div class="mem-kpi-label">DB + Struct (cur / peak)</div>
      <div class="mem-kpi-value" id="mem-kpi-db-struct-total">-</div>
    </div>
  </div>

  <div class="mem-section">
    <div class="mem-section-title">Stage 内存占用</div>
    <details class="mem-stage-details">
      <summary class="mem-stage-summary" id="mem-stage0-summary">Stage0</summary>
      <div class="mem-table-wrap">
        <table class="mem-table">
          <thead>
            <tr>
              <th>占用</th>
              <th>对象</th>
            </tr>
          </thead>
          <tbody id="mem-stage0-body"></tbody>
        </table>
      </div>
      <div class="mem-empty" id="mem-stage0-empty" style="display: none">暂无数据</div>
    </details>
    <details class="mem-stage-details">
      <summary class="mem-stage-summary" id="mem-stage1-summary">Stage1</summary>
      <div class="mem-table-wrap">
        <table class="mem-table">
          <thead>
            <tr>
              <th>占用</th>
              <th>对象</th>
            </tr>
          </thead>
          <tbody id="mem-stage1-body"></tbody>
        </table>
      </div>
      <div class="mem-empty" id="mem-stage1-empty" style="display: none">暂无数据</div>
    </details>
    <details class="mem-stage-details">
      <summary class="mem-stage-summary" id="mem-stage2-summary">Stage2</summary>
      <div class="mem-table-wrap">
        <table class="mem-table">
          <thead>
            <tr>
              <th>占用</th>
              <th>对象</th>
            </tr>
          </thead>
          <tbody id="mem-stage2-body"></tbody>
        </table>
      </div>
      <div class="mem-empty" id="mem-stage2-empty" style="display: none">暂无数据</div>
    </details>
    <details class="mem-stage-details">
      <summary class="mem-stage-summary" id="mem-stage3-summary">Stage3</summary>
      <div class="mem-table-wrap">
        <table class="mem-table">
          <thead>
            <tr>
              <th>占用</th>
              <th>对象</th>
            </tr>
          </thead>
          <tbody id="mem-stage3-body"></tbody>
        </table>
      </div>
      <div class="mem-empty" id="mem-stage3-empty" style="display: none">暂无数据</div>
    </details>
  </div>

  <div class="mem-section">
    <div class="mem-section-title">数据库内存占用（按库）</div>
    <div class="mem-table-wrap">
      <table class="mem-table">
        <thead>
          <tr>
            <th>当前占用</th>
            <th>峰值占用</th>
            <th>库</th>
            <th>引擎</th>
            <th>细项</th>
          </tr>
        </thead>
        <tbody id="mem-db-body"></tbody>
      </table>
    </div>
    <div class="mem-empty" id="mem-db-empty" style="display: none">暂无数据</div>
  </div>
</div>

<script>
  (function () {
    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    function toBytes(value) {
      return Number.isFinite(value) ? value : 0;
    }

    function formatCurPeak(current, peak) {
      return `${formatBytes(current)} / ${formatBytes(peak)}`;
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function setCurPeakHtml(id, current, peak) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = `${formatBytes(current)} <span class="muted">/ ${formatBytes(peak)}</span>`;
    }

    function renderTableBody(id, rows, cols) {
      const body = document.getElementById(id);
      if (!body) return;
      let html = "";
      for (const row of rows) {
        html += "<tr>";
        for (const col of cols) {
          const val = row[col.key];
          const text = col.type === "bytes" ? formatBytes(val || 0) : (val ?? "");
          html += `<td>${text}</td>`;
        }
        html += "</tr>";
      }
      body.innerHTML = html;
    }

    function renderStage(prefix, stage) {
      const rows = stage.items || [];
      renderTableBody(`mem-${prefix}-body`, rows, [
        { key: "estimated_bytes", type: "bytes" },
        { key: "name" },
      ]);
      const empty = document.getElementById(`mem-${prefix}-empty`);
      if (empty) empty.style.display = rows.length ? "none" : "block";

      const totalBytes = stage.estimated_total_bytes || 0;
      const peakBytes = stage.estimated_peak_bytes || totalBytes;
      const total = formatBytes(totalBytes);
      const peak = formatBytes(peakBytes);
      const summary = document.getElementById(`mem-${prefix}-summary`);
      if (summary) summary.textContent = `${prefix.toUpperCase()} (cur ${total}, peak ${peak})`;
    }

    function renderDatabaseBreakdown(db) {
      const rows = [];
      const fixedOrder = [
        "DuckDB:stage0",
        "DuckDB:stage1",
        "DuckDB:stage2",
        "DuckDB:stage3",
        "RocksDB:stage2_user_event",
        "RocksDB:stage3_event_fact",
      ];
      const orderRank = {};
      for (let i = 0; i < fixedOrder.length; i += 1) {
        orderRank[fixedOrder[i]] = i;
      }

      for (const item of db.duckdb || []) {
        const name = item.name || item.database_name || "unknown";
        const itemKey = `DuckDB:${name}`;
        const usedBytes = toBytes(item.memory_usage_bytes);
        const peakUsedBytes = toBytes(item.memory_usage_peak_bytes || usedBytes);
        const walBytes = toBytes(item.wal_size_bytes);
        const walPeakBytes = toBytes(item.wal_size_peak_bytes || walBytes);
        const bufferBytes = toBytes(item.buffer_manager_bytes);
        rows.push({
          used_bytes: usedBytes,
          peak_used_bytes: peakUsedBytes,
          name,
          engine: "DuckDB",
          order_key: itemKey,
          detail:
            `limit ${formatBytes(toBytes(item.memory_limit_bytes))}, ` +
            `buf ${formatBytes(bufferBytes)}, ` +
            `wal ${formatCurPeak(walBytes, walPeakBytes)}, ` +
            `path ${item.path || "-"}`,
        });
      }
      for (const item of db.rocksdb || []) {
        const name = item.name || "unknown";
        const itemKey = `RocksDB:${name}`;
        const usedBytes = toBytes(item.estimated_total_bytes);
        const peakUsedBytes = toBytes(item.estimated_peak_bytes || usedBytes);
        const memtablesBytes = toBytes(item.memtables_bytes);
        const tableReadersBytes = toBytes(item.table_readers_bytes);
        const blockCacheBytes = toBytes(item.block_cache_bytes);
        const pinnedBytes = toBytes(item.block_cache_pinned_bytes);
        const memtablesPeak = toBytes(item.memtables_peak_bytes || memtablesBytes);
        const readersPeak = toBytes(item.table_readers_peak_bytes || tableReadersBytes);
        const blockPeak = toBytes(item.block_cache_peak_bytes || blockCacheBytes);
        const pinnedPeak = toBytes(item.block_cache_pinned_peak_bytes || pinnedBytes);
        rows.push({
          used_bytes: usedBytes,
          peak_used_bytes: peakUsedBytes,
          name,
          engine: "RocksDB",
          order_key: itemKey,
          detail:
            `memtable ${formatCurPeak(memtablesBytes, memtablesPeak)}, ` +
            `readers ${formatCurPeak(tableReadersBytes, readersPeak)}, ` +
            `block ${formatCurPeak(blockCacheBytes, blockPeak)}, ` +
            `pinned ${formatCurPeak(pinnedBytes, pinnedPeak)}, ` +
            `path ${item.path || "-"}`,
        });
      }
      rows.sort((a, b) => {
        const ra = orderRank[a.order_key] ?? Number.MAX_SAFE_INTEGER;
        const rb = orderRank[b.order_key] ?? Number.MAX_SAFE_INTEGER;
        if (ra !== rb) return ra - rb;
        if (a.engine !== b.engine) return a.engine.localeCompare(b.engine);
        return a.name.localeCompare(b.name);
      });
      renderTableBody("mem-db-body", rows, [
        { key: "used_bytes", type: "bytes" },
        { key: "peak_used_bytes", type: "bytes" },
        { key: "name" },
        { key: "engine" },
        { key: "detail" },
      ]);
      const empty = document.getElementById("mem-db-empty");
      if (empty) empty.style.display = rows.length ? "none" : "block";
    }

    async function refreshMemory() {
      try {
        const resp = await fetch("/api/memory");
        const data = await resp.json();

        setText("mem-updated-at", new Date().toLocaleTimeString());
        const malloc = data.malloc_breakdown || {};
        const freeChunksBytes = toBytes(malloc.free_chunks_bytes);
        setText("mem-kpi-free-chunks", formatBytes(freeChunksBytes));

        const dbStructTotalBytes = toBytes(data.db_plus_struct_bytes);
        const dbStructPeakBytes = toBytes(data.db_plus_struct_peak_bytes || dbStructTotalBytes);
        setCurPeakHtml("mem-kpi-db-struct-total", dbStructTotalBytes, dbStructPeakBytes);

        const obj = data.object_breakdown || {};
        const s0 = obj.stage0 || {};
        const s1 = obj.stage1 || {};
        const s2 = obj.stage2 || {};
        const s3 = obj.stage3 || {};
        renderStage("stage0", s0);
        renderStage("stage1", s1);
        renderStage("stage2", s2);
        renderStage("stage3", s3);
        renderDatabaseBreakdown(data.database_breakdown || {});
      } catch (e) {
        console.error("Memory refresh failed:", e);
      }
    }

    refreshMemory();
    setInterval(refreshMemory, 3000);
  })();
</script>

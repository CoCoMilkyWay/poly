<style>
  .mem-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .mem-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }

  .mem-header h2 {
    font-size: 1.1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .mem-header h2::before {
    content: "";
    width: 3px;
    height: 16px;
    background: #ef4444;
    border-radius: 2px;
  }

  .mem-updated {
    color: #666;
    font-size: 0.75em;
    font-family: monospace;
  }

  .mem-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .mem-kpi {
    background: #252525;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
  }

  .mem-kpi-label {
    font-size: 0.75em;
    color: #666;
    margin-bottom: 2px;
  }

  .mem-kpi-value {
    font-family: monospace;
    font-size: 1em;
    color: #fff;
    font-weight: 600;
  }

  .mem-kpi-value.rss {
    color: #f87171;
  }

  .mem-section {
    margin-top: 10px;
    background: #202020;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px;
  }

  .mem-section-title {
    font-size: 0.85em;
    color: #ddd;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .mem-rollup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
  }

  .mem-rollup-item {
    background: #252525;
    border-radius: 4px;
    padding: 6px 8px;
  }

  .mem-rollup-key {
    font-size: 0.7em;
    color: #777;
  }

  .mem-rollup-val {
    font-family: monospace;
    font-size: 0.8em;
    color: #e5e7eb;
  }

  .mem-table-wrap {
    overflow-x: auto;
  }

  .mem-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75em;
    font-family: monospace;
  }

  .mem-table th,
  .mem-table td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #333;
    white-space: nowrap;
  }

  .mem-table th {
    color: #9ca3af;
    font-weight: 600;
    background: #252525;
    position: sticky;
    top: 0;
  }

  .mem-table td.path {
    max-width: 520px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mem-empty {
    color: #666;
    font-size: 0.8em;
    padding: 6px 0;
  }
</style>

<div class="mem-card">
  <div class="mem-header">
    <h2>进程内存分解</h2>
    <div class="mem-updated" id="mem-updated-at">-</div>
  </div>

  <div class="mem-kpi-grid">
    <div class="mem-kpi">
      <div class="mem-kpi-label">Process RSS</div>
      <div class="mem-kpi-value rss" id="mem-kpi-rss">-</div>
    </div>
    <div class="mem-kpi">
      <div class="mem-kpi-label">Stage2 estimated total</div>
      <div class="mem-kpi-value" id="mem-kpi-s2-total">-</div>
    </div>
    <div class="mem-kpi">
      <div class="mem-kpi-label">Stage2 peak chunk+commit</div>
      <div class="mem-kpi-value" id="mem-kpi-s2-peak">-</div>
    </div>
    <div class="mem-kpi">
      <div class="mem-kpi-label">Stage3 chunk working set</div>
      <div class="mem-kpi-value" id="mem-kpi-s3-work">-</div>
    </div>
    <div class="mem-kpi">
      <div class="mem-kpi-label">Stage3 chunk rows</div>
      <div class="mem-kpi-value" id="mem-kpi-s3-rows">-</div>
    </div>
  </div>

  <div class="mem-section">
    <div class="mem-section-title">对象级估算（Stage2 Builder Top）</div>
    <div class="mem-table-wrap">
      <table class="mem-table">
        <thead>
          <tr>
            <th>Estimated</th>
            <th>Container</th>
          </tr>
        </thead>
        <tbody id="mem-obj-top-body"></tbody>
      </table>
    </div>
    <div class="mem-empty" id="mem-obj-empty" style="display: none">暂时没有对象级数据</div>
  </div>

  <div class="mem-section">
    <div class="mem-section-title">Stage3 运行时工作集估算</div>
    <div class="mem-rollup-grid" id="mem-stage3-runtime"></div>
  </div>
</div>

<script>
  (function () {
    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function renderRollupGrid(id, rows) {
      const box = document.getElementById(id);
      if (!box) return;
      let html = "";
      for (const row of rows) {
        html += `
          <div class="mem-rollup-item">
            <div class="mem-rollup-key">${row.key}</div>
            <div class="mem-rollup-val">${formatBytes(row.value || 0)}</div>
          </div>
        `;
      }
      box.innerHTML = html;
    }

    function renderTableBody(id, rows, cols) {
      const body = document.getElementById(id);
      if (!body) return;
      let html = "";
      for (const row of rows) {
        html += "<tr>";
        for (const col of cols) {
          const val = row[col.key];
          const text = col.type === "bytes" ? formatBytes(val || 0) : (val ?? "");
          const cls = col.key === "path" ? "path" : "";
          html += `<td class="${cls}" title="${col.key === "path" ? (val || "") : ""}">${text}</td>`;
        }
        html += "</tr>";
      }
      body.innerHTML = html;
    }

    async function refreshMemory() {
      try {
        const resp = await fetch("/api/memory");
        const data = await resp.json();

        setText("mem-updated-at", new Date().toLocaleTimeString());
        setText("mem-kpi-rss", formatBytes(data.process_rss_bytes || 0));

        const obj = data.object_breakdown || {};
        const s2 = obj.stage2_builder || {};
        const s3Run = obj.stage3_runtime_last_chunk || {};
        setText("mem-kpi-s2-total", formatBytes(s2.estimated_total_bytes || 0));
        setText("mem-kpi-s2-peak", formatBytes(s2.peak_chunk_plus_commit_bytes || 0));
        setText("mem-kpi-s3-work", formatBytes(s3Run.total_working_set_bytes || 0));
        setText("mem-kpi-s3-rows", String(s3Run.row_count || 0));

        renderRollupGrid("mem-stage3-runtime", [
          { key: "event_inputs", value: s3Run.event_inputs_bytes || 0 },
          { key: "user_blob_pool", value: s3Run.user_blob_pool_bytes || 0 },
          { key: "user_index_maps", value: s3Run.user_index_bytes || 0 },
          { key: "token_states", value: s3Run.token_states_bytes || 0 },
          { key: "bucket_agg", value: s3Run.bucket_agg_bytes || 0 },
          { key: "event_facts", value: s3Run.event_facts_bytes || 0 },
          { key: "working_set_total", value: s3Run.total_working_set_bytes || 0 },
          { key: "working_set_peak", value: s3Run.peak_working_set_bytes || 0 },
        ]);

        const objRows = s2.top_containers || [];
        renderTableBody("mem-obj-top-body", objRows, [
          { key: "estimated_bytes", type: "bytes" },
          { key: "name" },
        ]);
        const objEmpty = document.getElementById("mem-obj-empty");
        if (objEmpty) objEmpty.style.display = objRows.length ? "none" : "block";
      } catch (e) {
        console.error("Memory refresh failed:", e);
      }
    }

    refreshMemory();
    setInterval(refreshMemory, 3000);
  })();
</script>

<style>
  .mem-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .mem-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }

  .mem-header h2 {
    font-size: 1.1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .mem-header h2::before {
    content: "";
    width: 3px;
    height: 16px;
    background: #ef4444;
    border-radius: 2px;
  }

  .mem-total {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85em;
  }

  .mem-total-value {
    font-family: monospace;
    font-weight: 600;
    color: #fff;
  }

  .mem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }

  .mem-item {
    background: #252525;
    border-radius: 6px;
    padding: 12px;
    position: relative;
    overflow: hidden;
  }

  .mem-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .mem-item-name {
    font-weight: 600;
    color: #fff;
    font-size: 0.9em;
  }

  .mem-item-pct {
    font-family: monospace;
    font-size: 0.85em;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .mem-item-pct.low {
    background: #166534;
    color: #4ade80;
  }

  .mem-item-pct.medium {
    background: #854d0e;
    color: #fde047;
  }

  .mem-item-pct.high {
    background: #991b1b;
    color: #fca5a5;
  }

  .mem-item-bar {
    height: 4px;
    background: #333;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .mem-item-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .mem-item-fill.low {
    background: linear-gradient(90deg, #22c55e, #16a34a);
  }

  .mem-item-fill.medium {
    background: linear-gradient(90deg, #eab308, #ca8a04);
  }

  .mem-item-fill.high {
    background: linear-gradient(90deg, #ef4444, #dc2626);
  }

  .mem-item-stats {
    display: flex;
    justify-content: space-between;
    font-size: 0.75em;
    color: #666;
    font-family: monospace;
  }

  .mem-item-usage {
    color: #888;
  }

  .mem-item-limit {
    color: #555;
  }

  .mem-detail {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #333;
    display: none;
    max-height: 150px;
    overflow-y: auto;
  }

  .mem-detail.show {
    display: block;
  }

  .mem-detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.7em;
    font-family: monospace;
    padding: 2px 0;
    color: #888;
  }

  .mem-detail-row .tag {
    color: #6366f1;
  }

  .mem-detail-row .size {
    color: #888;
  }
</style>

<div class="mem-card">
  <div class="mem-header">
    <h2>内存使用</h2>
    <div class="mem-total">
      <span style="color: #ef4444; font-weight: 600">进程 RSS:</span>
      <span class="mem-total-value" id="mem-process-rss" style="color: #ef4444">-</span>
      <span style="color: #555; margin-left: 16px">线程数:</span>
      <span class="mem-total-value" id="mem-thread-count">-</span>
    </div>
  </div>

  <div class="mem-grid" id="mem-grid">
    <div class="mem-item">
      <div class="mem-item-header">
        <span class="mem-item-name">线程信息加载中...</span>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    let expandedRows = new Set();

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    function toggleDetail(name) {
      if (expandedRows.has(name)) {
        expandedRows.delete(name);
      } else {
        expandedRows.add(name);
      }
      const el = document.getElementById("mem-detail-" + name);
      if (el) {
        el.classList.toggle("show", expandedRows.has(name));
      }
    }

    window._toggleMemDetail = toggleDetail;

    async function refreshMemory() {
      try {
        const resp = await fetch("/api/memory");
        const data = await resp.json();

        document.getElementById("mem-process-rss").textContent = formatBytes(data.process_rss_bytes || 0);
        document.getElementById("mem-thread-count").textContent = String((data.threads || []).length);

        const grid = document.getElementById("mem-grid");
        let html = "";

        for (const t of data.threads || []) {
          const rowKey = String(t.tid);
          const stackBytes = t.stack_bytes || 0;
          const isExpanded = expandedRows.has(rowKey);
          const pctClass = stackBytes >= 8 * 1024 * 1024 ? "high" : stackBytes >= 2 * 1024 * 1024 ? "medium" : "low";
          const barPct = Math.min(100, (stackBytes / (8 * 1024 * 1024)) * 100);

          html += `
            <div class="mem-item">
              <div class="mem-item-header" onclick="window._toggleMemDetail('${rowKey}')">
                <span class="mem-item-name">tid=${t.tid} ${t.name || "unknown"} <span style="color:#555;font-size:0.8em">▼</span></span>
                <span class="mem-item-pct ${pctClass}">${formatBytes(stackBytes)}</span>
              </div>
              <div class="mem-item-bar">
                <div class="mem-item-fill ${pctClass}" style="width: ${barPct}%"></div>
              </div>
              <div class="mem-item-stats">
                <span class="mem-item-usage">stack: ${formatBytes(stackBytes)}</span>
                <span class="mem-item-limit">基准: 8MB</span>
              </div>
              <div class="mem-detail ${isExpanded ? 'show' : ''}" id="mem-detail-${rowKey}">
                <div class="mem-detail-row"><span class="tag">tid</span><span class="size">${t.tid}</span></div>
                <div class="mem-detail-row"><span class="tag">name</span><span class="size">${t.name || "unknown"}</span></div>
                <div class="mem-detail-row"><span class="tag">stack_bytes</span><span class="size">${stackBytes}</span></div>
              </div>
            </div>
          `;
        }

        grid.innerHTML = html;
      } catch (e) {
        console.error("Memory refresh failed:", e);
      }
    }

    refreshMemory();
    setInterval(refreshMemory, 3000);
  })();
</script>

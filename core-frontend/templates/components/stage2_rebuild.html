<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 12px 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage2-header h2 {
    font-size: 1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-progress {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .stage2-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 0.8em;
    font-family: monospace;
    margin-bottom: 6px;
  }

  .stage2-row:last-child {
    margin-bottom: 0;
  }

  .stage2-item {
    display: flex;
    gap: 4px;
    align-items: baseline;
  }

  .stage2-label {
    color: #666;
  }

  .stage2-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-value.zero {
    color: #444;
  }

  .stage2-value.highlight {
    color: #60a5fa;
  }

  .stage2-sep {
    color: #333;
    margin: 0 2px;
  }

  .stage2-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 4px;
    padding: 4px 10px;
  }

  .stage2-stat-label {
    font-size: 0.65em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 0.9em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>同步用户</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-progress">
    <div
      class="stage2-progress-bar"
      id="stage2-progress-bar"
      style="width: 0%"
    ></div>
  </div>

  <div class="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">ETA</div>
      <div class="stage2-stat-value" id="s2-eta">-</div>
    </div>
  </div>

  <div class="stage2-row">
    <span class="stage2-item">
      <span class="stage2-label">用户</span>
      <span class="stage2-value highlight" id="s2-total-users">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">市场</span>
      <span class="stage2-value highlight" id="s2-total-markets">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">问题</span>
      <span class="stage2-value highlight" id="s2-total-conditions">0</span>
      <span style="color: #555">(</span><span style="color: #d4a574">AMM</span
      ><span class="stage2-value" id="s2-cnt-cond-amm">0</span>
      <span style="color: #a5d474">Norm</span
      ><span class="stage2-value" id="s2-cnt-cond-normal">0</span>
      <span style="color: #d474d4">Neg</span
      ><span class="stage2-value" id="s2-cnt-cond-negrisk">0</span
      ><span style="color: #555">)</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">代币</span>
      <span class="stage2-value highlight" id="s2-total-tokens">0</span>
    </span>
  </div>

  <div class="stage2-row">
    <span class="stage2-item">
      <span class="stage2-label">订单</span>
      <span class="stage2-value" id="s2-cnt-order">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">铸币</span>
      <span class="stage2-value" id="s2-cnt-split">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">合币</span>
      <span class="stage2-value" id="s2-cnt-merge">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">赎回</span>
      <span class="stage2-value" id="s2-cnt-redemption">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">转换</span>
      <span class="stage2-value" id="s2-cnt-convert">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">AMM</span>
      <span class="stage2-value" id="s2-cnt-fpmm-trade">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">LP</span>
      <span class="stage2-value" id="s2-cnt-fpmm-funding">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">转账</span>
      <span class="stage2-value" id="s2-cnt-transfer">0</span>
    </span>
    <span class="stage2-sep">|</span>
    <span class="stage2-item">
      <span class="stage2-label" style="color:#888">非USDC</span>
      <span class="stage2-value" style="color:#666" id="s2-cnt-non-usdc">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label" style="color:#888">非Poly</span>
      <span class="stage2-value" style="color:#666" id="s2-cnt-non-poly">0</span>
    </span>
  </div>
</div>

<script>
  (function () {
    function s2Fmt(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function s2FmtNum(n) {
      return n.toLocaleString();
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();

    function s2UpdateStats(s) {
      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      document.getElementById("s2-last-block").textContent = s2FmtNum(cursor);
      document.getElementById("s2-head-block").textContent =
        s2FmtNum(headBlock);
      document.getElementById("s2-behind").textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        document.getElementById("s2-speed").textContent =
          s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60)
            document.getElementById("s2-eta").textContent =
              Math.round(eta) + "s";
          else if (eta < 3600)
            document.getElementById("s2-eta").textContent =
              Math.round(eta / 60) + "m";
          else
            document.getElementById("s2-eta").textContent =
              (eta / 3600).toFixed(1) + "h";
        } else {
          document.getElementById("s2-eta").textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2Set(id, value) {
      const el = document.getElementById(id);
      el.textContent = s2Fmt(value || 0);
      el.classList.toggle("zero", !value);
    }

    function s2UpdateProgress(s) {
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");

      s2UpdateStats(s);

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const progress = headBlock > 0 ? (cursor / headBlock) * 100 : 0;
      bar.style.width = progress.toFixed(2) + "%";

      s2Set("s2-total-users", s.total_users);
      s2Set("s2-total-markets", s.total_markets);
      s2Set("s2-total-conditions", s.total_conditions);
      s2Set("s2-total-tokens", s.total_tokens);
      s2Set("s2-cnt-cond-amm", s.cnt_cond_amm);
      s2Set("s2-cnt-cond-normal", s.cnt_cond_normal);
      s2Set("s2-cnt-cond-negrisk", s.cnt_cond_negrisk);
      s2Set("s2-cnt-order", s.cnt_order);
      s2Set("s2-cnt-split", s.cnt_split);
      s2Set("s2-cnt-merge", s.cnt_merge);
      s2Set("s2-cnt-redemption", s.cnt_redemption);
      s2Set("s2-cnt-convert", s.cnt_convert);
      s2Set("s2-cnt-fpmm-trade", s.cnt_fpmm_trade);
      s2Set("s2-cnt-fpmm-funding", s.cnt_fpmm_funding);
      s2Set("s2-cnt-transfer", s.cnt_transfer);
      s2Set("s2-cnt-non-usdc", s.cnt_non_usdc_fpmm);
      s2Set("s2-cnt-non-poly", s.cnt_non_polymarket);

      if (sync.syncing) {
        badge.className = "badge badge-warning";
        badge.textContent = "同步中";
      } else if (cursor >= headBlock && headBlock > 0) {
        badge.className = "badge badge-success";
        badge.textContent = "已同步";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {
      try {
        const resp = await fetch("/api/rebuild-status");
        const status = await resp.json();
        s2UpdateProgress(status);
        if (
          status.phase === 7 &&
          !status.running &&
          typeof rpOnRebuildDone === "function"
        ) {
          rpOnRebuildDone();
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      s2Poll();
      setInterval(s2Poll, 2000);
    });
  })();
</script>

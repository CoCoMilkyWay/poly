<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 12px 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage2-header h2 {
    font-size: 1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-progress {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .stage2-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 0.8em;
    font-family: monospace;
    margin-bottom: 6px;
  }

  .stage2-row:last-child {
    margin-bottom: 0;
  }

  .stage2-item {
    display: flex;
    gap: 4px;
    align-items: baseline;
  }

  .stage2-label {
    color: #666;
  }

  .stage2-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-value.zero {
    color: #444;
  }

  .stage2-value.highlight {
    color: #60a5fa;
  }

  .stage2-sep {
    color: #333;
    margin: 0 2px;
  }

  .stage2-tree {
    font-size: 0.75em;
    font-family: monospace;
  }

  .stage2-tree-node {
    cursor: pointer;
    user-select: none;
  }

  .stage2-tree-node:hover {
    background: #252525;
    margin: 0 -8px;
    padding: 0 8px;
  }

  .stage2-tree-toggle {
    display: inline-block;
    width: 12px;
    color: #555;
    text-align: center;
  }

  .stage2-tree-label {
    color: #888;
  }

  .stage2-tree-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-tree-value.zero {
    color: #444;
  }

  .stage2-tree-children {
    padding-left: 16px;
    display: none;
  }

  .stage2-tree-children.expanded {
    display: block;
  }

  .stage2-tree-leaf {
    padding-left: 16px;
  }

  .stage2-tree-leaf .stage2-tree-label {
    color: #666;
  }

  .stage2-tree-desc {
    color: #777;
    font-size: 0.9em;
    margin-left: 6px;
  }

  .stage2-tree-scene {
    color: #555;
    font-size: 0.85em;
    margin-left: 6px;
    font-style: italic;
  }

  .stage2-tree-scene::before {
    content: "// ";
    color: #444;
  }

  /* 恒等式样式 */
  .stage2-tree-node,
  .stage2-tree-leaf {
    line-height: 1.5;
  }

  .stage2-tree-node .stage2-tree-value,
  .stage2-tree-leaf .stage2-tree-value {
    padding: 0 2px;
    border-radius: 2px;
  }

  .stage2-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 4px;
    padding: 4px 10px;
  }

  .stage2-stat-label {
    font-size: 0.65em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 0.9em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>同步用户</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-progress">
    <div class="stage2-progress-bar" id="stage2-progress-bar" style="width: 0%"></div>
  </div>

  <div class="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">ETA</div>
      <div class="stage2-stat-value" id="s2-eta">-</div>
    </div>
  </div>

  <div class="stage2-row">
    <span class="stage2-item">
      <span class="stage2-label">用户</span>
      <span class="stage2-value highlight" id="s2-total-users">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">市场</span>
      <span class="stage2-value highlight" id="s2-total-markets">0</span>
    </span>
    <button id="s2-collapse-all" style="
        margin-left: auto;
        background: #333;
        border: 1px solid #555;
        color: #aaa;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7em;
        cursor: pointer;
      ">
      全部折叠
    </button>
  </div>

  <div class="stage2-tree" id="s2-cond-tree"></div>
  <div class="stage2-tree" id="s2-token-tree"></div>
  <div class="stage2-tree" id="s2-xfer-tree"></div>
</div>

<script>
  (function () {
    function s2Fmt(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function s2FmtNum(n) {
      return n.toLocaleString();
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();
    // 默认全部展开的节点集合
    let s2ExpandedNodes = new Set([
      // 问题树 (树状partition: total→polymarket/other→...)
      "cond",
      "cond_poly",
      "cond_tr",
      "cond_other",
      // 代币树 (树状partition: total→polymarket/other→...)
      "token",
      "token_poly",
      "token_tr",
      "token_fpmm",
      "token_fpmm_by_collateral",
      "token_other",
      "token_transfer",
      "token_transfer_by_collateral",
      // Transfer树
      "xfer",
      "user_events",
      "internal",
      "split",
      "split_poly",
      "merge",
      "merge_poly",
      "redemption",
      "order",
      "fpmm_trade",
      "fpmm_lp",
      "transfer",
      "transfer_in",
      "transfer_in_poly",
      "transfer_out",
      "transfer_out_poly",
      "split_non_poly_coll",
      "merge_non_poly_coll",
      "redemption_non_poly_coll",
      "fpmm_trade_coll",
      "fpmm_lp_coll",
      "internal_mint",
      "internal_burn",
      "internal_transfer",
    ]);
    let s2AllExpanded = true;

    function s2UpdateStats(s) {
      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      document.getElementById("s2-last-block").textContent = s2FmtNum(cursor);
      document.getElementById("s2-head-block").textContent =
        s2FmtNum(headBlock);
      document.getElementById("s2-behind").textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        document.getElementById("s2-speed").textContent =
          s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60)
            document.getElementById("s2-eta").textContent =
              Math.round(eta) + "s";
          else if (eta < 3600)
            document.getElementById("s2-eta").textContent =
              Math.round(eta / 60) + "m";
          else
            document.getElementById("s2-eta").textContent =
              (eta / 3600).toFixed(1) + "h";
        } else {
          document.getElementById("s2-eta").textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2Set(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = s2Fmt(value || 0);
      el.classList.toggle("zero", !value);
    }

    // 构建问题(Condition)树 - 树状partition
    // total = polymarket + other
    // polymarket = token_reg + fpmm_poly
    // token_reg = amm + negrisk + orderbook + other
    // other = prep + fpmm_other
    function s2BuildCondTree(s) {
      const ct = s.cond_tree || {};
      const poly = ct.polymarket || {};
      const tr = poly.token_reg || {};
      const other = ct.other || {};
      const trOrderbook = tr.orderbook ?? tr.normal ?? 0;
      const trOther = tr.other ?? 0;
      const fpmmPoly = poly.fpmm_poly ?? poly.fpmm_only ?? 0;
      const fpmmOther = other.fpmm_other ?? other.other_fpmm ?? 0;

      return {
        id: "cond",
        label: "问题",
        value: ct.total || 0,
        color: "#60a5fa",
        desc: "condition分类总览",
        scene: "CTF问题来源分层",
        children: [
          {
            id: "cond_poly",
            label: "Polymarket",
            value: poly.total || 0,
            color: "#4ade80",
            desc: "Polymarket子树",
            scene: "已确认归属Polymarket",
            children: [
              {
                id: "cond_tr",
                label: "TokenReg",
                value: tr.total || 0,
                color: "#86efac",
                desc: "TokenRegistered子类",
                scene: "在Exchange登记过",
                children: [
                  {
                    id: "cond_tr_amm",
                    label: "AMM",
                    value: tr.amm || 0,
                    color: "#bbf7d0",
                    desc: "poly & treg & amm",
                    scene: "注册后又创建了AMM池",
                  },
                  {
                    id: "cond_tr_nr",
                    label: "NegRisk",
                    value: tr.negrisk || 0,
                    color: "#bbf7d0",
                    desc: "poly & treg & nr",
                    scene: "多选题市场(谁当选总统)",
                  },
                  {
                    id: "cond_tr_norm",
                    label: "OB",
                    value: trOrderbook,
                    color: "#bbf7d0",
                    desc: "poly & treg & ob",
                    scene: "无AMM池,只有挂单交易",
                  },
                  {
                    id: "cond_tr_other",
                    label: "Other(预期=0)",
                    value: trOther,
                    color: "#555",
                    desc: "poly & treg & other0",
                    scene: "Polymarket-TokenReg未覆盖项",
                  },
                ],
              },
              {
                id: "cond_fpmm",
                label: "FPMM",
                value: fpmmPoly,
                color: "#86efac",
                desc: "poly & fcreate & !treg",
                scene: "只创建AMM池,未注册Exchange",
              },
            ],
          },
          {
            id: "cond_other",
            label: "其他",
            value: other.total || 0,
            color: "#9ca3af",
            desc: "非Polymarket子树",
            scene: "无法确认属于Polymarket",
            children: [
              {
                id: "cond_prep",
                label: "Prep",
                value: other.prep || 0,
                color: "#d1d5db",
                desc: "!poly & cprep",
                scene: "早期或其他协议(如Omen)",
              },
              {
                id: "cond_ofpmm",
                label: "FPMM",
                value: fpmmOther,
                color: "#555",
                desc: "!poly & fcreate",
                scene: "非Polymarket来源的FPMMCreation",
              },
            ],
          },
        ],
      };
    }

    // 构建代币(Token)树 - 树状partition
    // total = polymarket + other
    // polymarket = token_reg + fpmm_poly
    // token_reg = amm + negrisk + orderbook + other
    // fpmm_poly = by_collateral_fpmm
    // other = fpmm_other + transfer_inferred
    function s2BuildTokenTree(s) {
      const tt = s.token_tree || {};
      const poly = tt.polymarket || {};
      const tr = poly.token_reg || {};
      const fo = poly.fpmm_poly || poly.fpmm_only || {};
      const other = tt.other || {};
      const trOrderbook = tr.orderbook ?? tr.normal ?? 0;
      const trOther = tr.other ?? 0;
      const fpmmOther = other.fpmm_other ?? other.other_fpmm ?? 0;
      const transferInferredByCollateral = other.by_collateral_transfer_inferred || [];
      const transferInferredByToken = other.transfer_inferred_by_token || [];

      return {
        id: "token",
        label: "代币",
        value: tt.total || 0,
        color: "#f59e0b",
        desc: "token分类总览",
        scene: "ERC1155 token_id来源分层",
        children: [
          {
            id: "token_poly",
            label: "Polymarket",
            value: poly.total || 0,
            color: "#fbbf24",
            desc: "Polymarket子树",
            scene: "已确认归属Polymarket",
            children: [
              {
                id: "token_tr",
                label: "TokenReg",
                value: tr.total || 0,
                color: "#fcd34d",
                desc: "TokenRegistered子类",
                scene: "Exchange事件直接给token",
                children: [
                  {
                    id: "token_tr_amm",
                    label: "AMM",
                    value: tr.amm || 0,
                    color: "#fde68a",
                    desc: "poly & treg & amm",
                    scene: "注册后又创建了AMM池",
                  },
                  {
                    id: "token_tr_nr",
                    label: "NegRisk",
                    value: tr.negrisk || 0,
                    color: "#fde68a",
                    desc: "poly & treg & nr",
                    scene: "多选题市场代币",
                  },
                  {
                    id: "token_tr_norm",
                    label: "OB",
                    value: trOrderbook,
                    color: "#fde68a",
                    desc: "poly & treg & ob",
                    scene: "无AMM池,只有挂单",
                  },
                  {
                    id: "token_tr_other",
                    label: "Other(预期=0)",
                    value: trOther,
                    color: "#555",
                    desc: "poly & treg & other0",
                    scene: "Polymarket-TokenReg未覆盖项",
                  },
                ],
              },
              {
                id: "token_fpmm",
                label: "FPMM",
                value: fo.total || 0,
                color: "#fcd34d",
                desc: "poly & fcreate & !treg",
                scene: "只创建AMM池,未注册Exchange",
                children: [
                  {
                    id: "token_fpmm_by_collateral",
                    label: "(动态) by_collateral_fpmm",
                    value: (fo.by_collateral_fpmm || fo.by_collateral || []).reduce(
                      (acc, c) => acc + Number(c.count || 0),
                      0,
                    ),
                    color: "#fde68a",
                    desc: "group_by(collateral)",
                    scene: "按字段collateral聚合",
                    children: (fo.by_collateral_fpmm || fo.by_collateral || [])
                      .slice()
                      .sort((a, b) => b.count - a.count)
                      .map((c) => ({
                        id: `token_fpmm_coll_${c.addr || c.name}`,
                        label: c.name || "未知代币",
                        value: c.count,
                        color: "#fef3c7",
                        desc: c.addr || "",
                        scene: "",
                      })),
                  },
                ].filter((x) => x.value > 0),
              },
            ],
          },
          {
            id: "token_other",
            label: "其他",
            value: other.total || 0,
            color: "#9ca3af",
            desc: "非Polymarket子树",
            scene: "无法确认属于Polymarket",
            children: [
              {
                id: "token_ofpmm",
                label: "FPMM",
                value: fpmmOther,
                color: "#555",
                desc: "!poly & fcreate",
                scene: "非Polymarket来源的FPMMCreation",
              },
              {
                id: "token_transfer",
                label: "Transfer",
                value: other.transfer_inferred || 0,
                color: "#d1d5db",
                desc: "!poly & xfer_inf",
                scene: "未知token,无condition信息",
                children: [
                  {
                    id: "token_transfer_by_collateral",
                    label: "(动态) by_collateral_transfer_inferred",
                    value:
                      transferInferredByCollateral.length > 0
                        ? transferInferredByCollateral.reduce(
                          (acc, c) => acc + Number(c.count || 0),
                          0,
                        )
                        : transferInferredByToken.reduce(
                          (acc, t) => acc + Number(t.count || 0),
                          0,
                        ),
                    color: "#e5e7eb",
                    desc: "group_by(collateral)",
                    scene: "按字段collateral聚合",
                    children:
                      transferInferredByCollateral.length > 0
                        ? transferInferredByCollateral
                          .slice()
                          .sort((a, b) => b.count - a.count)
                          .map((c) => ({
                            id: `token_transfer_coll_${c.addr || c.name}`,
                            label: c.name || "未知代币",
                            value: c.count,
                            color: "#f3f4f6",
                            desc: c.addr || "",
                            scene: "",
                          }))
                        : transferInferredByToken
                          .slice()
                          .sort((a, b) => b.count - a.count)
                          .map((t) => ({
                            id: `token_transfer_token_${t.token}`,
                            label: "代币",
                            value: t.count,
                            color: "#f3f4f6",
                            desc: t.token || "",
                            scene: "",
                          })),
                  },
                ].filter((x) => x.value > 0),
              },
            ],
          },
        ],
      };
    }

    // EventType常量 (与后端types.hpp对应)
    const EventType = {
      Buy: 0,
      Sell: 1,
      Split: 2,
      Merge: 3,
      Redemption: 4,
      FPMMBuy: 5,
      FPMMSell: 6,
      FPMMLPAdd: 7,
      FPMMLPRemove: 8,
      Convert: 9,
      TransferIn: 10,
      TransferOut: 11,
    };

    function s2MergeByCollateralFromEventTypes(s, eventTypes) {
      const src = s.event_by_collateral || {};
      const byKey = {};
      for (const et of eventTypes) {
        const entries = src[String(et)] || [];
        for (const item of entries) {
          const key = item.addr || item.name;
          if (!key) continue;
          if (!byKey[key]) {
            byKey[key] = { addr: item.addr || "", name: item.name || "", count: 0 };
          }
          byKey[key].count += Number(item.count || 0);
        }
      }
      return Object.values(byKey)
        .filter((x) => x.count > 0)
        .sort((a, b) => b.count - a.count);
    }

    function s2NormalizeByCollateralEntries(entries) {
      if (!Array.isArray(entries)) return [];
      return entries
        .map((x) => ({
          addr: x.addr || "",
          name: x.name || "",
          count: Number(x.count || 0),
        }))
        .filter((x) => x.count > 0)
        .sort((a, b) => b.count - a.count);
    }

    function s2GetByCollateralEntries(s, directKeys, fallbackEventTypes) {
      for (const key of directKeys) {
        const direct = s[key];
        if (Array.isArray(direct) && direct.length > 0) {
          return s2NormalizeByCollateralEntries(direct);
        }
      }
      if (!fallbackEventTypes || fallbackEventTypes.length === 0) return [];
      return s2MergeByCollateralFromEventTypes(s, fallbackEventTypes);
    }

    function s2BuildByCollateralNode(nodeId, label, entries, scene, prefix) {
      if (!entries || entries.length === 0) return null;
      return {
        id: nodeId,
        label: label,
        value: entries.reduce((acc, x) => acc + x.count, 0),
        color: "#fcd34d",
        desc: "",
        scene: scene || "",
        children: entries.map((c) => ({
          id: `${prefix}_coll_${c.addr || c.name}`,
          label: c.name || "未知抵押品",
          value: c.count,
          color: "#fde68a",
          desc: c.addr || "",
          scene: "",
        })),
      };
    }

    // 构建Transfer树 (s2-xfer-tree)
    function s2BuildXferTree(s) {
      // Split/Merge/Redemption 包含 Poly + NonPoly
      const split_poly =
        (s.xfer_split_normal || 0) + (s.xfer_split_negrisk || 0);
      const split_non_poly = s.xfer_split_non_poly || 0;
      const split = split_poly + split_non_poly;

      const merge_poly =
        (s.xfer_merge_normal || 0) + (s.xfer_merge_negrisk || 0);
      const merge_non_poly = s.xfer_merge_non_poly || 0;
      const merge = merge_poly + merge_non_poly;

      const redemption_poly = s.xfer_redemption || 0;
      const redemption_non_poly = s.xfer_redemption_non_poly || 0;
      const redemption = redemption_poly + redemption_non_poly;

      // Polymarket 专属操作
      const order = (s.xfer_order_buy || 0) + (s.xfer_order_sell || 0);
      const fpmm_trade = (s.xfer_fpmm_buy || 0) + (s.xfer_fpmm_sell || 0);
      const fpmm_lp =
        (s.xfer_lp_add || 0) +
        (s.xfer_lp_remove || 0) +
        (s.xfer_lp_return || 0);

      // Transfer 包含 Poly + NonPoly
      const transfer_in_poly =
        (s.xfer_transfer_in_negrisk || 0) + (s.xfer_transfer_in_other || 0);
      const transfer_in_non_poly = s.xfer_transfer_in_non_poly || 0;
      const transfer_in = transfer_in_poly + transfer_in_non_poly;

      const transfer_out_poly =
        (s.xfer_transfer_out_negrisk || 0) + (s.xfer_transfer_out_other || 0);
      const transfer_out_non_poly = s.xfer_transfer_out_non_poly || 0;
      const transfer_out = transfer_out_poly + transfer_out_non_poly;

      const transfer = transfer_in + transfer_out;

      const user_events =
        split +
        merge +
        redemption +
        (s.xfer_convert || 0) +
        order +
        fpmm_trade +
        fpmm_lp +
        transfer;

      const internal_mint =
        (s.xfer_internal_mint_negrisk || 0) + (s.xfer_internal_mint_fpmm || 0);
      const internal_burn =
        (s.xfer_internal_burn_negrisk || 0) +
        (s.xfer_internal_burn_fpmm || 0) +
        (s.xfer_internal_burn_convert || 0);
      const internal_transfer =
        (s.xfer_internal_transfer_zero || 0) +
        (s.xfer_internal_transfer_order || 0) +
        (s.xfer_internal_transfer_negrisk || 0) +
        (s.xfer_internal_transfer_fpmm || 0) +
        (s.xfer_internal_transfer_other || 0);

    function s2RenderNode(node, depth = 0) {
      const hasChildren = node.children && node.children.length > 0;
      const isExpanded = s2ExpandedNodes.has(node.id);
      const valueClass = node.value ? "" : " zero";
      const color = node.color || "#888";
      const desc = node.desc
        ? `<span class="stage2-tree-desc">${node.desc}</span>`
        : "";
      const scene = node.scene
        ? `<span class="stage2-tree-scene">${node.scene}</span>`
        : "";

      let html = `<div class="${hasChildren ? "stage2-tree-node" : "stage2-tree-leaf"}" data-id="${node.id}">`;
      if (hasChildren) {
        html += `<span class="stage2-tree-toggle">${isExpanded ? "▼" : "▶"}</span>`;
      }
      html += `<span class="stage2-tree-label" style="color:${color}">${node.label}</span> `;
      html += `<span class="stage2-tree-value${valueClass}" style="color:${color}">${s2Fmt(node.value)}</span>`;
      if (desc) html += ` ${desc}`;
      if (scene) html += ` ${scene}`;
      html += `</div>`;

      if (hasChildren) {
        html += `<div class="stage2-tree-children${isExpanded ? " expanded" : ""}">`;
        for (const child of node.children) {
          html += s2RenderNode(child, depth + 1);
        }
        html += `</div>`;
      }
      return html;
    }

    function s2RenderTreeToContainer(tree, containerId) {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = s2RenderNode(tree);
        container.querySelectorAll(".stage2-tree-node").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = el.dataset.id;
            if (s2ExpandedNodes.has(id)) s2ExpandedNodes.delete(id);
            else s2ExpandedNodes.add(id);
            s2RenderAllTrees(window._s2LastData || {});
          });
        });
      }
    }

    function s2RenderAllTrees(s) {
      s2RenderTreeToContainer(s2BuildCondTree(s), "s2-cond-tree");

      s2RenderTreeToContainer(s2BuildXferTree(s), "s2-xfer-tree");
    }

    function s2UpdateProgress(s) {
      window._s2LastData = s;
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");

      s2UpdateStats(s);

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const progress = headBlock > 0 ? (cursor / headBlock) * 100 : 0;
      bar.style.width = progress.toFixed(2) + "%";

      s2Set("s2-total-users", s.total_users);
      s2Set("s2-total-markets", s.total_markets);

      s2RenderAllTrees(s);

      if (sync.syncing) {
        badge.className = "badge badge-warning";
        badge.textContent = "同步中";
      } else if (cursor >= headBlock && headBlock > 0) {
        badge.className = "badge badge-success";
        badge.textContent = "已同步";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {

        const resp = await fetch("/api/rebuild-status");

        s2UpdateProgress(status);
        if (
          status.phase === 7 &&
          !status.running &&
          typeof rpOnRebuildDone === "function"
        ) {
          rpOnRebuildDone();
        }
      } catch (e) { }
    }

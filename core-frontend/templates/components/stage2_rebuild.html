<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }

  .stage2-header h2 {
    font-size: 1.1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 16px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-stats {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 6px;
    padding: 8px 12px;
    min-width: 90px;
  }

  .stage2-stat-label {
    font-size: 0.7em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 1em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }

  .stage2-stat-value.synced {
    color: #4ade80;
  }

  .stage2-stat-value.behind {
    color: #fde047;
  }

  .stage2-progress {
    height: 6px;
    background: #333;
    border-radius: 3px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 3px;
    transition: width 0.3s;
  }

  .stage2-log {
    font-family: monospace;
    font-size: 0.8em;
    color: #aaa;
    padding: 8px 12px;
    background: #151515;
    border-radius: 4px;
    line-height: 1.8;
  }

  .stage2-log .done {
    color: #10b981;
  }
  .stage2-log .active {
    color: #f59e0b;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>PnL重建器</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-stats" id="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">ETA</div>
      <div class="stage2-stat-value" id="s2-eta">-</div>
    </div>
  </div>

  <div class="stage2-progress">
    <div
      class="stage2-progress-bar"
      id="stage2-progress-bar"
      style="width: 0%"
    ></div>
  </div>
  <div class="stage2-log" id="stage2-log">等待 Stage1 同步数据...</div>
</div>

<script>
  (function () {
    function s2Fmt(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function s2FmtNum(n) {
      return n.toLocaleString();
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();

    function s2UpdateStats(s) {
      const lastBlockEl = document.getElementById("s2-last-block");
      const headBlockEl = document.getElementById("s2-head-block");
      const behindEl = document.getElementById("s2-behind");
      const speedEl = document.getElementById("s2-speed");
      const etaEl = document.getElementById("s2-eta");

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      lastBlockEl.textContent = s2FmtNum(cursor);
      headBlockEl.textContent = s2FmtNum(headBlock);
      behindEl.textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        speedEl.textContent = s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60) etaEl.textContent = Math.round(eta) + "s";
          else if (eta < 3600) etaEl.textContent = Math.round(eta / 60) + "m";
          else etaEl.textContent = (eta / 3600).toFixed(1) + "h";
        } else {
          etaEl.textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2UpdateProgress(s) {
      const log = document.getElementById("stage2-log");
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");
      const lines = [];

      s2UpdateStats(s);

      let progress = 0;
      if (s.phase >= 1) {
        progress = 10;
        if (s.phase > 1) {
          lines.push(
            `<span class="done">✓</span> 元数据: ${s2Fmt(s.total_conditions)} 问题, ${s2Fmt(s.total_tokens)} 代币`,
          );
        } else {
          lines.push(`<span class="active">●</span> 加载元数据中...`);
        }
      }

      if (s.phase >= 2) {
        progress = 30;
        const scans = [
          { name: "订单", key: "order_filled" },
          { name: "铸币", key: "split" },
          { name: "合币", key: "merge" },
          { name: "赎回", key: "redemption" },
          { name: "AMM", key: "fpmm_trade" },
          { name: "LP", key: "fpmm_funding" },
          { name: "转换", key: "convert" },
          { name: "转账", key: "transfer" },
        ];
        const parts = [];
        for (const sc of scans) {
          const obj = s[sc.key];
          if (obj && obj.rows > 0) {
            parts.push(`${sc.name}:${s2Fmt(obj.rows)}`);
          }
        }
        if (s.phase > 2) {
          lines.push(`<span class="done">✓</span> 索引: ${parts.join(" | ")}`);
          lines.push(
            `<span class="done">✓</span> 事件: ${s2Fmt(s.total_events)} → ${s2Fmt(s.total_users)} 用户`,
          );
          progress = 70;
        } else {
          lines.push(
            `<span class="active">●</span> 索引: ${parts.join(" | ")}`,
          );
        }
      }

      if (s.phase >= 3) {
        const pct = s.total_users
          ? Math.round((s.processed_users / s.total_users) * 100)
          : 0;
        progress = 70 + pct * 0.3;
        if (s.phase > 3) {
          lines.push(
            `<span class="done">✓</span> 回放: ${s2Fmt(s.total_users)} 用户完成`,
          );
          progress = 100;
        } else {
          lines.push(
            `<span class="active">●</span> 回放: ${s2Fmt(s.processed_users)}/${s2Fmt(s.total_users)} (${pct}%)`,
          );
        }
      }

      if (s.phase === 7) {
        const total = (
          (s.phase1_ms + s.phase2_ms + s.phase3_ms) /
          1000
        ).toFixed(1);
        lines.push(
          `<b style="color:#10b981">就绪: ${s2Fmt(s.total_users)} 用户, ${s2Fmt(s.total_events)} 事件 (${total}s)</b>`,
        );
      }

      if (lines.length === 0) {
        lines.push("等待 Stage1 同步数据...");
      }

      log.innerHTML = lines.join("<br>");
      bar.style.width = progress + "%";

      if (s.running) {
        badge.className = "badge badge-warning";
        badge.textContent = "构建中";
      } else if (s.phase === 7) {
        badge.className = "badge badge-success";
        badge.textContent = "就绪";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {
      try {
        const resp = await fetch("/api/rebuild-status");
        const status = await resp.json();
        s2UpdateProgress(status);
        if (
          status.phase === 7 &&
          !status.running &&
          typeof rpOnRebuildDone === "function"
        ) {
          rpOnRebuildDone();
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      s2Poll();
      setInterval(s2Poll, 2000);
    });
  })();
</script>

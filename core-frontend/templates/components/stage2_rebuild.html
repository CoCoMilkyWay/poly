<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 12px 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage2-header h2 {
    font-size: 1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-progress {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .stage2-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 0.8em;
    font-family: monospace;
    margin-bottom: 6px;
  }

  .stage2-row:last-child {
    margin-bottom: 0;
  }

  .stage2-item {
    display: flex;
    gap: 4px;
    align-items: baseline;
  }

  .stage2-label {
    color: #666;
  }

  .stage2-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-value.zero {
    color: #444;
  }

  .stage2-value.highlight {
    color: #60a5fa;
  }

  .stage2-sep {
    color: #333;
    margin: 0 2px;
  }

  .stage2-tree {
    font-size: 0.75em;
    font-family: monospace;
  }

  .stage2-tree-node {
    cursor: pointer;
    user-select: none;
  }

  .stage2-tree-node:hover {
    background: #252525;
    margin: 0 -8px;
    padding: 0 8px;
  }

  .stage2-tree-toggle {
    display: inline-block;
    width: 12px;
    color: #555;
    text-align: center;
  }

  .stage2-tree-label {
    color: #888;
  }

  .stage2-tree-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-tree-value.zero {
    color: #444;
  }

  .stage2-tree-children {
    padding-left: 16px;
    display: none;
  }

  .stage2-tree-children.expanded {
    display: block;
  }

  .stage2-tree-leaf {
    padding-left: 16px;
  }

  .stage2-tree-leaf .stage2-tree-label {
    color: #666;
  }

  .stage2-tree-desc {
    color: #777;
    font-size: 0.9em;
    margin-left: 6px;
  }

  .stage2-tree-scene {
    color: #555;
    font-size: 0.85em;
    margin-left: 6px;
    font-style: italic;
  }

  .stage2-tree-scene::before {
    content: "// ";
    color: #444;
  }

  /* 恒等式样式 */
  .stage2-tree-node,
  .stage2-tree-leaf {
    line-height: 1.5;
  }

  .stage2-tree-node .stage2-tree-value,
  .stage2-tree-leaf .stage2-tree-value {
    padding: 0 2px;
    border-radius: 2px;
  }

  .stage2-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 4px;
    padding: 4px 10px;
  }

  .stage2-stat-label {
    font-size: 0.65em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 0.9em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>同步用户</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-progress">
    <div class="stage2-progress-bar" id="stage2-progress-bar" style="width: 0%"></div>
  </div>

  <div class="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>

  <div class="stage2-row">

    </span>
    <button id="s2-collapse-all" style="
        margin-left: auto;
        background: #333;

        padding: 2px 8px;

      全部折叠
    </button>
  </div>

  <div class="stage2-tree" id="s2-cond-tree"></div>
  <div class="stage2-tree" id="s2-token-tree"></div>
  <div class="stage2-tree" id="s2-xfer-tree"></div>
  <div class="stage2-tree" id="s2-split-sem-tree"></div>
  <div class="stage2-tree" id="s2-merge-sem-tree"></div>
  <div class="stage2-tree" id="s2-convert-sem-tree"></div>
  <div class="stage2-tree" id="s2-order-sem-tree"></div>
</div>

<script>
  (function () {
    const S2_EVENT_TYPE = Object.freeze({
      ORDER_BUY: 0,
      ORDER_SELL: 1,
      SPLIT_NON_POLY: 4,
      MERGE_NON_POLY: 7,
      REDEMPTION_NON_POLY: 9,
      FPMM_BUY: 11,
      FPMM_SELL: 12,
      FPMM_LP_ADD: 13,
      FPMM_LP_REMOVE: 14,
      FPMM_LP_RETURN: 15,
      TRANSFER_IN_NEGRISK: 16,
      TRANSFER_IN_OTHER: 17,
      TRANSFER_IN_NON_POLY: 18,
      TRANSFER_OUT_NEGRISK: 19,
      TRANSFER_OUT_OTHER: 20,
      TRANSFER_OUT_NON_POLY: 21,
    });

    function s2DefaultExpandedNodeIds() {
      return [
        "cond",
        "cond_poly",
        "cond_tr",
        "cond_tr_nr",
        "cond_tr_nr_stats",
        "cond_tr_nr_qpm",
        "cond_other",
        "cond_split",
        "cond_merge",
        "cond_redemption",
        "cond_resolve",
        "cond_collateral",
        "cond_tokenized",
        "cond_coverage",
        "cond_cov_outcome",
        "cond_cov_question",
        "token",
        "token_poly",
        "token_tr",
        "token_fpmm",
        "token_fpmm_by_collateral",
        "token_other",
        "token_split",
        "token_merge",
        "token_redemption",
        "token_transfer",
        "token_transfer_by_collateral",
        "xfer",
        "user_events",
        "internal",
        "split",
        "split_poly",
        "split_non_poly",
        "split_non_poly_coll",
        "merge",
        "merge_poly",
        "merge_non_poly",
        "merge_non_poly_coll",
        "redemption",
        "redemption_non_poly",
        "redemption_non_poly_coll",
        "order",
        "order_coll",
        "fpmm_trade",
        "fpmm_trade_coll",
        "fpmm_lp",
        "fpmm_lp_coll",
        "transfer",
        "transfer_coll",
        "transfer_in",
        "transfer_in_poly",
        "transfer_out",
        "transfer_out_poly",
        "internal_mint",
        "internal_burn",
        "internal_transfer",
        "split_sem",
        "split_sem_amount",
        "split_sem_parent",
        "split_sem_partition",
        "split_sem_consume",
        "merge_sem",
        "merge_sem_amount",
        "merge_sem_parent",
        "merge_sem_partition",
        "merge_sem_consume",
        "convert_sem",
        "convert_sem_amount",
        "convert_sem_questions",
        "convert_sem_consume",
        "order_sem",
        "order_sem_side",
        "order_sem_amount",
        "order_sem_consume",
      ];
    }

    function s2FmtSig(n, sig = 5) {
      if (!Number.isFinite(n)) return "-";
      if (n === 0) return "0";
      if (Number.isInteger(n)) return String(n);
      return Number(n).toPrecision(sig).replace(/\.?0+$/g, "");
    }

    function s2Fmt(n) {
      const v = Number(n || 0);
      const abs = Math.abs(v);
      if (abs >= 1000000) return s2FmtSig(v / 1000000, 5) + "M";
      if (abs >= 1000) return s2FmtSig(v / 1000, 5) + "K";
      return s2FmtSig(v, 5);
    }

    function s2FmtNum(n) {
      const v = Number(n || 0);
      if (Number.isInteger(v)) return v.toLocaleString();
      return s2FmtSig(v, 5);
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();
    let s2ExpandedNodes = new Set(s2DefaultExpandedNodeIds());
    let s2AllExpanded = true;

    function s2UpdateStats(s) {
      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      document.getElementById("s2-last-block").textContent = s2FmtNum(cursor);
      document.getElementById("s2-head-block").textContent =
        s2FmtNum(headBlock);
      document.getElementById("s2-behind").textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        document.getElementById("s2-speed").textContent =
          s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60)
            document.getElementById("s2-eta").textContent =
              Math.round(eta) + "s";
          else if (eta < 3600)
            document.getElementById("s2-eta").textContent =
              Math.round(eta / 60) + "m";
          else
            document.getElementById("s2-eta").textContent =
              (eta / 3600).toFixed(1) + "h";
        } else {
          document.getElementById("s2-eta").textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2Set(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = s2Fmt(value || 0);
      el.classList.toggle("zero", !value);
    }

    function s2SortedDictChildren(dictObj, idPrefix, labelFn, color) {
      return Object.entries(dictObj || {})
        .map(([k, v]) => [k, Number(v || 0)])
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => ({
          id: `${idPrefix}_${k}`,
          label: labelFn(k),
          value: v,
          color,
        }));
    }

    // 构建条件(Condition)树 - 主树
    // total = polymarket + other
    // polymarket = token_reg + fpmm_poly
    // token_reg = amm + negrisk + orderbook + other
    // other = prep + fpmm_other + split + merge + redemption
    function s2BuildCondTree(s) {
      const ct = s.cond_tree || {};
      const poly = ct.polymarket || {};
      const tr = poly.token_reg || {};
      const other = ct.other || {};
      const nr = tr.negrisk_stats || {};
      const resolve = ct.resolve || {};
      const tokenized = ct.tokenized || {};
      const coverage = ct.coverage || {};
      const trOrderbook = tr.orderbook ?? 0;
      const trOther = tr.other ?? 0;
      const fpmmPoly = poly.fpmm_poly ?? 0;
      const fpmmOther = other.fpmm_other ?? 0;
      const splitOther = other.split ?? 0;
      const mergeOther = other.merge ?? 0;
      const redemptionOther = other.redemption ?? 0;
      const qpm = nr.by_questions_per_market || {};
      const byOutcome = coverage.by_outcome_count || {};
      const recordedConditions = Number(coverage.recorded_conditions ?? 0);
      const byCollateral = (ct.by_collateral || [])
        .slice()
        .sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
      const collateralTotal = byCollateral.reduce(
        (acc, row) => acc + Number(row.count || 0),
        0,
      );
      const resolveTotal =
        Number(resolve.resolved || 0) + Number(resolve.unresolved || 0);
      const tokenizedTotal =
        Number(tokenized.none || 0) +
        Number(tokenized.partial || 0) +
        Number(tokenized.full || 0);
      const qpmTotal = Object.values(qpm).reduce((a, b) => a + Number(b || 0), 0);
      const byOutcomeTotal = Object.values(byOutcome).reduce(
        (a, b) => a + Number(b || 0),
        0,
      );
      const questionIdTotal =
        Number(coverage.has_question_id || 0) +
        Number(coverage.no_question_id || 0);

      return {
        id: "cond",
        label: "条件",
        value: ct.total || 0,
        color: "#60a5fa",
        desc: "全品种condition主事实层",
        scene: "资产/事件归属按condition唯一计数",
        children: [
          {
            id: "cond_poly",
            label: "Polymarket",
            value: poly.total || 0,
            color: "#4ade80",
            desc: "Polymarket子树",
            scene: "已确认归属Polymarket",
            children: [
              {
                id: "cond_tr",
                label: "TokenReg",
                value: tr.total || 0,
                color: "#86efac",
                desc: "TokenRegistered子类",
                scene: "在Exchange登记过",
                children: [
                  {
                    id: "cond_tr_amm",
                    label: "AMM",
                    value: tr.amm || 0,
                    color: "#bbf7d0",
                    desc: "poly & treg & amm",
                    scene: "注册后又创建了AMM池",
                  },
                  {
                    id: "cond_tr_nr",
                    label: "NegRisk",
                    value: tr.negrisk || 0,
                    color: "#bbf7d0",
                    desc: "poly & treg & nr",
                    scene: "NegRisk条件子集",
                    children: [
                      {
                        id: "cond_tr_nr_stats",
                        label: "NegRiskStats",
                        value: Number(nr.market_count || 0),
                        color: "#86efac",
                        desc: "仅投影视图,不参与主计数",
                        scene: "market/question/condition关系统计",
                        children: [
                          {
                            id: "cond_tr_nr_market_count",
                            label: "MarketCount",
                            value: Number(nr.market_count || 0),
                            color: "#bbf7d0",
                          },
                          {
                            id: "cond_tr_nr_question_count",
                            label: "QuestionCount",
                            value: Number(nr.question_count || 0),
                            color: "#bbf7d0",
                          },
                          {
                            id: "cond_tr_nr_condition_count",
                            label: "ConditionCount",
                            value: Number(nr.condition_count || 0),
                            color: "#bbf7d0",
                          },
                          {
                            id: "cond_tr_nr_qpm",
                            label: "by_questions_per_market",
                            value: qpmTotal,
                            color: "#bbf7d0",
                            children: s2SortedDictChildren(
                              qpm,
                              "cond_tr_nr_qpm",
                              (k) => `Q=${k}`,
                              "#dbeafe",
                            ),
                          },
                        ],
                      },
                    ],
                  },
                  {
                    id: "cond_tr_norm",
                    label: "OB",
                    value: trOrderbook,
                    color: "#bbf7d0",
                    desc: "poly & treg & ob",
                    scene: "无AMM池,只有挂单交易",
                  },
                  {
                    id: "cond_tr_other",
                    label: "Other(预期=0)",
                    value: trOther,
                    color: "#555",
                    desc: "poly & treg & other0",
                    scene: "Polymarket-TokenReg未覆盖项",
                  },
                ],
              },
              {
                id: "cond_fpmm",
                label: "FPMM",
                value: fpmmPoly,
                color: "#86efac",
                desc: "poly & fcreate & !treg",
                scene: "只创建AMM池,未注册Exchange",
              },
            ],
          },
          {
            id: "cond_other",
            label: "其他",
            value: other.total || 0,
            color: "#9ca3af",
            desc: "非Polymarket子树",
            scene: "无法确认属于Polymarket",
            children: [
              {
                id: "cond_prep",
                label: "Prep",
                value: other.prep || 0,
                color: "#d1d5db",
                desc: "!poly & cprep",
                scene: "早期或其他协议(如Omen)",
              },
              {
                id: "cond_ofpmm",
                label: "FPMM",
                value: fpmmOther,
                color: "#555",
                desc: "!poly & fcreate",
                scene: "非Polymarket来源的FPMMCreation",
              },
              {
                id: "cond_split",
                label: "Split",
                value: splitOther,
                color: "#555",
                desc: "!poly & split_event",
                scene: "仅由Split事件推断condition",
              },
              {
                id: "cond_merge",
                label: "Merge",
                value: mergeOther,
                color: "#555",
                desc: "!poly & merge_event",
                scene: "仅由Merge事件推断condition",
              },
              {
                id: "cond_redemption",
                label: "Redemption",
                value: redemptionOther,
                color: "#555",
                desc: "!poly & redemption_event",
                scene: "仅由Redemption事件推断condition",
              },
            ],
          },
          {
            id: "cond_resolve",
            label: "Resolve",
            value: resolveTotal,
            color: "#93c5fd",
            desc: "condition解析状态",
            scene: "Resolved/Unresolved",
            children: [
              {
                id: "cond_resolved",
                label: "Resolved",
                value: Number(resolve.resolved || 0),
                color: "#bfdbfe",
              },
              {
                id: "cond_unresolved",
                label: "Unresolved",
                value: Number(resolve.unresolved || 0),
                color: "#bfdbfe",
              },
            ],
          },
          {
            id: "cond_collateral",
            label: "Collateral",
            value: collateralTotal,
            color: "#93c5fd",
            desc: "condition collateral覆盖",
            scene: "动态聚合(by_collateral)",
            children: byCollateral.map((row) => {
              const addr = row.addr || "";
              const name = row.name || "";
              const unknown =
                !name ||
                (addr && name.toLowerCase() === addr.toLowerCase());
              return {
                id: `cond_coll_${addr || row.collateral_id}`,
                label: unknown
                  ? addr
                    ? `未知Token: ${addr}`
                    : `CollateralId=${row.collateral_id}`
                  : name,
                value: Number(row.count || 0),
                color: "#bfdbfe",
                desc: unknown ? "" : addr,
              };
            }),
          },
          {
            id: "cond_tokenized",
            label: "Tokenized",
            value: tokenizedTotal,
            color: "#93c5fd",
            desc: "token映射完整度",
            scene: "NoToken/PartialTokenized/FullyTokenized",
            children: [
              {
                id: "cond_tokenized_none",
                label: "NoToken",
                value: Number(tokenized.none || 0),
                color: "#bfdbfe",
              },
              {
                id: "cond_tokenized_partial",
                label: "PartialTokenized",
                value: Number(tokenized.partial || 0),
                color: "#bfdbfe",
              },
              {
                id: "cond_tokenized_full",
                label: "FullyTokenized",
                value: Number(tokenized.full || 0),
                color: "#bfdbfe",
              },
            ],
          },
          {
            id: "cond_coverage",
            label: "Coverage",
            value: recordedConditions,
            color: "#60a5fa",
            desc: "condition主树对账",
            scene: "已记录条件/ByOutcome/HasQuestionID",
            children: [
              {
                id: "cond_cov_raw",
                label: "已记录条件",
                value: recordedConditions,
                color: "#93c5fd",
              },
              {
                id: "cond_cov_outcome",
                label: "ByOutcome",
                value: byOutcomeTotal,
                color: "#93c5fd",
                desc: "主要用于观察FPMM多结果问题; NegRisk每个问题固定2结果",
                children: s2SortedDictChildren(
                  byOutcome,
                  "cond_cov_outcome",
                  (k) => `Outcome=${k}`,
                  "#dbeafe",
                ),
              },
              {
                id: "cond_cov_question",
                label: "HasQuestionID",
                value: questionIdTotal,
                color: "#93c5fd",
                children: [
                  {
                    id: "cond_cov_has_question",
                    label: "HasQuestionID",
                    value: Number(coverage.has_question_id || 0),
                    color: "#dbeafe",
                  },
                  {
                    id: "cond_cov_no_question",
                    label: "NoQuestionID",
                    value: Number(coverage.no_question_id || 0),
                    color: "#dbeafe",
                  },
                ],
              },
            ],
          },
        ],
      };
    }

    // 构建代币(Token)树 - 树状partition
    // total = polymarket + other
    // polymarket = token_reg + fpmm_poly
    // token_reg = amm + negrisk + orderbook + other
    // fpmm_poly = by_collateral_fpmm
    // other = fpmm_other + split + merge + redemption + transfer_inferred
    function s2BuildTokenTree(s) {
      const tt = s.token_tree || {};
      const poly = tt.polymarket || {};
      const tr = poly.token_reg || {};
      const fo = poly.fpmm_poly || {};
      const other = tt.other || {};
      const trOrderbook = tr.orderbook ?? 0;
      const trOther = tr.other ?? 0;
      const fpmmOther = other.fpmm_other ?? 0;
      const splitOther = other.split ?? 0;
      const mergeOther = other.merge ?? 0;
      const redemptionOther = other.redemption ?? 0;
      const transferInferredByCollateral = other.by_collateral_transfer_inferred || [];

      return {
        id: "token",
        label: "代币",
        value: tt.total || 0,
        color: "#f59e0b",
        desc: "token分类总览",
        scene: "ERC1155 token_id来源分层",
        children: [
          {
            id: "token_poly",
            label: "Polymarket",
            value: poly.total || 0,
            color: "#fbbf24",
            desc: "Polymarket子树",
            scene: "已确认归属Polymarket",
            children: [
              {
                id: "token_tr",
                label: "TokenReg",
                value: tr.total || 0,
                color: "#fcd34d",
                desc: "TokenRegistered子类",
                scene: "Exchange事件直接给token",
                children: [
                  {
                    id: "token_tr_amm",
                    label: "AMM",

    function s2NormalizeByCollateralEntries(entries) {
      if (!Array.isArray(entries)) return [];
      return entries
        .map((x) => {
          const addr = x.addr || "";
          const name = x.name || "";
          const unknown = !name || (addr && name.toLowerCase() === addr.toLowerCase());
          return {
            addr,
            name,
            count: Number(x.count || 0),
            label: unknown ? `未知Token: ${addr}` : name,
            desc: unknown ? "" : addr,
          };
        })
        .filter((x) => x.count > 0)
        .sort((a, b) => b.count - a.count);
    }

    function s2MergeByCollateralEntries(groups) {
      const merged = new Map();
      for (const group of groups) {
        for (const x of group) {
          const key = x.addr || x.name;
          if (!merged.has(key)) {
            merged.set(key, {
              addr: x.addr,
              name: x.name,
              count: 0,
              label: x.label,
              desc: x.desc,
            });
          }
          const entry = merged.get(key);
          entry.count += Number(x.count || 0);
        }
      }
      return Array.from(merged.values()).sort((a, b) => b.count - a.count);
    }

    function s2GetByCollateralFromEventTypes(s, eventTypes) {
      const byEvent = s.event_by_collateral || {};
      const groups = eventTypes.map((eventType) => {
        const rows = byEvent[String(eventType)];
        if (!Array.isArray(rows)) return [];
        return s2NormalizeByCollateralEntries(rows);
      });
      return s2MergeByCollateralEntries(groups);
    }

    function s2BuildByCollateralNode(nodeId, label, entries, scene, prefix) {
      if (!entries || entries.length === 0) return null;
      return {
        id: nodeId,
        label: label,
        value: entries.reduce((acc, x) => acc + x.count, 0),
        color: "#fcd34d",
        desc: "",
        scene: scene || "",
        children: entries.map((c) => ({
          id: `${prefix}_coll_${c.addr || c.name}`,
          label: c.label || "未知Token",
          value: c.count,
          color: "#fde68a",
          desc: c.desc || "",
          scene: "",
        })),
      };
    }

    function s2BuildConvertSemTree(s) {
      const t = s.convert_sem_tree || {};
      const qDict = t.question_counts || {};
      const qEntries = Object.entries(qDict)
        .map(([k, v]) => [k, Number(v || 0)])
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1]);
      const qChildren = qEntries.map(([k, v]) => ({
        id: `convert_sem_q_${k}`,
        label: k === "unknown" ? "Unknown" : `Q=${k}`,
        value: v,
        color: "#67e8f9",
      }));
      const qTotal = qEntries.reduce((acc, [, v]) => acc + v, 0);
      return {
        id: "convert_sem",
        label: "Convert语义表",
        value: t.total || 0,
        color: "#06b6d4",
        desc: "convert表行分类",
        scene: "按amount/question数/消费状态统计",

    function s2RenderNode(node) {
      const hasChildren = node.children && node.children.length > 0;
      const isExpanded = s2ExpandedNodes.has(node.id);
      const valueClass = node.value ? "" : " zero";
      const color = node.color || "#888";
      const desc = node.desc
        ? `<span class="stage2-tree-desc">${node.desc}</span>`
        : "";
      const scene = node.scene
        ? `<span class="stage2-tree-scene">${node.scene}</span>`
        : "";

      let html = `<div class="${hasChildren ? "stage2-tree-node" : "stage2-tree-leaf"}" data-id="${node.id}">`;
      if (hasChildren) {
        html += `<span class="stage2-tree-toggle">${isExpanded ? "▼" : "▶"}</span>`;
      }
      html += `<span class="stage2-tree-label" style="color:${color}">${node.label}</span> `;
      html += `<span class="stage2-tree-value${valueClass}" style="color:${color}">${s2Fmt(node.value)}</span>`;
      if (desc) html += ` ${desc}`;
      if (scene) html += ` ${scene}`;
      html += `</div>`;

      if (hasChildren) {
        html += `<div class="stage2-tree-children${isExpanded ? " expanded" : ""}">`;
        for (const child of node.children) {
          html += s2RenderNode(child);
        }
        html += `</div>`;
      }
      return html;
    }

    function s2RenderTreeToContainer(tree, containerId) {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = s2RenderNode(tree);
        container.querySelectorAll(".stage2-tree-node").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = el.dataset.id;
            if (s2ExpandedNodes.has(id)) s2ExpandedNodes.delete(id);
            else s2ExpandedNodes.add(id);
            s2RenderAllTrees(window._s2LastData || {});
          });
        });
      }
    }

    function s2RenderAllTrees(s) {
      s2RenderTreeToContainer(s2BuildCondTree(s), "s2-cond-tree");
      s2RenderTreeToContainer(s2BuildTokenTree(s), "s2-token-tree");
      s2RenderTreeToContainer(s2BuildXferTree(s), "s2-xfer-tree");
      s2RenderTreeToContainer(s2BuildSplitSemTree(s), "s2-split-sem-tree");
      s2RenderTreeToContainer(s2BuildMergeSemTree(s), "s2-merge-sem-tree");
      s2RenderTreeToContainer(s2BuildConvertSemTree(s), "s2-convert-sem-tree");
      s2RenderTreeToContainer(s2BuildOrderSemTree(s), "s2-order-sem-tree");
    }

    function s2CollapseAll() {
      s2ExpandedNodes.clear();
      s2AllExpanded = false;
      s2RenderAllTrees(window._s2LastData || {});
      document.getElementById("s2-collapse-all").textContent = "全部展开";
    }

    function s2ExpandAll() {
      s2ExpandedNodes = new Set(s2DefaultExpandedNodeIds());
      s2AllExpanded = true;
      s2RenderAllTrees(window._s2LastData || {});
      document.getElementById("s2-collapse-all").textContent = "全部折叠";
    }

    function s2UpdateProgress(s) {
      window._s2LastData = s;
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");

      s2UpdateStats(s);

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const progress = headBlock > 0 ? (cursor / headBlock) * 100 : 0;
      bar.style.width = progress.toFixed(2) + "%";

      s2Set("s2-total-users", s.total_users);

      s2RenderAllTrees(s);

      if (sync.syncing) {
        badge.className = "badge badge-warning";
        badge.textContent = "同步中";
      } else if (cursor >= headBlock && headBlock > 0) {
        badge.className = "badge badge-success";
        badge.textContent = "已同步";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {
      try {
        const resp = await fetch("/api/rebuild-status");
        const status = await resp.json();
        s2UpdateProgress(status);
        if (
          status.phase === 7 &&
          !status.running &&
          typeof rpOnRebuildDone === "function"
        ) {
          rpOnRebuildDone();
        }
      } catch (e) { }
    }

    document.addEventListener("DOMContentLoaded", () => {
      s2Poll();
      setInterval(s2Poll, 2000);

      // 折叠/展开按钮
      const collapseBtn = document.getElementById("s2-collapse-all");
      if (collapseBtn) {
        collapseBtn.addEventListener("click", () => {
          if (s2AllExpanded) {
            s2CollapseAll();
          } else {
            s2ExpandAll();
          }
        });
      }
    });
  })();

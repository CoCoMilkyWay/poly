<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }

  .stage2-header h2 {
    font-size: 1.1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 16px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-stats {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 6px;
    padding: 8px 12px;
    min-width: 90px;
  }

  .stage2-stat-label {
    font-size: 0.7em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 1em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }

  .stage2-stat-value.synced {
    color: #4ade80;
  }

  .stage2-stat-value.behind {
    color: #fde047;
  }

  .stage2-progress {
    height: 6px;
    background: #333;
    border-radius: 3px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 3px;
    transition: width 0.3s;
  }

  .stage2-summary {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .stage2-summary-item {
    background: linear-gradient(135deg, #1e3a5f 0%, #1a2d45 100%);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 100px;
    border: 1px solid #2a4a6a;
  }

  .stage2-summary-label {
    font-size: 0.7em;
    color: #6b9bd1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stage2-summary-value {
    font-size: 1.2em;
    font-weight: 600;
    font-family: monospace;
    color: #60a5fa;
  }

  .stage2-events {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .stage2-event {
    background: #202020;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    border: 1px solid #333;
    transition: border-color 0.2s;
  }

  .stage2-event:hover {
    border-color: #555;
  }

  .stage2-event-label {
    font-size: 0.7em;
    color: #888;
    margin-bottom: 4px;
  }

  .stage2-event-value {
    font-size: 1.1em;
    font-weight: 500;
    font-family: monospace;
    color: #e0e0e0;
  }

  .stage2-event-value.zero {
    color: #555;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>Stage2 事件索引</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-stats" id="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">ETA</div>
      <div class="stage2-stat-value" id="s2-eta">-</div>
    </div>
  </div>

  <div class="stage2-progress">
    <div
      class="stage2-progress-bar"
      id="stage2-progress-bar"
      style="width: 0%"
    ></div>
  </div>

  <div class="stage2-summary">
    <div class="stage2-summary-item">
      <div class="stage2-summary-label">用户数</div>
      <div class="stage2-summary-value" id="s2-total-users">0</div>
    </div>
    <div class="stage2-summary-item">
      <div class="stage2-summary-label">市场数</div>
      <div class="stage2-summary-value" id="s2-total-conditions">0</div>
    </div>
    <div class="stage2-summary-item">
      <div class="stage2-summary-label">代币数</div>
      <div class="stage2-summary-value" id="s2-total-tokens">0</div>
    </div>
  </div>

  <div class="stage2-events">
    <div class="stage2-event">
      <div class="stage2-event-label">订单</div>
      <div class="stage2-event-value" id="s2-cnt-order">0</div>
    </div>
    <div class="stage2-event">
      <div class="stage2-event-label">铸币</div>
      <div class="stage2-event-value" id="s2-cnt-split">0</div>
    </div>
    <div class="stage2-event">
      <div class="stage2-event-label">合币</div>
      <div class="stage2-event-value" id="s2-cnt-merge">0</div>
    </div>
    <div class="stage2-event">
      <div class="stage2-event-label">赎回</div>
      <div class="stage2-event-value" id="s2-cnt-redemption">0</div>
    </div>
    <div class="stage2-event">
      <div class="stage2-event-label">AMM交易</div>
      <div class="stage2-event-value" id="s2-cnt-fpmm-trade">0</div>
    </div>
    <div class="stage2-event">
      <div class="stage2-event-label">LP操作</div>
      <div class="stage2-event-value" id="s2-cnt-fpmm-funding">0</div>
    </div>
    <div class="stage2-event">
      <div class="stage2-event-label">转账</div>
      <div class="stage2-event-value" id="s2-cnt-transfer">0</div>
    </div>
  </div>
</div>

<script>
  (function () {
    function s2Fmt(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function s2FmtNum(n) {
      return n.toLocaleString();
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();

    function s2UpdateStats(s) {
      const lastBlockEl = document.getElementById("s2-last-block");
      const headBlockEl = document.getElementById("s2-head-block");
      const behindEl = document.getElementById("s2-behind");
      const speedEl = document.getElementById("s2-speed");
      const etaEl = document.getElementById("s2-eta");

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      lastBlockEl.textContent = s2FmtNum(cursor);
      headBlockEl.textContent = s2FmtNum(headBlock);
      behindEl.textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        speedEl.textContent = s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60) etaEl.textContent = Math.round(eta) + "s";
          else if (eta < 3600) etaEl.textContent = Math.round(eta / 60) + "m";
          else etaEl.textContent = (eta / 3600).toFixed(1) + "h";
        } else {
          etaEl.textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2UpdateEventCount(id, value) {
      const el = document.getElementById(id);
      el.textContent = s2Fmt(value || 0);
      el.classList.toggle("zero", !value);
    }

    function s2UpdateProgress(s) {
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");

      s2UpdateStats(s);

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const progress = headBlock > 0 ? (cursor / headBlock) * 100 : 0;
      bar.style.width = progress.toFixed(2) + "%";

      document.getElementById("s2-total-users").textContent = s2Fmt(
        s.total_users || 0,
      );
      document.getElementById("s2-total-conditions").textContent = s2Fmt(
        s.total_conditions || 0,
      );
      document.getElementById("s2-total-tokens").textContent = s2Fmt(
        s.total_tokens || 0,
      );

      s2UpdateEventCount("s2-cnt-order", s.cnt_order);
      s2UpdateEventCount("s2-cnt-split", s.cnt_split);
      s2UpdateEventCount("s2-cnt-merge", s.cnt_merge);
      s2UpdateEventCount("s2-cnt-redemption", s.cnt_redemption);
      s2UpdateEventCount("s2-cnt-fpmm-trade", s.cnt_fpmm_trade);
      s2UpdateEventCount("s2-cnt-fpmm-funding", s.cnt_fpmm_funding);
      s2UpdateEventCount("s2-cnt-transfer", s.cnt_transfer);

      if (sync.syncing) {
        badge.className = "badge badge-warning";
        badge.textContent = "同步中";
      } else if (cursor >= headBlock && headBlock > 0) {
        badge.className = "badge badge-success";
        badge.textContent = "已同步";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {
      try {
        const resp = await fetch("/api/rebuild-status");
        const status = await resp.json();
        s2UpdateProgress(status);
        if (
          status.phase === 7 &&
          !status.running &&
          typeof rpOnRebuildDone === "function"
        ) {
          rpOnRebuildDone();
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      s2Poll();
      setInterval(s2Poll, 2000);
    });
  })();
</script>

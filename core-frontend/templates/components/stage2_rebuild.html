<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 12px 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage2-header h2 {
    font-size: 1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-progress {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .stage2-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 0.8em;
    font-family: monospace;
    margin-bottom: 6px;
  }

  .stage2-row:last-child {
    margin-bottom: 0;
  }

  .stage2-item {
    display: flex;
    gap: 4px;
    align-items: baseline;
  }

  .stage2-label {
    color: #666;
  }

  .stage2-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-value.zero {
    color: #444;
  }

  .stage2-value.highlight {
    color: #60a5fa;
  }

  .stage2-sep {
    color: #333;
    margin: 0 2px;
  }

  .stage2-tree {
    font-size: 0.75em;
    font-family: monospace;
  }
  .stage2-tree-node {
    cursor: pointer;
    user-select: none;
  }
  .stage2-tree-node:hover {
    background: #252525;
    margin: 0 -8px;
    padding: 0 8px;
  }
  .stage2-tree-toggle {
    display: inline-block;
    width: 12px;
    color: #555;
    text-align: center;
  }
  .stage2-tree-label {
    color: #888;
  }
  .stage2-tree-value {
    color: #fff;
    font-weight: 500;
  }
  .stage2-tree-value.zero {
    color: #444;
  }
  .stage2-tree-children {
    padding-left: 16px;
    display: none;
  }
  .stage2-tree-children.expanded {
    display: block;
  }
  .stage2-tree-leaf {
    padding-left: 16px;
  }
  .stage2-tree-leaf .stage2-tree-label {
    color: #666;
  }
  .stage2-tree-desc {
    color: #777;
    font-size: 0.9em;
    margin-left: 6px;
  }
  .stage2-tree-scene {
    color: #555;
    font-size: 0.85em;
    margin-left: 6px;
    font-style: italic;
  }
  .stage2-tree-scene::before {
    content: "// ";
    color: #444;
  }
  /* 恒等式样式 */
  .stage2-tree-node,
  .stage2-tree-leaf {
    line-height: 1.5;
  }
  .stage2-tree-node .stage2-tree-value,
  .stage2-tree-leaf .stage2-tree-value {
    padding: 0 2px;
    border-radius: 2px;
  }

  .stage2-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 4px;
    padding: 4px 10px;
  }

  .stage2-stat-label {
    font-size: 0.65em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 0.9em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>同步用户</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-progress">
    <div
      class="stage2-progress-bar"
      id="stage2-progress-bar"
      style="width: 0%"
    ></div>
  </div>

  <div class="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">ETA</div>
      <div class="stage2-stat-value" id="s2-eta">-</div>
    </div>
  </div>

  <div class="stage2-row">
    <span class="stage2-item">
      <span class="stage2-label">用户</span>
      <span class="stage2-value highlight" id="s2-total-users">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">市场</span>
      <span class="stage2-value highlight" id="s2-total-markets">0</span>
    </span>
    <button
      id="s2-collapse-all"
      style="
        margin-left: auto;
        background: #333;
        border: 1px solid #555;
        color: #aaa;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7em;
        cursor: pointer;
      "
    >
      全部折叠
    </button>
  </div>

  <div class="stage2-tree" id="s2-cond-tree"></div>
  <div class="stage2-tree" id="s2-token-tree"></div>
  <div class="stage2-tree" id="s2-xfer-tree"></div>
</div>

<script>
  (function () {
    function s2Fmt(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function s2FmtNum(n) {
      return n.toLocaleString();
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();
    // 默认全部展开的节点集合
    let s2ExpandedNodes = new Set([
      // 问题树 (树状partition: total→polymarket/other→...)
      "cond",
      "cond_poly",
      "cond_tr",
      "cond_other",
      // 代币树 (树状partition: total→polymarket/other→...)
      "token",
      "token_poly",
      "token_tr",
      "token_fpmm",
      "token_other",
      // Transfer树
      "xfer",
      "user_events",
      "internal",
      "skipped",
      "split",
      "merge",
      "order",
      "fpmm_trade",
      "fpmm_lp",
      "transfer",
      "transfer_in",
      "transfer_out",
      "internal_mint",
      "internal_burn",
      "internal_transfer",
      "non_poly",
    ]);
    let s2AllExpanded = true;

    function s2UpdateStats(s) {
      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      document.getElementById("s2-last-block").textContent = s2FmtNum(cursor);
      document.getElementById("s2-head-block").textContent =
        s2FmtNum(headBlock);
      document.getElementById("s2-behind").textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        document.getElementById("s2-speed").textContent =
          s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60)
            document.getElementById("s2-eta").textContent =
              Math.round(eta) + "s";
          else if (eta < 3600)
            document.getElementById("s2-eta").textContent =
              Math.round(eta / 60) + "m";
          else
            document.getElementById("s2-eta").textContent =
              (eta / 3600).toFixed(1) + "h";
        } else {
          document.getElementById("s2-eta").textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2Set(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = s2Fmt(value || 0);
      el.classList.toggle("zero", !value);
    }

    // 构建问题(Condition)树 - 树状partition
    // total = polymarket + other
    // polymarket = token_reg + fpmm_only
    // token_reg = amm + negrisk + normal
    // other = prep + other_fpmm + split
    function s2BuildCondTree(s) {
      const ct = s.cond_tree || {};
      const poly = ct.polymarket || {};
      const tr = poly.token_reg || {};
      const other = ct.other || {};

      return {
        id: "cond",
        label: "问题",
        value: ct.total || 0,
        color: "#60a5fa",
        desc: "ConditionPreparation",
        scene: "CTF合约创建的所有问题",
        children: [
          {
            id: "cond_poly",
            label: "Polymarket",
            value: poly.total || 0,
            color: "#4ade80",
            desc: "TokenReg|FPMM",
            scene: "确认属于Polymarket协议",
            children: [
              {
                id: "cond_tr",
                label: "TokenReg",
                value: tr.total || 0,
                color: "#86efac",
                desc: "Exchange.TokenRegistered",
                scene: "在Exchange注册过代币",
                children: [
                  {
                    id: "cond_tr_amm",
                    label: "AMM",
                    value: tr.amm || 0,
                    color: "#bbf7d0",
                    desc: "有FPMM池",
                    scene: "注册后又创建了AMM池",
                  },
                  {
                    id: "cond_tr_nr",
                    label: "NegRisk",
                    value: tr.negrisk || 0,
                    color: "#bbf7d0",
                    desc: "NegRiskAdapter",
                    scene: "多选题市场(谁当选总统)",
                  },
                  {
                    id: "cond_tr_norm",
                    label: "普通",
                    value: tr.normal || 0,
                    color: "#bbf7d0",
                    desc: "纯订单簿",
                    scene: "无AMM池,只有挂单交易",
                  },
                ],
              },
              {
                id: "cond_fpmm",
                label: "FPMM",
                value: poly.fpmm_only || 0,
                color: "#86efac",
                desc: "FPMMFactory.Creation",
                scene: "只创建AMM池,未注册Exchange",
              },
            ],
          },
          {
            id: "cond_other",
            label: "其他",
            value: other.total || 0,
            color: "#9ca3af",
            desc: "无Poly标识",
            scene: "无法确认属于Polymarket",
            children: [
              {
                id: "cond_prep",
                label: "Prep",
                value: other.prep || 0,
                color: "#d1d5db",
                desc: "ConditionPreparation",
                scene: "早期或其他协议(如Omen)",
              },
              {
                id: "cond_ofpmm",
                label: "OtherFPMM",
                value: other.other_fpmm || 0,
                color: "#d1d5db",
                desc: "非PolyFactory",
                scene: "其他协议的AMM池",
              },
              {
                id: "cond_split",
                label: "Split",
                value: other.split || 0,
                color: "#d1d5db",
                desc: "PositionSplit推断",
                scene: "从用户铸造操作推断",
              },
            ],
          },
        ],
      };
    }

    // 构建代币(Token)树 - 树状partition
    // total = polymarket + other
    // polymarket = token_reg + fpmm_only
    // token_reg = amm + negrisk + normal
    // fpmm_only = usdc + non_usdc
    // other = other_fpmm + split
    function s2BuildTokenTree(s) {
      const tt = s.token_tree || {};
      const poly = tt.polymarket || {};
      const tr = poly.token_reg || {};
      const fo = poly.fpmm_only || {};
      const other = tt.other || {};

      return {
        id: "token",
        label: "代币",
        value: tt.total || 0,
        color: "#f59e0b",
        desc: "ERC1155 token_id",
        scene: "所有已知的条件代币",
        children: [
          {
            id: "token_poly",
            label: "Polymarket",
            value: poly.total || 0,
            color: "#fbbf24",
            desc: "TokenReg|FPMM",
            scene: "确认属于Polymarket协议",
            children: [
              {
                id: "token_tr",
                label: "TokenReg",
                value: tr.total || 0,
                color: "#fcd34d",
                desc: "事件直接提供",
                scene: "Exchange.TokenRegistered记录",
                children: [
                  {
                    id: "token_tr_amm",
                    label: "AMM",
                    value: tr.amm || 0,
                    color: "#fde68a",
                    desc: "有FPMM池",
                    scene: "注册后又创建了AMM池",
                  },
                  {
                    id: "token_tr_nr",
                    label: "NegRisk",
                    value: tr.negrisk || 0,
                    color: "#fde68a",
                    desc: "NegRiskAdapter",
                    scene: "多选题市场代币",
                  },
                  {
                    id: "token_tr_norm",
                    label: "普通",
                    value: tr.normal || 0,
                    color: "#fde68a",
                    desc: "纯订单簿",
                    scene: "无AMM池,只有挂单",
                  },
                ],
              },
              {
                id: "token_fpmm",
                label: "FPMM",
                value: fo.total || 0,
                color: "#fcd34d",
                desc: "keccak256计算",
                scene: "从FPMM创建事件计算",
                children: [
                  {
                    id: "token_fpmm_usdc",
                    label: "USDC",
                    value: fo.usdc || 0,
                    color: "#fde68a",
                    desc: "标准抵押品",
                    scene: "Polymarket主流市场",
                  },
                  {
                    id: "token_fpmm_non",
                    label: "非USDC",
                    value: fo.non_usdc || 0,
                    color: "#fde68a",
                    desc: "WETH等",
                    scene: "早期测试或特殊市场",
                  },
                ],
              },
            ],
          },
          {
            id: "token_other",
            label: "其他",
            value: other.total || 0,
            color: "#9ca3af",
            desc: "无Poly标识",
            scene: "无法确认属于Polymarket",
            children: [
              {
                id: "token_ofpmm",
                label: "OtherFPMM",
                value: other.other_fpmm || 0,
                color: "#d1d5db",
                desc: "非PolyFactory",
                scene: "其他协议AMM池计算",
              },
              {
                id: "token_split",
                label: "Split",
                value: other.split || 0,
                color: "#d1d5db",
                desc: "PositionSplit计算",
                scene: "从用户铸造操作推断",
              },
            ],
          },
        ],
      };
    }

    // 构建非Polymarket节点（协议->tokens两层结构）
    function s2BuildNonPolyNode(s) {
      const protos = s.xfer_non_poly_protos || [];

      const children = protos.map((proto, idx) => {
        const isAddr = proto.name.startsWith("0x");
        const label = isAddr ? proto.name : `${proto.name} (${proto.addr})`;

        const tokenChildren = proto.tokens.map((t, tidx) => ({
          id: `non_poly_${idx}_t${tidx}`,
          label: t.id,
          value: t.count,
          color: "#fde68a",
          desc: "token_id",
        }));

        return {
          id: `non_poly_proto_${idx}`,
          label: label,
          value: proto.total,
          color: "#fcd34d",
          desc: isAddr ? "未知协议" : "已识别协议",
          scene: isAddr ? "合约地址未标注" : "",
          children: tokenChildren.length > 0 ? tokenChildren : undefined,
        };
      });

      return {
        id: "non_poly",
        label: "非Poly",
        value: s.xfer_non_poly || 0,
        color: "#fbbf24",
        desc: "token未知",
        scene: "token不属于已知Poly市场",
        children: children.length > 0 ? children : undefined,
      };
    }

    // EventType常量 (与后端types.hpp对应)
    const EventType = {
      Buy: 0,
      Sell: 1,
      Split: 2,
      Merge: 3,
      Redemption: 4,
      FPMMBuy: 5,
      FPMMSell: 6,
      FPMMLPAdd: 7,
      FPMMLPRemove: 8,
      Convert: 9,
      TransferIn: 10,
      TransferOut: 11,
    };

    // 根据event_by_collateral构建按抵押品分组的节点
    // 返回一个包装节点"按抵押品"，其子节点是各抵押品统计
    function s2BuildCollateralSection(s, eventTypes, parentColor, prefix) {
      if (!s.event_by_collateral) return null;

      // 收集这些eventType的所有collateral统计
      const byCollateral = {};
      let total = 0;
      for (const item of s.event_by_collateral) {
        if (eventTypes.includes(item.event_type)) {
          const key = item.collateral;
          if (!byCollateral[key]) {
            byCollateral[key] = {
              collateral: key,
              name: item.collateral_name,
              addr: item.collateral_addr,
              count: 0,
            };
          }
          byCollateral[key].count += item.count;
          total += item.count;
        }
      }

      // 转换为节点数组，按count排序
      const children = Object.values(byCollateral)
        .filter((c) => c.count > 0)
        .sort((a, b) => b.count - a.count)
        .map((c) => ({
          id: `${prefix}_coll_${c.collateral}`,
          label: c.name,
          value: c.count,
          color: "#fef3c7",
          desc: c.addr ? c.addr.substring(0, 10) + "..." : "",
          scene: c.addr || "未知抵押品",
        }));

      // 如果只有一种抵押品且是USDC，不显示此分区
      if (children.length <= 1) {
        return null;
      }

      return {
        id: `${prefix}_by_collateral`,
        label: "按抵押品",
        value: total,
        color: "#fcd34d",
        desc: "=父节点",
        scene: "按抵押品类型分组统计",
        children: children,
        isCollateralSection: true,
      };
    }

    // 构建Transfer树
    function s2BuildXferTree(s) {
      // 保持原有恒等式树结构
      const split = (s.xfer_split_normal || 0) + (s.xfer_split_negrisk || 0);
      const merge = (s.xfer_merge_normal || 0) + (s.xfer_merge_negrisk || 0);
      const order = (s.xfer_order_buy || 0) + (s.xfer_order_sell || 0);
      const fpmm_trade = (s.xfer_fpmm_buy || 0) + (s.xfer_fpmm_sell || 0);
      const fpmm_lp =
        (s.xfer_lp_add || 0) +
        (s.xfer_lp_remove || 0) +
        (s.xfer_lp_return || 0);
      const transfer_in =
        (s.xfer_transfer_in_negrisk || 0) + (s.xfer_transfer_in_other || 0);
      const transfer_out =
        (s.xfer_transfer_out_negrisk || 0) + (s.xfer_transfer_out_other || 0);
      const transfer = transfer_in + transfer_out;
      const user_events =
        split +
        merge +
        (s.xfer_redemption || 0) +
        (s.xfer_convert || 0) +
        order +
        fpmm_trade +
        fpmm_lp +
        transfer;
      const internal_mint =
        (s.xfer_internal_mint_negrisk || 0) + (s.xfer_internal_mint_fpmm || 0);
      const internal_burn =
        (s.xfer_internal_burn_negrisk || 0) +
        (s.xfer_internal_burn_fpmm || 0) +
        (s.xfer_internal_burn_convert || 0);
      const internal_transfer =
        (s.xfer_internal_transfer_zero || 0) +
        (s.xfer_internal_transfer_order || 0) +
        (s.xfer_internal_transfer_negrisk || 0) +
        (s.xfer_internal_transfer_fpmm || 0) +
        (s.xfer_internal_transfer_other || 0);
      const internal = internal_mint + internal_burn + internal_transfer;
      const skipped = s.xfer_non_poly || 0;

      return {
        id: "xfer",
        label: "Transfer",
        value: s.xfer_total || 0,
        color: "#93c5fd",
        desc: "TransferSingle/Batch",
        scene: "ERC1155代币转移事件",
        children: [
          {
            id: "user_events",
            label: "用户",
            value: user_events,
            color: "#4ade80",
            desc: "→user_event表",
            scene: "影响用户持仓,写入数据库",
            children: [
              {
                id: "split",
                label: "铸造",
                value: split,
                color: "#86efac",
                desc: "PositionSplit",
                scene: "用户存入USDC铸造YES+NO",
                children: [
                  {
                    id: "split_normal",
                    label: "普通",
                    value: s.xfer_split_normal || 0,
                    color: "#bbf7d0",
                    desc: "0x0→用户",
                    scene: "用户直接调用CTF.split",
                  },
                  {
                    id: "split_negrisk",
                    label: "NegRisk",
                    value: s.xfer_split_negrisk || 0,
                    color: "#bbf7d0",
                    desc: "Adapter→用户",
                    scene: "Adapter代理铸造后转给用户",
                  },
                  s2BuildCollateralSection(
                    s,
                    [EventType.Split],
                    "#86efac",
                    "split",
                  ),
                ].filter(Boolean),
              },
              {
                id: "merge",
                label: "合并",
                value: merge,
                color: "#86efac",
                desc: "PositionsMerge",
                scene: "用户销毁YES+NO取回USDC",
                children: [
                  {
                    id: "merge_normal",
                    label: "普通",
                    value: s.xfer_merge_normal || 0,
                    color: "#bbf7d0",
                    desc: "用户→0x0",
                    scene: "用户直接调用CTF.merge",
                  },
                  {
                    id: "merge_negrisk",
                    label: "NegRisk",
                    value: s.xfer_merge_negrisk || 0,
                    color: "#bbf7d0",
                    desc: "用户→Adapter",
                    scene: "用户转给Adapter代理销毁",
                  },
                  s2BuildCollateralSection(
                    s,
                    [EventType.Merge],
                    "#86efac",
                    "merge",
                  ),
                ].filter(Boolean),
              },
              {
                id: "redemption",
                label: "赎回",
                value: s.xfer_redemption || 0,
                color: "#86efac",

    function s2RenderNode(node, depth = 0) {
      const hasChildren = node.children && node.children.length > 0;
      const isExpanded = s2ExpandedNodes.has(node.id);
      const valueClass = node.value ? "" : " zero";
      const color = node.color || "#888";
      const desc = node.desc
        ? `<span class="stage2-tree-desc">${node.desc}</span>`
        : "";
      const scene = node.scene
        ? `<span class="stage2-tree-scene">${node.scene}</span>`
        : "";

      let html = `<div class="${hasChildren ? "stage2-tree-node" : "stage2-tree-leaf"}" data-id="${node.id}">`;
      if (hasChildren) {
        html += `<span class="stage2-tree-toggle">${isExpanded ? "▼" : "▶"}</span>`;
      }
      html += `<span class="stage2-tree-label" style="color:${color}">${node.label}</span> `;
      html += `<span class="stage2-tree-value${valueClass}" style="color:${color}">${s2Fmt(node.value)}</span>`;
      if (desc) html += ` ${desc}`;
      if (scene) html += ` ${scene}`;
      html += `</div>`;

      if (hasChildren) {
        html += `<div class="stage2-tree-children${isExpanded ? " expanded" : ""}">`;
        for (const child of node.children) {
          html += s2RenderNode(child, depth + 1);
        }
        html += `</div>`;
      }
      return html;
    }

    function s2RenderTreeToContainer(tree, containerId) {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = s2RenderNode(tree);
        container.querySelectorAll(".stage2-tree-node").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = el.dataset.id;
            if (s2ExpandedNodes.has(id)) s2ExpandedNodes.delete(id);
            else s2ExpandedNodes.add(id);
            s2RenderAllTrees(window._s2LastData || {});
          });
        });
      }
    }

    function s2RenderAllTrees(s) {
      s2RenderTreeToContainer(s2BuildCondTree(s), "s2-cond-tree");
      s2RenderTreeToContainer(s2BuildTokenTree(s), "s2-token-tree");
      s2RenderTreeToContainer(s2BuildXferTree(s), "s2-xfer-tree");
    }

    function s2CollapseAll() {
      s2ExpandedNodes.clear();
      s2AllExpanded = false;
      s2RenderAllTrees(window._s2LastData || {});
      document.getElementById("s2-collapse-all").textContent = "全部展开";
    }

    function s2ExpandAll() {
      s2ExpandedNodes = new Set([
        // 问题树 (树状partition: total→polymarket/other→...)
        "cond",
        "cond_poly",
        "cond_tr",
        "cond_other",
        // 代币树 (树状partition: total→polymarket/other→...)
        "token",
        "token_poly",
        "token_tr",
        "token_fpmm",
        "token_other",
        // Transfer树
        "xfer",
        "user_events",
        "internal",
        "skipped",
        "split",
        "merge",
        "order",
        "fpmm_trade",
        "fpmm_lp",
        "transfer",
        "transfer_in",
        "transfer_out",
        "internal_mint",
        "internal_burn",
        "internal_transfer",
        "non_poly",
      ]);
      s2AllExpanded = true;
      s2RenderAllTrees(window._s2LastData || {});
      document.getElementById("s2-collapse-all").textContent = "全部折叠";
    }

    function s2UpdateProgress(s) {
      window._s2LastData = s;
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");

      s2UpdateStats(s);

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const progress = headBlock > 0 ? (cursor / headBlock) * 100 : 0;
      bar.style.width = progress.toFixed(2) + "%";

      s2Set("s2-total-users", s.total_users);
      s2Set("s2-total-markets", s.total_markets);

      s2RenderAllTrees(s);

      if (sync.syncing) {
        badge.className = "badge badge-warning";
        badge.textContent = "同步中";
      } else if (cursor >= headBlock && headBlock > 0) {
        badge.className = "badge badge-success";
        badge.textContent = "已同步";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {
      try {
        const resp = await fetch("/api/rebuild-status");
        const status = await resp.json();
        s2UpdateProgress(status);
        if (
          status.phase === 7 &&
          !status.running &&
          typeof rpOnRebuildDone === "function"
        ) {
          rpOnRebuildDone();
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      s2Poll();
      setInterval(s2Poll, 2000);

      // 折叠/展开按钮
      const collapseBtn = document.getElementById("s2-collapse-all");
      if (collapseBtn) {
        collapseBtn.addEventListener("click", () => {
          if (s2AllExpanded) {
            s2CollapseAll();
          } else {
            s2ExpandAll();
          }
        });
      }
    });
  })();

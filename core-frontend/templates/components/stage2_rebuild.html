<style>
  .stage2-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 12px 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .stage2-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage2-header h2 {
    font-size: 1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .stage2-header h2::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #10b981;
    border-radius: 2px;
  }

  .stage2-progress {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .stage2-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .stage2-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 0.8em;
    font-family: monospace;
    margin-bottom: 6px;
  }

  .stage2-row:last-child {
    margin-bottom: 0;
  }

  .stage2-item {
    display: flex;
    gap: 4px;
    align-items: baseline;
  }

  .stage2-label {
    color: #666;
  }

  .stage2-value {
    color: #fff;
    font-weight: 500;
  }

  .stage2-value.zero {
    color: #444;
  }

  .stage2-value.highlight {
    color: #60a5fa;
  }

  .stage2-sep {
    color: #333;
    margin: 0 2px;
  }

  .stage2-tree {
    font-size: 0.75em;
    font-family: monospace;
  }
  .stage2-tree-node {
    cursor: pointer;
    user-select: none;
  }
  .stage2-tree-node:hover {
    background: #252525;
    margin: 0 -8px;
    padding: 0 8px;
  }
  .stage2-tree-toggle {
    display: inline-block;
    width: 12px;
    color: #555;
    text-align: center;
  }
  .stage2-tree-label {
    color: #888;
  }
  .stage2-tree-value {
    color: #fff;
    font-weight: 500;
  }
  .stage2-tree-value.zero {
    color: #444;
  }
  .stage2-tree-children {
    padding-left: 16px;
    display: none;
  }
  .stage2-tree-children.expanded {
    display: block;
  }
  .stage2-tree-leaf {
    padding-left: 16px;
  }
  .stage2-tree-leaf .stage2-tree-label {
    color: #666;
  }
  .stage2-tree-desc {
    color: #555;
    font-size: 0.9em;
    margin-left: 4px;
  }

  .stage2-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .stage2-stat {
    background: #252525;
    border-radius: 4px;
    padding: 4px 10px;
  }

  .stage2-stat-label {
    font-size: 0.65em;
    color: #666;
  }

  .stage2-stat-value {
    font-size: 0.9em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }
</style>

<div class="stage2-card">
  <div class="stage2-header">
    <h2>同步用户</h2>
    <span id="stage2-badge" class="badge badge-warning">等待中</span>
  </div>

  <div class="stage2-progress">
    <div
      class="stage2-progress-bar"
      id="stage2-progress-bar"
      style="width: 0%"
    ></div>
  </div>

  <div class="stage2-stats">
    <div class="stage2-stat">
      <div class="stage2-stat-label">Last Block</div>
      <div class="stage2-stat-value" id="s2-last-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Head Block</div>
      <div class="stage2-stat-value" id="s2-head-block">0</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Behind</div>
      <div class="stage2-stat-value" id="s2-behind">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">Speed</div>
      <div class="stage2-stat-value" id="s2-speed">-</div>
    </div>
    <div class="stage2-stat">
      <div class="stage2-stat-label">ETA</div>
      <div class="stage2-stat-value" id="s2-eta">-</div>
    </div>
  </div>

  <div class="stage2-row">
    <span class="stage2-item">
      <span class="stage2-label">用户</span>
      <span class="stage2-value highlight" id="s2-total-users">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">市场</span>
      <span class="stage2-value highlight" id="s2-total-markets">0</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">问题</span>
      <span class="stage2-value highlight" id="s2-cond-total">0</span>
      <span style="color:#555">(</span><span style="color:#d4a574">AMM</span><span class="stage2-value" id="s2-cond-amm">0</span>
      <span style="color:#a5d474">Norm</span><span class="stage2-value" id="s2-cond-norm">0</span>
      <span style="color:#d474d4">Neg</span><span class="stage2-value" id="s2-cond-negrisk">0</span>
      <span style="color:#888">Other</span><span class="stage2-value" style="color:#666" id="s2-cond-other">0</span><span style="color:#555">)</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">问题来源</span>
      <span style="color:#555">(</span><span style="color:#74b4d4">Prep</span><span class="stage2-value" id="s2-cond-src-prep">0</span>
      <span style="color:#d4a574">PolyReg</span><span class="stage2-value" id="s2-cond-src-poly-reg">0</span>
      <span style="color:#a5d474">PolyFPMM</span><span class="stage2-value" id="s2-cond-src-poly-fpmm">0</span>
      <span style="color:#888">OtherFPMM</span><span class="stage2-value" style="color:#666" id="s2-cond-src-other-fpmm">0</span>
      <span style="color:#666">Split</span><span class="stage2-value" style="color:#555" id="s2-cond-src-split">0</span><span style="color:#555">)</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">代币</span>
      <span class="stage2-value highlight" id="s2-token-total">0</span>
      <span style="color:#555">(</span><span style="color:#d4a574">AMM</span><span class="stage2-value" id="s2-token-amm">0</span>
      <span style="color:#a5d474">Norm</span><span class="stage2-value" id="s2-token-norm">0</span>
      <span style="color:#d474d4">Neg</span><span class="stage2-value" id="s2-token-negrisk">0</span>
      <span style="color:#888">非U</span><span class="stage2-value" style="color:#666" id="s2-token-non-usdc">0</span>
      <span style="color:#666">Other</span><span class="stage2-value" style="color:#555" id="s2-token-other">0</span><span style="color:#555">)</span>
    </span>
    <span class="stage2-item">
      <span class="stage2-label">代币来源</span>
      <span style="color:#555">(</span><span style="color:#d4a574">PolyReg</span><span class="stage2-value" id="s2-token-src-poly-reg">0</span>
      <span style="color:#a5d474">PolyFPMM</span><span class="stage2-value" id="s2-token-src-poly-fpmm">0</span>
      <span style="color:#888">OtherFPMM</span><span class="stage2-value" style="color:#666" id="s2-token-src-other-fpmm">0</span>
      <span style="color:#666">Split</span><span class="stage2-value" style="color:#555" id="s2-token-src-split">0</span><span style="color:#555">)</span>
    </span>
  </div>

  <div class="stage2-tree" id="s2-xfer-tree"></div>
</div>

<script>
  (function () {
    function s2Fmt(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function s2FmtNum(n) {
      return n.toLocaleString();
    }

    let s2LastCursor = 0;
    let s2LastTime = Date.now();
    let s2ExpandedNodes = new Set(["xfer", "user_events", "internal", "skipped"]);

    function s2UpdateStats(s) {
      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const behind = headBlock - cursor;

      document.getElementById("s2-last-block").textContent = s2FmtNum(cursor);
      document.getElementById("s2-head-block").textContent = s2FmtNum(headBlock);
      document.getElementById("s2-behind").textContent = s2FmtNum(behind);

      const now = Date.now();
      const dt = (now - s2LastTime) / 1000;
      if (dt > 0 && cursor > s2LastCursor) {
        const speed = (cursor - s2LastCursor) / dt;
        document.getElementById("s2-speed").textContent = s2Fmt(Math.round(speed)) + "/s";
        if (speed > 0 && behind > 0) {
          const eta = behind / speed;
          if (eta < 60) document.getElementById("s2-eta").textContent = Math.round(eta) + "s";
          else if (eta < 3600) document.getElementById("s2-eta").textContent = Math.round(eta / 60) + "m";
          else document.getElementById("s2-eta").textContent = (eta / 3600).toFixed(1) + "h";
        } else {
          document.getElementById("s2-eta").textContent = "-";
        }
      }
      s2LastCursor = cursor;
      s2LastTime = now;
    }

    function s2Set(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = s2Fmt(value || 0);
      el.classList.toggle("zero", !value);
    }

    function s2BuildTree(s) {
      const split = (s.xfer_split_normal || 0) + (s.xfer_split_negrisk || 0);
      const merge = (s.xfer_merge_normal || 0) + (s.xfer_merge_negrisk || 0);
      const order = (s.xfer_order_buy || 0) + (s.xfer_order_sell || 0);
      const fpmm_trade = (s.xfer_fpmm_buy || 0) + (s.xfer_fpmm_sell || 0);
      const fpmm_lp = (s.xfer_lp_add || 0) + (s.xfer_lp_remove || 0) + (s.xfer_lp_return || 0);
      const transfer_in = (s.xfer_transfer_in_negrisk || 0) + (s.xfer_transfer_in_other || 0);
      const transfer_out = (s.xfer_transfer_out_negrisk || 0) + (s.xfer_transfer_out_other || 0);
      const transfer = transfer_in + transfer_out;
      const user_events = split + merge + (s.xfer_redemption||0) + (s.xfer_convert||0) + order + fpmm_trade + fpmm_lp + transfer;
      const internal_mint = (s.xfer_internal_mint_negrisk || 0) + (s.xfer_internal_mint_fpmm || 0);
      const internal_burn = (s.xfer_internal_burn_negrisk || 0) + (s.xfer_internal_burn_fpmm || 0) + (s.xfer_internal_burn_convert || 0);
      const internal_transfer = (s.xfer_internal_transfer_zero || 0) + (s.xfer_internal_transfer_order || 0) + (s.xfer_internal_transfer_negrisk || 0) + (s.xfer_internal_transfer_fpmm || 0) + (s.xfer_internal_transfer_other || 0);
      const internal = internal_mint + internal_burn + internal_transfer;
      const non_usdc = (s.xfer_non_usdc_mint || 0) + (s.xfer_non_usdc_burn || 0) + (s.xfer_non_usdc_op || 0);
      const skipped = non_usdc + (s.xfer_non_poly || 0);

      return {
        id: "xfer", label: "Transfer", value: s.xfer_total || 0, color: "#60a5fa", desc: "ConditionalTokens.TransferSingle/Batch",
        children: [
          { id: "user_events", label: "用户事件", value: user_events, color: "#4ade80", desc: "影响用户持仓",
            children: [
              { id: "split", label: "铸造", value: split, desc: "PositionSplit: USDC→YES+NO", children: [
                { id: "split_normal", label: "普通", value: s.xfer_split_normal || 0, desc: "0x0→用户" },
                { id: "split_negrisk", label: "NegRisk", value: s.xfer_split_negrisk || 0, desc: "Adapter→用户" }
              ]},
              { id: "merge", label: "合并", value: merge, desc: "PositionsMerge: YES+NO→USDC", children: [
                { id: "merge_normal", label: "普通", value: s.xfer_merge_normal || 0, desc: "用户→0x0" },
                { id: "merge_negrisk", label: "NegRisk", value: s.xfer_merge_negrisk || 0, desc: "用户→Adapter" }
              ]},
              { id: "redemption", label: "赎回", value: s.xfer_redemption || 0, desc: "PayoutRedemption: 结算后兑USDC" },
              { id: "convert", label: "转换", value: s.xfer_convert || 0, desc: "PositionsConverted: M个NO→1个YES" },
              { id: "order", label: "订单", value: order, desc: "CTFExchange/NegRiskExchange", children: [
                { id: "order_buy", label: "买入", value: s.xfer_order_buy || 0, desc: "OrderFilled: 协议→用户" },
                { id: "order_sell", label: "卖出", value: s.xfer_order_sell || 0, desc: "OrderFilled: 用户→协议" }
              ]},
              { id: "fpmm_trade", label: "AMM交易", value: fpmm_trade, color: "#d4a574", desc: "FPMM.Buy/Sell", children: [
                { id: "fpmm_buy", label: "买入", value: s.xfer_fpmm_buy || 0, desc: "FPMMBuy: FPMM→用户" },
                { id: "fpmm_sell", label: "卖出", value: s.xfer_fpmm_sell || 0, desc: "FPMMSell: 用户→FPMM" }
              ]},
              { id: "fpmm_lp", label: "AMM流动性", value: fpmm_lp, color: "#74b4d4", desc: "FPMM LP操作", children: [
                { id: "lp_add", label: "添加", value: s.xfer_lp_add || 0, desc: "FundingAdded: 0x0→FPMM" },
                { id: "lp_remove", label: "移除", value: s.xfer_lp_remove || 0, desc: "FundingRemoved: FPMM→用户" },
                { id: "lp_return", label: "返还", value: s.xfer_lp_return || 0, desc: "FundingAdded余额: FPMM→用户" }
              ]},
              { id: "transfer", label: "转账", value: transfer, desc: "无语义事件的直接转账", children: [
                { id: "transfer_in", label: "转入", value: transfer_in, desc: "收到token", children: [
                  { id: "transfer_in_negrisk", label: "Adapter", value: s.xfer_transfer_in_negrisk || 0, desc: "Adapter→用户(无Split)" },
                  { id: "transfer_in_other", label: "其他", value: s.xfer_transfer_in_other || 0, desc: "用户/协议→用户" }
                ]},
                { id: "transfer_out", label: "转出", value: transfer_out, desc: "发出token", children: [
                  { id: "transfer_out_negrisk", label: "Adapter", value: s.xfer_transfer_out_negrisk || 0, desc: "用户→Adapter(无Merge)" },
                  { id: "transfer_out_other", label: "其他", value: s.xfer_transfer_out_other || 0, desc: "用户→用户/协议" }
                ]}
              ]}
            ]
          },
          { id: "internal", label: "内部操作", value: internal, color: "#666", desc: "协议内部,不影响用户",
            children: [
              { id: "internal_mint", label: "内部铸造", value: internal_mint, desc: "0x0→协议合约", children: [
                { id: "internal_mint_negrisk", label: "Adapter", value: s.xfer_internal_mint_negrisk || 0, desc: "0x0→NegRiskAdapter" },
                { id: "internal_mint_fpmm", label: "FPMM", value: s.xfer_internal_mint_fpmm || 0, desc: "0x0→FPMM(无Funding)" }
              ]},
              { id: "internal_burn", label: "内部销毁", value: internal_burn, desc: "协议合约→0x0/BurnAddr", children: [
                { id: "internal_burn_negrisk", label: "Adapter", value: s.xfer_internal_burn_negrisk || 0, desc: "NegRiskAdapter→0x0" },
                { id: "internal_burn_fpmm", label: "FPMM", value: s.xfer_internal_burn_fpmm || 0, desc: "FPMM→0x0" },
                { id: "internal_burn_convert", label: "Convert", value: s.xfer_internal_burn_convert || 0, desc: "Adapter→BurnAddr(NO)" }
              ]},
              { id: "internal_transfer", label: "内部转移", value: internal_transfer, desc: "协议间转移", children: [
                { id: "internal_transfer_zero", label: "零值", value: s.xfer_internal_transfer_zero || 0, desc: "amount=0的Transfer" },
                { id: "internal_transfer_order", label: "订单", value: s.xfer_internal_transfer_order || 0, desc: "Exchange双方均为协议" },
                { id: "internal_transfer_negrisk", label: "Adapter", value: s.xfer_internal_transfer_negrisk || 0, desc: "Adapter相关其他" },
                { id: "internal_transfer_fpmm", label: "FPMM", value: s.xfer_internal_transfer_fpmm || 0, desc: "FPMM Funding其他" },
                { id: "internal_transfer_other", label: "其他", value: s.xfer_internal_transfer_other || 0, desc: "其他协议间转移" }
              ]}
            ]
          },
          { id: "skipped", label: "跳过", value: skipped, color: "#888", desc: "非标准Polymarket",
            children: [
              { id: "non_usdc", label: "非USDC", value: non_usdc, desc: "非USDC抵押品FPMM", children: [
                { id: "non_usdc_mint", label: "铸造", value: s.xfer_non_usdc_mint || 0, desc: "0x0→非USDC FPMM" },
                { id: "non_usdc_burn", label: "销毁", value: s.xfer_non_usdc_burn || 0, desc: "非USDC FPMM→0x0" },
                { id: "non_usdc_op", label: "操作", value: s.xfer_non_usdc_op || 0, desc: "op=非USDC FPMM" }
              ]},
              { id: "non_poly", label: "非Polymarket", value: s.xfer_non_poly || 0, desc: "token不在Polymarket(如Omen)" }
            ]
          }
        ]
      };
    }

    function s2RenderNode(node, depth = 0) {
      const hasChildren = node.children && node.children.length > 0;
      const isExpanded = s2ExpandedNodes.has(node.id);
      const valueClass = node.value ? "" : " zero";
      const color = node.color || "#fff";
      const desc = node.desc ? ` <span class="stage2-tree-desc">${node.desc}</span>` : "";

      let html = `<div class="${hasChildren ? "stage2-tree-node" : "stage2-tree-leaf"}" data-id="${node.id}">`;
      if (hasChildren) {
        html += `<span class="stage2-tree-toggle">${isExpanded ? "▼" : "▶"}</span>`;
      }
      html += `<span class="stage2-tree-label">${node.label}</span> `;
      html += `<span class="stage2-tree-value${valueClass}" style="color:${color}">${s2Fmt(node.value)}</span>`;
      html += desc;
      html += `</div>`;

      if (hasChildren) {
        html += `<div class="stage2-tree-children${isExpanded ? " expanded" : ""}">`;
        for (const child of node.children) {
          html += s2RenderNode(child, depth + 1);
        }
        html += `</div>`;
      }
      return html;
    }

    function s2RenderTree(s) {
      const tree = s2BuildTree(s);
      const container = document.getElementById("s2-xfer-tree");
      if (container) {
        container.innerHTML = s2RenderNode(tree);
        container.querySelectorAll(".stage2-tree-node").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            if (s2ExpandedNodes.has(id)) s2ExpandedNodes.delete(id);
            else s2ExpandedNodes.add(id);
            s2RenderTree(window._s2LastData || {});
          });
        });
      }
    }

    function s2UpdateProgress(s) {
      window._s2LastData = s;
      const bar = document.getElementById("stage2-progress-bar");
      const badge = document.getElementById("stage2-badge");

      s2UpdateStats(s);

      const sync = s.stage2_sync || {};
      const cursor = sync.stage2_cursor || 0;
      const headBlock = sync.stage1_last_block || 0;
      const progress = headBlock > 0 ? (cursor / headBlock) * 100 : 0;
      bar.style.width = progress.toFixed(2) + "%";

      s2Set("s2-total-users", s.total_users);
      s2Set("s2-total-markets", s.total_markets);
      s2Set("s2-cond-total", s.cond_total);
      s2Set("s2-cond-amm", s.cond_amm);
      s2Set("s2-cond-norm", s.cond_norm);
      s2Set("s2-cond-negrisk", s.cond_negrisk);
      s2Set("s2-cond-other", s.cond_other);
      s2Set("s2-cond-src-prep", s.cond_src_prep);
      s2Set("s2-cond-src-poly-reg", s.cond_src_poly_token_reg);
      s2Set("s2-cond-src-poly-fpmm", s.cond_src_poly_fpmm);
      s2Set("s2-cond-src-other-fpmm", s.cond_src_other_fpmm);
      s2Set("s2-cond-src-split", s.cond_src_split);
      s2Set("s2-token-total", s.token_total);
      s2Set("s2-token-amm", s.token_amm);
      s2Set("s2-token-norm", s.token_norm);
      s2Set("s2-token-negrisk", s.token_negrisk);
      s2Set("s2-token-non-usdc", s.token_non_usdc);
      s2Set("s2-token-other", s.token_other);
      s2Set("s2-token-src-poly-reg", s.token_src_poly_reg);
      s2Set("s2-token-src-poly-fpmm", s.token_src_poly_fpmm);
      s2Set("s2-token-src-other-fpmm", s.token_src_other_fpmm);
      s2Set("s2-token-src-split", s.token_src_split);

      s2RenderTree(s);

      if (sync.syncing) {
        badge.className = "badge badge-warning";
        badge.textContent = "同步中";
      } else if (cursor >= headBlock && headBlock > 0) {
        badge.className = "badge badge-success";
        badge.textContent = "已同步";
      } else {
        badge.className = "badge badge-warning";
        badge.textContent = "等待中";
      }
    }

    async function s2Poll() {
      try {
        const resp = await fetch("/api/rebuild-status");
        const status = await resp.json();
        s2UpdateProgress(status);
        if (status.phase === 7 && !status.running && typeof rpOnRebuildDone === "function") {
          rpOnRebuildDone();
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      s2Poll();
      setInterval(s2Poll, 2000);
    });
  })();
</script>

<style>
  .s3-card {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #333;
    margin-bottom: 15px;
  }

  .s3-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }

  .s3-header h2 {
    font-size: 1.1em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .s3-header h2::before {
    content: "";
    width: 3px;
    height: 16px;
    background: #6366f1;
    border-radius: 2px;
  }

  .s3-query-row {
    margin-bottom: 12px;
  }

  .s3-progress {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .s3-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #818cf8);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .s3-sync-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .s3-sync-stat {
    background: #252525;
    border-radius: 4px;
    padding: 4px 10px;
  }

  .s3-sync-stat-label {
    font-size: 0.65em;
    color: #666;
  }

  .s3-sync-stat-value {
    font-size: 0.9em;
    font-weight: 500;
    font-family: monospace;
    color: #fff;
  }

  .s3-user-select {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .s3-user-input {
    width: 380px;
    padding: 6px 10px;
    font-size: 0.85em;
    background: #252525;
    color: #fff;
    border: 1px solid #333;
    border-radius: 4px;
    font-family: monospace;
  }

  .s3-user-input:focus {
    outline: none;
    border-color: #6366f1;
  }

  .s3-btn {
    padding: 6px 12px;
    font-size: 0.85em;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .s3-btn:hover {
    background: #444;
  }

  .s3-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .s3-btn-primary {
    background: #6366f1;
  }

  .s3-btn-primary:hover {
    background: #4f46e5;
  }

  .s3-query-hint {
    color: #666;
    font-size: 0.8em;
    margin-left: 8px;
  }

  .s3-body {
    display: block;
  }

  .s3-meta {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .s3-meta-item {
    background: #252525;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 0.85em;
  }

  .s3-meta-item .label {
    color: #888;
    font-size: 0.8em;
  }

  .s3-meta-item .value {
    color: #fff;
    font-family: monospace;
  }

  .s3-chart-container {
    position: relative;
    height: 420px;
    background: #0f0f0f;
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .s3-chart {
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .s3-legend {
    position: absolute;
    top: 8px;
    left: 12px;
    display: flex;
    gap: 12px;
    font-size: 0.7em;
    font-family: monospace;
    pointer-events: none;
    flex-wrap: wrap;
  }

  .s3-legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #aaa;
  }

  .s3-legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .s3-legend-line {
    width: 14px;
    height: 0;
    border-top: 2px solid currentColor;
    border-radius: 2px;
  }

  .s3-tooltip {
    position: absolute;
    background: rgba(0, 0, 0, 0.9);
    border: 1px solid #444;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.78em;
    font-family: monospace;
    pointer-events: none;
    z-index: 10;
    display: none;
    white-space: nowrap;
    line-height: 1.6;
  }

  .s3-chart-controls {
    position: absolute;
    top: 8px;
    right: 12px;
    display: flex;
    gap: 4px;
  }

  .s3-chart-btn {
    padding: 3px 8px;
    font-size: 0.72em;
    background: rgba(255, 255, 255, 0.1);
    color: #aaa;
    border: 1px solid #444;
    border-radius: 3px;
    cursor: pointer;
  }

  .s3-chart-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }

  .s3-cursor-bar {
    background: #252525;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    display: none;
    font-family: monospace;
    font-size: 0.82em;
    line-height: 1.8;
  }

  .s3-cursor-bar.show {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: baseline;
  }

  .s3-cursor-bar .sk {
    color: #888;
  }

  .s3-cursor-bar .pnl {
    font-size: 1.1em;
    font-weight: 600;
  }

  .s3-cursor-bar .pnl.pos {
    color: #10b981;
  }

  .s3-cursor-bar .pnl.neg {
    color: #ef4444;
  }

  .s3-cursor-bar .evt-badge {
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.9em;
  }

  .s3-cursor-bar .evt-detail {
    color: #bbb;
  }

  .s3-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .s3-panel {
    background: #252525;
    border-radius: 8px;
    padding: 12px;
  }

  .s3-panel-title {
    font-size: 0.9em;
    color: #fff;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #333;
  }

  .s3-positions,
  .s3-trades {
    height: 300px;
    overflow-y: auto;
  }

  .s3-pos-item {
    display: grid;
    grid-template-columns: minmax(240px, 1.2fr) minmax(320px, 1.8fr);
    gap: 8px;
    align-items: start;
    padding: 6px 8px;
    background: #1a1a1a;
    border-radius: 4px;
    margin-bottom: 3px;
    font-size: 0.76em;
    font-family: monospace;
  }

  .s3-pos-item:hover {
    background: #242434;
  }

  .s3-pos-tag {
    color: #ddd;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .s3-pos-ratio {
    position: relative;
    display: flex;
    height: 18px;
    background: #111;
    border-radius: 3px;
    overflow: hidden;
  }

  .s3-pos-ratio .seg {
    height: 100%;
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.86em;
    line-height: 1;
    white-space: nowrap;
    border-right: 1px solid rgba(0, 0, 0, 0.22);
  }

  .s3-pos-ratio .seg:last-child {
    border-right: none;
  }

  .s3-trade-item {
    display: flex;
    gap: 8px;
    padding: 5px 8px;
    background: #1a1a1a;
    border-radius: 4px;
    margin-bottom: 3px;
    font-size: 0.74em;
    font-family: monospace;
    transition: background 0.15s;
    cursor: pointer;
  }

  .s3-trade-item.focus {
    background: #2a2a3a;
    border-left: 2px solid #6366f1;
  }

  .s3-trade-item .blk {
    color: #666;
    min-width: 72px;
  }

  .s3-trade-item .type {
    min-width: 56px;
    font-weight: 500;
  }

  .s3-trade-item .detail {
    color: #aaa;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .s3-trade-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }

  .s3-trade-filter-btn {
    border: 1px solid #333;
    border-radius: 999px;
    background: #1a1a1a;
    color: #999;
    font-size: 0.72em;
    padding: 2px 8px;
    cursor: pointer;
    user-select: none;
  }

  .s3-trade-filter-btn.active {
    color: #fff;
    border-color: currentColor;
    background: rgba(255, 255, 255, 0.06);
  }
</style>

<div class="s3-card" id="s3-card">
  <div class="s3-header">
    <h2>同步 PnL</h2>
    <span id="s3-sync-badge" class="badge badge-warning">等待中</span>
  </div>
  <div class="s3-progress">
    <div class="s3-progress-bar" id="s3-progress-bar" style="width: 0%"></div>
  </div>
  <div class="s3-sync-stats">
    <div class="s3-sync-stat">
      <div class="s3-sync-stat-label">Last Block</div>
      <div class="s3-sync-stat-value" id="s3-last-block">0</div>
    </div>
    <div class="s3-sync-stat">
      <div class="s3-sync-stat-label">Head Block</div>
      <div class="s3-sync-stat-value" id="s3-head-block">0</div>
    </div>
    <div class="s3-sync-stat">
      <div class="s3-sync-stat-label">Behind</div>
      <div class="s3-sync-stat-value" id="s3-behind">-</div>
    </div>
    <div class="s3-sync-stat">
      <div class="s3-sync-stat-label">Speed</div>
      <div class="s3-sync-stat-value" id="s3-speed">-</div>
    </div>
    <div class="s3-sync-stat">
      <div class="s3-sync-stat-label">ETA</div>
      <div class="s3-sync-stat-value" id="s3-eta">-</div>
    </div>
  </div>
  <div class="s3-query-row">
    <div class="s3-user-select">
      <input type="text" class="s3-user-input" id="s3-user-input" placeholder="输入用户地址 (0x...)" />
      <button class="s3-btn s3-btn-primary" onclick="s3LoadUser()" id="s3-load-btn">查询</button>
      <span class="s3-query-hint">直接输入用户地址</span>
    </div>
  </div>

  <div class="s3-body" id="s3-body">
    <div class="s3-meta" id="s3-meta"></div>

    <div class="s3-chart-container" id="s3-chart-container">
      <canvas class="s3-chart" id="s3-chart"></canvas>
      <div class="s3-legend" id="s3-legend"></div>
      <div class="s3-chart-controls">
        <button class="s3-chart-btn" onclick="s3ResetZoom()">Reset</button>
      </div>
      <div class="s3-tooltip" id="s3-tooltip"></div>
    </div>

    <div class="s3-cursor-bar" id="s3-cursor-bar">
      <span class="sk" id="s3-cur-sk">-</span>
      <span class="pnl" id="s3-cur-pnl">$0.00</span>
      <span class="evt-badge" id="s3-cur-badge"></span>
      <span class="evt-detail" id="s3-cur-detail"></span>
      <span style="color:#818cf8" id="s3-cur-tokens"></span>
    </div>

    <div class="s3-details">
      <div class="s3-panel">
        <div class="s3-panel-title">持仓 (<span id="s3-pos-count">0</span>)</div>
        <div class="s3-positions" id="s3-positions"></div>
      </div>
      <div class="s3-panel">
        <div class="s3-panel-title">交易记录 (<span id="s3-trade-count">0</span>)</div>
        <div class="s3-trade-filters" id="s3-trade-filters"></div>
        <div class="s3-trades" id="s3-trades"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let _s3LatestBlock = 0;
  let _s3Timeline = [];
  let _s3Positions = [];
  let _s3CurrentUser = '';
  let _s3PosReqSeq = 0;
  let _s3ViewStartSk = 0;
  let _s3ViewEndSk = 0;
  let _s3CursorIdx = -1;
  let _s3Dragging = false;
  let _s3DragStartX = 0;
  let _s3DragStartVS = 0;
  let _s3DragStartVE = 0;
  let _s3DragMoved = false;
  let _s3PollingSync = false;
  let _s3TradeFilterKeys = new Set(['order_buy', 'order_sell', 'fpmm_buy', 'fpmm_sell']);

  const _s3Pad = { top: 30, right: 70, bottom: 32, left: 50 };
  function s3Assert(cond, msg) {
    if (!cond) throw new Error(msg || 's3 assert failed');
  }
  const _s3LegendEventGroups = [
    { key: 'order_buy', label: '买入', color: '#6366f1', types: [0] },
    { key: 'order_sell', label: '卖出', color: '#ef4444', types: [1] },
    { key: 'split', label: '铸造', color: '#eab308', types: [2, 3, 4] },
    { key: 'merge', label: '合并', color: '#f97316', types: [5, 6, 7] },
    { key: 'redeem', label: '赎回', color: '#22d3ee', types: [8, 9] },
    { key: 'convert', label: '转换', color: '#f472b6', types: [10] },
    { key: 'fpmm_buy', label: '池买入', color: '#6366f1', types: [11] },
    { key: 'fpmm_sell', label: '池卖出', color: '#ef4444', types: [12] },
    { key: 'lp_add', label: 'LP添加', color: '#14b8a6', types: [13] },
    { key: 'lp_remove', label: 'LP移除', color: '#14b8a6', types: [14] },
    { key: 'lp_return', label: 'LP返还', color: '#14b8a6', types: [15] },
    { key: 'transfer_in', label: '转入', color: '#64748b', types: [16, 17, 18] },
    { key: 'transfer_out', label: '转出', color: '#64748b', types: [19, 20, 21] },
  ];
  const _s3LineLegendItems = [
    { label: '已实现PnL', color: '#10b981' },
    { label: '未实现PnL', color: '#f59e0b' },
    { label: '总PnL', color: '#e5e7eb' },
    { label: '持仓数', color: '#818cf8' },
  ];
  const _s3TypeToLegendGroup = {};
  for (const g of _s3LegendEventGroups) {
    for (const ty of g.types) {
      s3Assert(_s3TypeToLegendGroup[ty] === undefined, `duplicate legend event type: ${ty}`);
      _s3TypeToLegendGroup[ty] = g.key;
    }
  }
  for (let ty = 0; ty <= 21; ty++) {
    s3Assert(_s3TypeToLegendGroup[ty] !== undefined, `missing legend event type: ${ty}`);
  }
  const _s3EventMeta = {
    0: { name: '买入', color: '#6366f1', cat: 'order_buy', marker: 'up' },
    1: { name: '卖出', color: '#ef4444', cat: 'order_sell', marker: 'down' },
    2: { name: '铸造', color: '#eab308', cat: 'split', marker: 'up' },
    3: { name: '铸造', color: '#eab308', cat: 'split', marker: 'up' },
    4: { name: '铸造', color: '#eab308', cat: 'split', marker: 'up' },
    5: { name: '合并', color: '#f97316', cat: 'merge', marker: 'down' },
    6: { name: '合并', color: '#f97316', cat: 'merge', marker: 'down' },
    7: { name: '合并', color: '#f97316', cat: 'merge', marker: 'down' },
    8: { name: '赎回', color: '#22d3ee', cat: 'redeem', marker: 'dot' },
    9: { name: '赎回', color: '#22d3ee', cat: 'redeem', marker: 'dot' },
    10: { name: '转换', color: '#f472b6', cat: 'convert', marker: 'dot' },
    11: { name: '池买入', color: '#6366f1', cat: 'fpmm_buy', marker: 'up' },
    12: { name: '池卖出', color: '#ef4444', cat: 'fpmm_sell', marker: 'down' },
    13: { name: 'LP添加', color: '#14b8a6', cat: 'lp_add', marker: 'up' },
    14: { name: 'LP移除', color: '#14b8a6', cat: 'lp_remove', marker: 'down' },
    15: { name: 'LP返还', color: '#14b8a6', cat: 'lp_return', marker: 'up' },
    16: { name: '转入', color: '#64748b', cat: 'transfer_in', marker: 'up' },
    17: { name: '转入', color: '#64748b', cat: 'transfer_in', marker: 'up' },
    18: { name: '转入', color: '#64748b', cat: 'transfer_in', marker: 'up' },
    19: { name: '转出', color: '#64748b', cat: 'transfer_out', marker: 'down' },
    20: { name: '转出', color: '#64748b', cat: 'transfer_out', marker: 'down' },
    21: { name: '转出', color: '#64748b', cat: 'transfer_out', marker: 'down' },
  };

  function s3EvtMeta(ty) {
    return _s3EventMeta[ty] || { name: `E${ty}`, color: '#888', cat: 'other', marker: 'dot' };
  }

  async function s3FetchJson(url) {
    const resp = await fetch(url);
    s3Assert(resp.ok, `request failed: ${url}`);
    return await resp.json();
  }

  document.addEventListener('DOMContentLoaded', () => {
    s3PollSync();
    setInterval(s3PollSync, 2000);

    const input = document.getElementById('s3-user-input');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        s3LoadUser();
      }
    });

    s3SetupInteraction();
    s3SetupTradePanelInteraction();
    s3RenderLegend();
    s3RenderTradeFilters();
    window.addEventListener('resize', () => { if (_s3Timeline.length) s3Draw(); });
  });

  async function s3PollSync() {
    if (_s3PollingSync) return;
    _s3PollingSync = true;
    try {
      const s = await s3FetchJson('/api/stage3-status');
      s3UpdateSyncStats(s || {});
    } catch (e) {
    } finally {
      _s3PollingSync = false;
    }
  }

  function s3UpdateSyncStats(sync) {
    const last = Number(sync.last_block || 0);
    const head = Number(sync.head_block || 0);
    const behind = Math.max(0, Number(sync.behind_blocks || 0));
    const syncing = !!sync.syncing;
    const bps = Number(sync.blocks_per_second || 0);
    const eta = Number(sync.eta_seconds ?? -1);

    document.getElementById('s3-last-block').textContent = last.toLocaleString();
    document.getElementById('s3-head-block').textContent = head.toLocaleString();
    document.getElementById('s3-behind').textContent = behind.toLocaleString();
    document.getElementById('s3-speed').textContent = bps > 0 ? `${Math.round(bps).toLocaleString()}/s` : '-';
    document.getElementById('s3-eta').textContent = s3FmtEta(eta);
    const progress = head > 0 ? (last / head) * 100 : 0;
    document.getElementById('s3-progress-bar').style.width = `${Math.max(0, Math.min(100, progress)).toFixed(2)}%`;

    const badge = document.getElementById('s3-sync-badge');
    if (syncing) {
      badge.className = 'badge badge-warning';
      badge.textContent = '同步中';
    } else if (behind === 0 && head > 0) {
      badge.className = 'badge badge-success';
      badge.textContent = '已同步';
    } else {
      badge.className = 'badge badge-warning';
      badge.textContent = '等待中';
    }

    if (typeof window.s3UpdatePoolUsage === 'function') {
      window.s3UpdatePoolUsage(sync.pool_usage || {});
    }
  }

  function s3SetFullWindow() {
    if (!_s3Timeline.length) return;
    const startSk = Number(_s3Timeline[0].sk || 0);
    const endSk = Number(_s3Timeline[_s3Timeline.length - 1].sk || 0);
    const margin = Math.max(1, Math.floor((endSk - startSk) * 0.02));
    _s3ViewStartSk = startSk - margin;
    _s3ViewEndSk = endSk + margin;
    s3Draw();
  }

  async function s3LoadUser() {
    const user = document.getElementById('s3-user-input').value.trim();
    if (!user) return;

    const btn = document.getElementById('s3-load-btn');
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const sameUser = _s3CurrentUser &&
        _s3CurrentUser.toLowerCase() === user.toLowerCase() &&
        _s3Timeline.length > 0;
      if (!sameUser) {
        const data = await s3FetchJson(`/api/stage3-pnl?user=${encodeURIComponent(user)}`);
        _s3CurrentUser = String(data.user || user);
        _s3LatestBlock = Number(data.block || 0);
        _s3Timeline = data.timeline || [];
        _s3Positions = [];
        s3RenderMeta();
        if (_s3Timeline.length) {
          s3SetFullWindow();
        }
      }

      if (_s3Timeline.length) {
        if (sameUser) {
          s3SetFullWindow();
        }
        await s3ApplyCursorIdx(_s3Timeline.length - 1, true);
      } else {
        _s3CursorIdx = -1;
        _s3Positions = [];
        s3Draw();
        s3UpdateCursor();
        s3RenderPositions([]);
        s3RenderEvents();
      }
    } catch (e) {
      console.error('s3LoadUser', e);
    } finally {
      btn.disabled = false;
      btn.textContent = '查询';
    }
  }

  async function s3LoadPositionsBySk(sk) {
    if (!_s3CurrentUser) return;
    const targetSk = Math.floor(Number(sk));
    if (!Number.isFinite(targetSk) || targetSk < 0) return;
    const reqSeq = ++_s3PosReqSeq;
    try {
      const data = await s3FetchJson(
        `/api/stage3-positions?user=${encodeURIComponent(_s3CurrentUser)}&sort_key=${encodeURIComponent(targetSk)}`
      );
      if (reqSeq !== _s3PosReqSeq) return;
      _s3Positions = data.positions || [];
      s3RenderPositions(_s3Positions);
      s3RenderMeta();
    } catch (e) {
      console.error('s3LoadPositionsBySk', e);
    }
  }

  async function s3ApplyCursorIdx(idx, fetchPositions) {
    _s3CursorIdx = idx;
    s3Draw();
    s3UpdateCursor();
    s3RenderEvents();
    if (fetchPositions && idx >= 0 && idx < _s3Timeline.length) {
      await s3LoadPositionsBySk(_s3Timeline[idx].sk);
    }
  }

  function s3RenderMeta() {
    if (!_s3CurrentUser) return;
    const nCond = new Set((_s3Positions || []).map(p => p.ci)).size;
    const finalRpnl = _s3Timeline.length ? _s3Timeline[_s3Timeline.length - 1].rpnl / 1e6 : 0;
    const finalUpnl = _s3Timeline.length ? _s3Timeline[_s3Timeline.length - 1].upnl / 1e6 : 0;
    const finalTpnl = finalRpnl + finalUpnl;

    const c = {};
    for (const g of _s3LegendEventGroups) c[g.key] = 0;
    c.other = 0;
    for (const e of _s3Timeline) {
      const key = _s3TypeToLegendGroup[e.ty];
      if (!key) {
        c.other += 1;
        continue;
      }
      c[key] = (c[key] || 0) + 1;
    }
    const metaRows = _s3LegendEventGroups.map(g =>
      `<div class="s3-meta-item"><div class="label" style="color:${g.color}">${g.label}</div><div class="value">${c[g.key] || 0}</div></div>`
    ).join('');
    const otherRow = c.other > 0
      ? `<div class="s3-meta-item"><div class="label" style="color:#888">其他</div><div class="value">${c.other}</div></div>`
      : '';

    document.getElementById('s3-meta').innerHTML = `
    <div class="s3-meta-item"><div class="label">事件</div><div class="value">${_s3Timeline.length}</div></div>
    ${metaRows}
    ${otherRow}
    <div class="s3-meta-item"><div class="label">问题</div><div class="value">${nCond}</div></div>
    <div class="s3-meta-item"><div class="label">已实现</div><div class="value" style="color:${finalRpnl >= 0 ? '#10b981' : '#ef4444'}">${s3FmtUSD(finalRpnl)}</div></div>
    <div class="s3-meta-item"><div class="label">未实现</div><div class="value" style="color:${finalUpnl >= 0 ? '#f59e0b' : '#ef4444'}">${s3FmtUSD(finalUpnl)}</div></div>
    <div class="s3-meta-item"><div class="label">总PnL</div><div class="value" style="color:${finalTpnl >= 0 ? '#10b981' : '#ef4444'}">${s3FmtUSD(finalTpnl)}</div></div>
    <div class="s3-meta-item"><div class="label">查询区块</div><div class="value">${_s3LatestBlock ? _s3LatestBlock.toLocaleString() : '-'}</div></div>
  `;
  }

  function s3ResetZoom() {
    if (!_s3Timeline.length) return;
    s3SetFullWindow();
  }

  function s3Draw() {
    const canvas = document.getElementById('s3-chart');
    const container = document.getElementById('s3-chart-container');
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    const cssW = rect.width;
    const cssH = rect.height;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    if (_s3Timeline.length < 1) {
      ctx.fillStyle = '#888'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('无数据', cssW / 2, cssH / 2);
      return;
    }

    const p = _s3Pad;
    const cW = cssW - p.left - p.right;
    const cH = cssH - p.top - p.bottom;
    const skRange = _s3ViewEndSk - _s3ViewStartSk;
    if (skRange <= 0) return;

    let iStart = s3Bsearch(_s3Timeline, _s3ViewStartSk) - 1;
    let iEnd = s3Bsearch(_s3Timeline, _s3ViewEndSk) + 1;
    iStart = Math.max(0, iStart);
    iEnd = Math.min(_s3Timeline.length - 1, iEnd);
    if (iStart > iEnd) {
      ctx.fillStyle = '#888';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('当前窗口无数据', cssW / 2, cssH / 2);
      return;
    }

    let minY = Infinity, maxY = -Infinity;
    for (let i = iStart; i <= iEnd; i++) {
      const rp = (_s3Timeline[i].rpnl || 0) / 1e6;
      const up = (_s3Timeline[i].upnl || 0) / 1e6;
      const tp = rp + up;
      if (rp < minY) minY = rp;
      if (rp > maxY) maxY = rp;
      if (up < minY) minY = up;
      if (up > maxY) maxY = up;
      if (tp < minY) minY = tp;
      if (tp > maxY) maxY = tp;
    }
    if (minY === maxY) { minY -= 1; maxY += 1; }
    if (minY > 0) minY = 0;
    if (maxY < 0) maxY = 0;
    const yPad = (maxY - minY) * 0.08;
    minY -= yPad; maxY += yPad;
    const yRange = maxY - minY;

    let maxTk = 0;
    for (let i = iStart; i <= iEnd; i++) {
      const tk = _s3Timeline[i].tk || 0;
      if (tk > maxTk) maxTk = tk;
    }
    maxTk = Math.max(50, Math.ceil(maxTk / 50) * 50);

    const sk2x = (sk) => p.left + (sk - _s3ViewStartSk) / skRange * cW;
    const val2y = (v) => p.top + (1 - (v - minY) / yRange) * cH;
    const tk2y = (tk) => p.top + (1 - tk / maxTk) * cH;

    const tkStep = s3NiceTkStep(maxTk);
    ctx.font = '10px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#6366f1';
    for (let t = tkStep; t <= maxTk; t += tkStep) {
      const yy = tk2y(t);
      ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = 0.5;
      ctx.setLineDash([2, 4]); ctx.beginPath();
      ctx.moveTo(p.left, yy); ctx.lineTo(cssW - p.right, yy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillText(t, p.left - 4, yy + 3);
    }

    ctx.strokeStyle = '#222'; ctx.lineWidth = 0.5;
    const yStep = s3NiceStep(yRange, 6);
    let yTick = Math.ceil(minY / yStep) * yStep;
    ctx.textAlign = 'right'; ctx.fillStyle = '#555';
    while (yTick <= maxY) {
      const yy = val2y(yTick);
      ctx.beginPath(); ctx.moveTo(p.left, yy); ctx.lineTo(cssW - p.right, yy); ctx.stroke();
      ctx.fillText(s3FmtUSDShort(yTick), cssW - p.right + 4, yy + 3);
      yTick += yStep;
    }

    const xStep = s3NiceSkStep(skRange);
    let xTick = Math.ceil(_s3ViewStartSk / xStep) * xStep;
    ctx.textAlign = 'center'; ctx.font = '11px monospace'; ctx.fillStyle = '#b5b5b5';
    while (xTick <= _s3ViewEndSk) {
      const xx = sk2x(xTick);
      ctx.strokeStyle = '#2f2f2f'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(xx, p.top); ctx.lineTo(xx, cssH - p.bottom); ctx.stroke();
      ctx.fillText(s3FmtAxisBlock(xTick), xx, cssH - p.bottom + 14);
      xTick += xStep;
    }

    if (minY < 0 && maxY > 0) {
      const zy = val2y(0);
      ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]); ctx.beginPath();
      ctx.moveTo(p.left, zy); ctx.lineTo(cssW - p.right, zy); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.strokeStyle = 'rgba(129,140,248,0.5)'; ctx.lineWidth = 1; ctx.beginPath();
    let firstTk = true;
    for (let i = iStart; i <= iEnd; i++) {
      const x = sk2x(_s3Timeline[i].sk);
      const y = tk2y(_s3Timeline[i].tk || 0);
      if (firstTk) { ctx.moveTo(x, y); firstTk = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1.5; ctx.beginPath();
    let firstPoint = true;
    for (let i = iStart; i <= iEnd; i++) {
      const x = sk2x(_s3Timeline[i].sk);
      const y = val2y((_s3Timeline[i].rpnl || 0) / 1e6);
      if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.2; ctx.beginPath();
    firstPoint = true;
    for (let i = iStart; i <= iEnd; i++) {
      const x = sk2x(_s3Timeline[i].sk);
      const y = val2y((_s3Timeline[i].upnl || 0) / 1e6);
      if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1.2; ctx.beginPath();
    firstPoint = true;
    for (let i = iStart; i <= iEnd; i++) {
      const x = sk2x(_s3Timeline[i].sk);
      const y = val2y(((_s3Timeline[i].rpnl || 0) + (_s3Timeline[i].upnl || 0)) / 1e6);
      if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    if (!firstPoint) {
      const baseY = val2y(Math.max(minY, 0));
      ctx.lineTo(sk2x(_s3Timeline[iEnd].sk), baseY);
      ctx.lineTo(sk2x(_s3Timeline[iStart].sk), baseY);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, p.top, 0, cssH - p.bottom);
      grad.addColorStop(0, 'rgba(16,185,129,0.18)');
      grad.addColorStop(1, 'rgba(16,185,129,0)');
      ctx.fillStyle = grad; ctx.fill();
    }

    const minPxGap = 3;
    let lastMx = -999;
    for (let i = iStart; i <= iEnd; i++) {
      const e = _s3Timeline[i];
      const x = sk2x(e.sk);
      if (Math.abs(x - lastMx) < minPxGap) continue;
      lastMx = x;
      const y = val2y(((e.rpnl || 0) + (e.upnl || 0)) / 1e6);
      const meta = s3EvtMeta(e.ty);
      const color = meta.color;
      const r = 3;

      ctx.fillStyle = color;
      if (meta.marker === 'up') {
        ctx.beginPath();
        ctx.moveTo(x, y - r - 1);
        ctx.lineTo(x - r, y + r - 1);
        ctx.lineTo(x + r, y + r - 1);
        ctx.closePath(); ctx.fill();
      } else if (meta.marker === 'down') {
        ctx.beginPath();
        ctx.moveTo(x, y + r + 1);
        ctx.lineTo(x - r, y - r + 1);
        ctx.lineTo(x + r, y - r + 1);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (_s3CursorIdx >= 0 && _s3CursorIdx < _s3Timeline.length) {
      const ce = _s3Timeline[_s3CursorIdx];
      const cx = sk2x(ce.sk);
      const cy = val2y(((ce.rpnl || 0) + (ce.upnl || 0)) / 1e6);

      if (cx >= p.left && cx <= cssW - p.right) {
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]); ctx.beginPath();
        ctx.moveTo(cx, p.top); ctx.lineTo(cx, cssH - p.bottom); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#fff'; ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = s3EvtMeta(ce.ty).color; ctx.lineWidth = 2; ctx.stroke();
      }
    }

  }

  function s3SetupInteraction() {
    const canvas = document.getElementById('s3-chart');

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!_s3Timeline.length) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const p = _s3Pad;
      const frac = Math.max(0, Math.min(1, (mx - p.left) / (rect.width - p.left - p.right)));
      const mouseSk = _s3ViewStartSk + frac * (_s3ViewEndSk - _s3ViewStartSk);
      const factor = e.deltaY > 0 ? 1.25 : 0.8;
      const newRange = (_s3ViewEndSk - _s3ViewStartSk) * factor;
      if (newRange < 1e6 && factor < 1) return;
      _s3ViewStartSk = mouseSk - frac * newRange;
      _s3ViewEndSk = mouseSk + (1 - frac) * newRange;
      s3Draw();
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      _s3Dragging = true;
      _s3DragMoved = false;
      _s3DragStartX = e.clientX;
      _s3DragStartVS = _s3ViewStartSk;
      _s3DragStartVE = _s3ViewEndSk;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (_s3Dragging) {
        const dx = e.clientX - _s3DragStartX;
        if (Math.abs(dx) > 3) _s3DragMoved = true;
        const rect = document.getElementById('s3-chart').getBoundingClientRect();
        const skPerPx = (_s3DragStartVE - _s3DragStartVS) / (rect.width - _s3Pad.left - _s3Pad.right);
        const shift = -dx * skPerPx;
        _s3ViewStartSk = _s3DragStartVS + shift;
        _s3ViewEndSk = _s3DragStartVE + shift;
        s3Draw();
      }
      s3UpdateTooltip(e);
    });

    window.addEventListener('mouseup', (e) => {
      if (_s3Dragging) {
        _s3Dragging = false;
        const canvas = document.getElementById('s3-chart');
        canvas.style.cursor = 'crosshair';
        if (!_s3DragMoved) {
          s3SetCursorFromMouse(e);
        }
      }
    });

    canvas.addEventListener('mouseleave', () => {
      document.getElementById('s3-tooltip').style.display = 'none';
    });
  }

  function s3SetCursorFromMouse(e) {
    const idx = s3MouseToIdx(e);
    if (idx < 0) return;
    s3ApplyCursorIdx(idx, true);
  }

  function s3MouseToIdx(e) {
    if (!_s3Timeline.length) return -1;
    const canvas = document.getElementById('s3-chart');
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const p = _s3Pad;
    const frac = (mx - p.left) / (rect.width - p.left - p.right);
    const sk = _s3ViewStartSk + frac * (_s3ViewEndSk - _s3ViewStartSk);
    return s3NearestIdx(sk);
  }

  function s3NearestIdx(sk) {
    let lo = 0, hi = _s3Timeline.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (_s3Timeline[mid].sk < sk) lo = mid + 1;
      else hi = mid;
    }
    if (lo > 0 && Math.abs(_s3Timeline[lo - 1].sk - sk) < Math.abs(_s3Timeline[lo].sk - sk)) return lo - 1;
    return lo;
  }

  function s3EventPnl(ev) {
    const rpnl = Number(ev.rpnl || 0) / 1e6;
    const upnl = Number(ev.upnl || 0) / 1e6;
    return { rpnl, upnl, tpnl: rpnl + upnl };
  }

  function s3UpdateTooltip(e) {
    const tooltip = document.getElementById('s3-tooltip');
    if (!_s3Timeline.length || _s3Dragging) { tooltip.style.display = 'none'; return; }

    const canvas = document.getElementById('s3-chart');
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (mx < _s3Pad.left || mx > rect.width - _s3Pad.right || my < _s3Pad.top || my > rect.height - _s3Pad.bottom) {
      tooltip.style.display = 'none'; return;
    }

    const frac = (mx - _s3Pad.left) / (rect.width - _s3Pad.left - _s3Pad.right);
    const sk = _s3ViewStartSk + frac * (_s3ViewEndSk - _s3ViewStartSk);
    const idx = s3NearestIdx(sk);
    const ev = _s3Timeline[idx];
    const { rpnl, upnl, tpnl } = s3EventPnl(ev);
    const meta = s3EvtMeta(ev.ty);
    const color = meta.color;
    const name = meta.name;
    const tkCount = ev.tk || 0;

    tooltip.innerHTML = `
    <div style="color:#888">区块 ${s3FmtAxisBlock(ev.sk)} (${s3FmtSk(ev.sk)})</div>
    <div style="color:#10b981">已实现PnL ${s3FmtUSD(rpnl)}</div>
    <div style="color:#f59e0b">未实现PnL ${s3FmtUSD(upnl)}</div>
    <div style="color:${tpnl >= 0 ? '#10b981' : '#ef4444'};font-size:1.1em">总PnL ${s3FmtUSD(tpnl)}</div>
    <div><span style="color:${color}">事件 ${name}</span></div>
    <div style="color:#818cf8">持仓数 ${tkCount} 种</div>
  `;
    tooltip.style.display = 'block';

    let tx = mx + 14, ty = my - 10;
    if (tx + 200 > rect.width) tx = mx - 200;
    if (ty < 0) ty = 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  }

  function s3UpdateCursor() {
    const bar = document.getElementById('s3-cursor-bar');
    if (_s3CursorIdx < 0 || _s3CursorIdx >= _s3Timeline.length) {
      bar.classList.remove('show'); return;
    }
    bar.classList.add('show');

    const ev = _s3Timeline[_s3CursorIdx];
    const { rpnl, upnl, tpnl } = s3EventPnl(ev);
    const meta = s3EvtMeta(ev.ty);

    document.getElementById('s3-cur-sk').textContent = s3FmtSk(ev.sk);

    pnlEl.className = 'pnl ' + (tpnl >= 0 ? 'pos' : 'neg');

    const badge = document.getElementById('s3-cur-badge');
    badge.textContent = meta.name;
    badge.style.background = color;
    badge.style.color = '#fff';

    document.getElementById('s3-cur-tokens').textContent = `持仓 ${ev.tk || 0} 种`;
    document.getElementById('s3-cur-detail').textContent = `R ${s3FmtUSD(rpnl)} / U ${s3FmtUSD(upnl)}`;
  }

  function s3RenderPositions(positions) {
    const el = document.getElementById('s3-positions');
    const countEl = document.getElementById('s3-pos-count');
    if (!positions.length) {
      countEl.textContent = '0';
      el.innerHTML = '<div style="color:#888;padding:10px">无持仓</div>';
      return;
    }
    const grouped = new Map();
    for (const p of positions) {
      const ci = Number(p.ci ?? -1);
      const ti = Number(p.ti ?? -1);
      const oc = Math.max(2, Number(p.oc ?? 2));
      const qtyAbs = Math.abs(Number(p.qty ?? 0) / 1e6);
      if (!Number.isFinite(ci) || !Number.isFinite(ti) || !Number.isFinite(oc) || !Number.isFinite(qtyAbs)) continue;
      if (ti < 0) continue;
      const key = String(ci);
      if (!grouped.has(key)) {
        grouped.set(key, {
          ci,
          oc,
          tokenQty: new Map(),
          tag: String(p.tag || 'unknown'),
          q: String(p.q || 'unknown'),
          desc: String(p.desc || ''),
        });
      }
      const row = grouped.get(key);
      row.oc = Math.max(Number(row.oc || 2), oc);
      row.tokenQty.set(ti, (row.tokenQty.get(ti) || 0) + qtyAbs);
    }

    const rows = Array.from(grouped.values())
      .map(r => {
        const items = [];
        const oc = Math.max(2, Number(r.oc || 2));
        for (let ti = 0; ti < oc; ti++) {
          items.push([ti, Number(r.tokenQty.get(ti) || 0)]);
        }
        if (oc === 2) {
          items.reverse(); // 2-outcome: render YES(t1) first, then NO(t0)
        }
        const total = items.reduce((s, [_, qty]) => s + qty, 0);
        const maxQty = items.reduce((m, [_, qty]) => Math.max(m, qty), 0);
        return { ...r, items, total, maxQty };
      })
      .filter(r => r.items.length > 0)
      .sort((a, b) => b.total - a.total);
    countEl.textContent = rows.length;
    el.innerHTML = rows.map(r => {
      const title = [
        `问题: ${r.q || '-'}`,
        r.desc ? `描述: ${r.desc}` : '',
      ].filter(Boolean).join('\n');
      const titleEsc = s3EscAttr(title);
      const tagLine = s3EscHtml(`${r.tag}`);
      return `<div class="s3-pos-item" title="${titleEsc}">
      <span class="s3-pos-tag">c${r.ci} | ${tagLine}</span>
      <div class="s3-pos-ratio">${r.items.map(([ti, qty]) => {
        const color = s3TokenColor(ti, r.items.length, qty, r.maxQty);
        return `<span class="seg" style="background:${color}" title="${s3FmtQtyCompact(qty)}">${s3FmtQtyCompact(qty)}</span>`;
      }).join('')}</div>
    </div>`;
    }).join('');
  }

  function s3RenderEvents() {
    const el = document.getElementById('s3-trades');
    const countEl = document.getElementById('s3-trade-count');
    const selected = _s3TradeFilterKeys;

    const rows = [];
    for (let i = _s3Timeline.length - 1; i >= 0; i--) {
      const ev = _s3Timeline[i];
      const isFocus = (i === _s3CursorIdx);
      const meta = s3EvtMeta(ev.ty);
      const color = meta.color;
      const name = meta.name;
      if (!selected.has(meta.cat)) continue;

      const detail = s3EventDetail(ev);

      rows.push(`<div class="s3-trade-item${isFocus ? ' focus' : ''}" data-idx="${i}">
      <span class="blk">${s3FmtSkShort(ev.sk)}</span>
      <span class="type" style="color:${color}">${name}</span>
      <span class="detail">${detail}</span>
    </div>`);
    }
    countEl.textContent = rows.length;

    el.innerHTML = rows.length ? rows.join('') : '<div style="color:#888;padding:10px">无交易</div>';

    const focusEl = el.querySelector('.focus');
    if (focusEl) focusEl.scrollIntoView({ block: 'nearest' });
  }

  function s3RenderTradeFilters() {
    const el = document.getElementById('s3-trade-filters');
    el.innerHTML = _s3LegendEventGroups.map(g => {
      const active = _s3TradeFilterKeys.has(g.key) ? ' active' : '';
      return `<button class="s3-trade-filter-btn${active}" data-key="${g.key}" style="color:${g.color}">${g.label}</button>`;
    }).join('');

  function s3RenderLegend() {
    const el = document.getElementById('s3-legend');
    const lineItems = _s3LineLegendItems.map(item => (
      `<div class="s3-legend-item" style="color:${item.color}"><div class="s3-legend-line"></div>${item.label}</div>`
    )).join('');
    const eventItems = _s3LegendEventGroups.map(g => (
      `<div class="s3-legend-item"><div class="s3-legend-dot" style="background:${g.color}"></div>${g.label}</div>`
    )).join('');

  function s3SetupTradePanelInteraction() {
    const filtersEl = document.getElementById('s3-trade-filters');
    filtersEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.s3-trade-filter-btn');
      if (!btn) return;
      const key = btn.dataset.key || '';
      if (!_s3LegendEventGroups.find(g => g.key === key)) return;
      if (_s3TradeFilterKeys.has(key)) _s3TradeFilterKeys.delete(key);
      else _s3TradeFilterKeys.add(key);
      s3RenderTradeFilters();
      s3RenderEvents();
    });

    const tradesEl = document.getElementById('s3-trades');
    tradesEl.addEventListener('click', (e) => {
      const item = e.target.closest('.s3-trade-item');
      if (!item) return;
      const idx = Number(item.dataset.idx);
      if (!Number.isInteger(idx)) return;
      s3ApplyCursorIdx(idx, true);
    });
  }

  function s3EventDetail(ev) {
    const action = s3EscHtml(s3EventAction(ev));
    const tag = s3EscHtml(String(ev.tag || 'unknown'));
    const price = s3FmtTradePrice(ev.px);
    const amount = s3FmtTradeAmount(ev.amt);
    return `动作 ${action} | tag ${tag} | price ${price} | amount ${amount}`;
  }

  function s3EventAction(ev) {
    const meta = s3EvtMeta(ev.ty);
    const ci = Number(ev.ci ?? -1);
    const ti = Number(ev.ti ?? -1);
    const suffix = [];
    if (Number.isInteger(ci) && ci >= 0) suffix.push(`c${ci}`);
    if (Number.isInteger(ti) && ti >= 0) suffix.push(`t${ti}`);
    return suffix.length ? `${meta.name}(${suffix.join(',')})` : meta.name;
  }

  function s3FmtTradePrice(v) {
    const px = Number(v || 0) / 1e6;
    if (!Number.isFinite(px) || px <= 0) return '-';
    const digits = px >= 1 ? 4 : 6;
    return s3TrimFixed(px, digits);
  }

  function s3FmtTradeAmount(v) {
    const amt = Number(v || 0) / 1e6;
    if (!Number.isFinite(amt)) return '-';
    const abs = Math.abs(amt);
    if (abs === 0) return '0';
    const sign = amt > 0 ? '+' : '-';
    if (abs >= 1e6) return sign + s3TrimFixed(abs / 1e6, 2) + 'M';
    if (abs >= 1e3) return sign + s3TrimFixed(abs / 1e3, 2) + 'K';
    const digits = abs >= 100 ? 2 : (abs >= 1 ? 4 : 6);
    return sign + s3TrimFixed(abs, digits);
  }

  function s3TrimFixed(v, digits) {
    return Number(v).toFixed(digits).replace(/\.?0+$/, '');
  }

  function s3NiceTkStep(max) {
    const nice = [50, 100, 150, 200, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000];
    const target = max / 8;
    for (const n of nice) { if (n >= target) return n; }
    return Math.ceil(target / 100000) * 100000;
  }

  function s3FmtUSD(v) {
    return (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2);
  }

  function s3FmtQtyCompact(v) {
    const abs = Math.abs(Number(v) || 0);
    if (abs >= 1e6) return (abs / 1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return (abs / 1e3).toFixed(1) + 'K';
    return abs.toFixed(1);
  }

  function s3EscHtml(s) {
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function s3EscAttr(s) {
    return s3EscHtml(String(s));
  }

  function s3TokenColor(ti, nTokens, qty, maxQty) {
    const q = Math.max(0, Number(qty) || 0);
    const m = Math.max(0, Number(maxQty) || 0);
    const strength = m > 0 ? (q / m) : 0;
    const alpha = 0.10 + 0.65 * strength;
    if (nTokens === 2) {
      if (ti === 1) return `rgba(16,185,129,${alpha.toFixed(3)})`; // YES
      if (ti === 0) return `rgba(239,68,68,${alpha.toFixed(3)})`;  // NO
    }
    const palette = [
      [99, 102, 241],
      [16, 185, 129],
      [239, 68, 68],
      [245, 158, 11],
      [34, 211, 238],
      [168, 85, 247],
      [20, 184, 166],
      [244, 114, 182],
    ];
    const idx = Math.abs(Number(ti) || 0) % palette.length;
    const c = palette[idx];
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha.toFixed(3)})`;
  }

  function s3FmtUSDShort(v) {
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
    return sign + '$' + abs.toFixed(abs < 1 ? 2 : 0);
  }

  function s3FmtSk(sk) {
    const block = Math.floor(sk / 1e9);
    const logIdx = sk % 1e9;
    return `block ${block.toLocaleString()} #${logIdx}`;
  }

  function s3FmtSkShort(sk) {
    const block = Math.floor(sk / 1e9);
    return block.toLocaleString();
  }

  function s3FmtAxisBlock(sk) {
    const block = Math.floor(Number(sk) / 1e9);
    if (!Number.isFinite(block) || block < 0) return '-';
    if (block >= 1e6) return s3TrimFixed(block / 1e6, 1) + 'M';
    if (block >= 1e3) return s3TrimFixed(block / 1e3, 1) + 'K';
    return String(block);
  }

  function s3FmtEta(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '-';
    if (seconds < 60) return `${Math.max(1, Math.round(seconds))}s`;
    if (seconds < 3600) return `${(seconds / 60).toFixed(1)}m`;
    if (seconds < 86400) return `${(seconds / 3600).toFixed(1)}h`;
    return `${(seconds / 86400).toFixed(1)}d`;
  }

  function s3NiceStep(range, ticks) {
    const rough = range / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const res = rough / mag;
    let nice;
    if (res <= 1.5) nice = 1;
    else if (res <= 3) nice = 2;
    else if (res <= 7) nice = 5;
    else nice = 10;
    return nice * mag;
  }

  function s3NiceSkStep(rangeSk) {
    const rangeBlocks = rangeSk / 1e9;
    const targets = [100, 500, 1000, 5000, 10000, 50000, 100000, 500000, 1000000, 5000000, 10000000];
    const ideal = rangeBlocks / 8;
    for (const t of targets) { if (t >= ideal) return t * 1e9; }
    return targets[targets.length - 1] * 1e9;
  }

  function s3Bsearch(arr, sk) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid].sk < sk) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }
</script>

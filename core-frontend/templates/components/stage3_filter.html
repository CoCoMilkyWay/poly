<style>

    .s3f-result-head {

    .s3f-table-wrap {

    .s3f-table {

    .s3f-table th,

        padding: 8px 10px;
        border-bottom: 1px solid #2a2a2a;

    .s3f-table th {

    .s3f-addr-btn {

    .s3f-addr-btn:hover {
        color: #93c5fd;

    .s3f-empty {
        padding: 12px;
        color: #777;

    .s3f-section-title {

        font-family: monospace;
        margin-left: 8px;
    }

    .s3f-filter-stat .s3f-pass {
        color: #22c55e;
    }

    .s3f-filter-stat .s3f-reject {

    .s3f-rhs-group {
        display: inline-flex;
        gap: 8px;
        align-items: center;

</style>

<div class="s3f-card">
    <div class="s3f-header">
        <h2>用户截面过滤器</h2>
        <span class="s3f-sub">当前截面用户数: <span id="s3f-total-users">-</span> | 输出过滤后的 Top100 用户地址</span>
    </div>

    <div class="s3f-section-title">过滤条件(AND 关系，支持乘除)</div>
    <div id="s3f-filters-box" class="s3f-filters-box">
        <div id="s3f-filter-empty" class="s3f-filter-empty">当前无过滤条件，将仅按排序返回 Top100</div>
    </div>
    <button class="s3f-btn s3f-btn-small s3f-btn-add" onclick="s3fAddFilter()">+ 添加条件</button>

    <div class="s3f-section-title" style="margin-top:12px">排序条件</div>
    <div class="s3f-row">
        <select id="s3f-sort-industry" class="s3f-select">
            <option value="ALL">ALL (全部)</option>
            <option value="Crypto_Price">Crypto_Price</option>
            <option value="Crypto_Market">Crypto_Market</option>
            <option value="Sports_Basketball">Sports_Basketball</option>
            <option value="Sports_Football">Sports_Football</option>
            <option value="Sports_Soccer">Sports_Soccer</option>
            <option value="Sports_Individual">Sports_Individual</option>
            <option value="Politics_US">Politics_US</option>
            <option value="Politics_World">Politics_World</option>
            <option value="Economy_Finance">Economy_Finance</option>
            <option value="Tech">Tech</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Weather">Weather</option>
            <option value="Society">Society</option>
            <option value="Unknown">Unknown</option>
        </select>
        <select id="s3f-sort-feature" class="s3f-select">
            <option value="shp">夏普 shp</option>
            <option value="exp">暴露额 exp (USD)</option>
            <option value="tok">持仓数 tok</option>
            <option value="vol">交易额 vol (USD)</option>
            <option value="hp">持仓周期 hp</option>

        <select id="s3f-sort-window" class="s3f-select">

        <select id="s3f-sort-dir" class="s3f-select">
            <option value="desc">DESC ↓</option>

    <div class="s3f-table-wrap">
        <table class="s3f-table">

                <tr>
                    <th style="width:72px">#</th>

                    <th>月均持仓数</th>

            </thead>

                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let _s3fMaxBucket = -1;
    let _s3fTotalUsers = 0;
    let _s3fIsRunning = false; // 防止并发请求
    let _s3fNextFilterId = 1;
    let _s3fLastSortFeature = 'shp'; // 记录上次排序的特征，用于单位转换
    const _s3fDefaultFilters = [
        { industry: 'ALL', feature: 'exp', window: '100', arith: '', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '>', value: '5000' },
        { industry: 'ALL', feature: 'vol', window: '100', arith: '/', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '>', value: '1.0' },
        { industry: 'ALL', feature: 'tok', window: '1k', arith: '', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '>', value: '10' },
        { industry: 'ALL', feature: 'tok', window: '1k', arith: '', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '<', value: '100' },
        { industry: 'ALL', feature: 'hp', window: '1k', arith: '', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '>', value: '50000' },
        { industry: 'ALL', feature: 'hp', window: '1k', arith: '', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '<', value: '500000' },
        { industry: 'ALL', feature: 'shp', window: '100', arith: '', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '>', value: '0.5' },
        { industry: 'Politics_World', feature: 'exp', window: '100', arith: '/', rhsIndustry: 'ALL', rhsFeature: 'exp', rhsWindow: '100', op: '>', value: '0.5' },
    ];

    // 金钱相关特征需要除以 1e6 转换为 USD
    const _s3fMoneyFeatures = new Set(['exp', 'vol']);

    function s3fAllocFilterId() {
        const id = `f${_s3fNextFilterId}`;
        _s3fNextFilterId += 1;
        return id;
    }

    function s3fNormalizeIndustryForFeature(industry, feature) {
        return feature === 'shp' ? 'ALL' : industry;
    }

    function s3fApplyFeatureIndustryConstraint(featureSelect, industrySelect) {
        assert(featureSelect && industrySelect, 'feature/industry selector 缺失');
        const forceAll = featureSelect.value === 'shp';
        if (forceAll) {
            industrySelect.value = 'ALL';
        }
        industrySelect.disabled = forceAll;
    }

    function s3fSyncFilterRowState(row) {
        assert(row, 'filter row 缺失');
        s3fApplyFeatureIndustryConstraint(row.querySelector('.s3f-feature'), row.querySelector('.s3f-industry'));
        s3fApplyFeatureIndustryConstraint(row.querySelector('.s3f-rhs-feature'), row.querySelector('.s3f-rhs-industry'));

        const rhsGroup = row.querySelector('.s3f-rhs-group');
        assert(rhsGroup, 'rhs group 缺失');
        rhsGroup.style.display = row.querySelector('.s3f-arith').value ? '' : 'none';
    }

    async function s3fRefreshMaxBucket() {
        const resp = await fetch('/api/stage3-status');
        assert(resp.ok, '获取 stage3 状态失败');
        const data = await resp.json();
        const maxBucket = Number(data.max_bucket);
        assert(Number.isFinite(maxBucket) && maxBucket >= 0, 'max_bucket 非法');
        _s3fMaxBucket = Math.floor(maxBucket);
        _s3fTotalUsers = Number(data.bucket_user_count) || 0;
        document.getElementById('s3f-total-users').textContent = _s3fTotalUsers.toLocaleString();
    }

    async function s3fInit() {
        const runBtn = document.getElementById('s3f-run-btn');
        const errorEl = document.getElementById('s3f-error');
        runBtn.disabled = true;
        runBtn.textContent = '初始化中...';
        errorEl.textContent = '';
        try {
            await s3fRefreshMaxBucket();
        } catch (e) {
            console.error('s3fInit error:', e);
            errorEl.textContent = e.message || String(e);
        } finally {
            runBtn.disabled = false;
            runBtn.textContent = '执行过滤';
        }

        // 当选择 shp 时，强制行业为 ALL
        const sortFeature = document.getElementById('s3f-sort-feature');
        const sortIndustry = document.getElementById('s3f-sort-industry');
        sortFeature.addEventListener('change', function () {
            s3fApplyFeatureIndustryConstraint(this, sortIndustry);
        });
        s3fApplyFeatureIndustryConstraint(sortFeature, sortIndustry);

        document.addEventListener('change', function (e) {
            const row = e.target.closest('.s3f-filter-row');
            if (!row) {
                return;
            }
            s3fSyncFilterRowState(row);
        });
    }

    function s3fMakeFilterRowHtml() {
        return `
            <select class="s3f-select s3f-industry">
                <option value="Crypto_Price">Crypto_Price</option>
                <option value="Crypto_Market">Crypto_Market</option>
                <option value="Sports_Basketball">Sports_Basketball</option>
                <option value="Sports_Football">Sports_Football</option>
                <option value="Sports_Soccer">Sports_Soccer</option>
                <option value="Sports_Individual">Sports_Individual</option>
                <option value="Politics_US">Politics_US</option>
                <option value="Politics_World">Politics_World</option>
                <option value="Economy_Finance">Economy_Finance</option>
                <option value="Tech">Tech</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Weather">Weather</option>
                <option value="Society">Society</option>
                <option value="Unknown">Unknown</option>
                <option value="ALL">ALL (全部)</option>
            </select>
            <select class="s3f-select s3f-feature">
                <option value="exp">暴露额 exp (USD)</option>
                <option value="tok">持仓数 tok</option>
                <option value="vol">交易额 vol (USD)</option>
                <option value="hp">持仓周期 hp</option>
                <option value="shp">夏普 shp</option>
            </select>
            <select class="s3f-select s3f-window">
                <option value="100">月线 100</option>
                <option value="10">日线 10</option>
                <option value="1k">年线 1k</option>
            </select>
            <select class="s3f-select s3f-arith">
                <option value="">(无)</option>
                <option value="/">/</option>
                <option value="*">*</option>
            </select>
            <span class="s3f-rhs-group">
                <select class="s3f-select s3f-rhs-industry">
                    <option value="Crypto_Price">Crypto_Price</option>
                    <option value="Crypto_Market">Crypto_Market</option>
                    <option value="Sports_Basketball">Sports_Basketball</option>
                    <option value="Sports_Football">Sports_Football</option>
                    <option value="Sports_Soccer">Sports_Soccer</option>
                    <option value="Sports_Individual">Sports_Individual</option>
                    <option value="Politics_US">Politics_US</option>
                    <option value="Politics_World">Politics_World</option>
                    <option value="Economy_Finance">Economy_Finance</option>
                    <option value="Tech">Tech</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Weather">Weather</option>
                    <option value="Society">Society</option>
                    <option value="Unknown">Unknown</option>
                    <option value="ALL">ALL (全部)</option>
                </select>
                <select class="s3f-select s3f-rhs-feature">
                    <option value="exp">暴露额 exp (USD)</option>
                    <option value="tok">持仓数 tok</option>
                    <option value="vol">交易额 vol (USD)</option>
                    <option value="hp">持仓周期 hp</option>
                    <option value="shp">夏普 shp</option>
                </select>
                <select class="s3f-select s3f-rhs-window">
                    <option value="100">月线 100</option>
                    <option value="10">日线 10</option>
                    <option value="1k">年线 1k</option>
                </select>
            </span>
            <select class="s3f-select s3f-op">
                <option value=">">&gt;</option>
                <option value=">=">&gt;=</option>
                <option value="<">&lt;</option>
                <option value="<=">&lt;=</option>
            </select>
            <input type="number" class="s3f-input-num s3f-value" value="0" step="any" />
            <button class="s3f-btn s3f-btn-small s3f-btn-del" onclick="s3fRemoveFilter(this)">删除</button>
            <span class="s3f-filter-stat"></span>
        `;
    }

    function s3fSyncFilterEmptyState() {
        const box = document.getElementById('s3f-filters-box');
        const emptyEl = document.getElementById('s3f-filter-empty');
        const hasRows = box.querySelectorAll('.s3f-filter-row').length > 0;
        emptyEl.style.display = hasRows ? 'none' : '';
    }

    function s3fApplyFilterPreset(row, preset) {
        assert(row && preset, 'filter preset 参数缺失');
        row.querySelector('.s3f-industry').value = preset.industry;
        row.querySelector('.s3f-feature').value = preset.feature;
        row.querySelector('.s3f-window').value = preset.window;
        row.querySelector('.s3f-arith').value = preset.arith || '';
        row.querySelector('.s3f-rhs-industry').value = preset.rhsIndustry || 'ALL';
        row.querySelector('.s3f-rhs-feature').value = preset.rhsFeature || 'exp';
        row.querySelector('.s3f-rhs-window').value = preset.rhsWindow || '100';
        row.querySelector('.s3f-op').value = preset.op;
        row.querySelector('.s3f-value').value = preset.value;
    }

    function s3fAddFilter(preset = null) {
        const box = document.getElementById('s3f-filters-box');
        const row = document.createElement('div');
        row.className = 's3f-filter-row';
        row.dataset.filterId = s3fAllocFilterId();
        row.innerHTML = s3fMakeFilterRowHtml();
        box.appendChild(row);
        if (preset) {
            s3fApplyFilterPreset(row, preset);
        }
        s3fSyncFilterRowState(row);
        s3fSyncFilterEmptyState();
    }

    function s3fLoadDefaultFilters() {
        const box = document.getElementById('s3f-filters-box');
        assert(box, 'filters box 缺失');
        if (box.querySelectorAll('.s3f-filter-row').length > 0) {
            return;
        }
        for (const preset of _s3fDefaultFilters) {
            s3fAddFilter(preset);
        }
    }

    function s3fRemoveFilter(btn) {
        const row = btn.closest('.s3f-filter-row');
        if (row) {
            row.remove();
            s3fSyncFilterEmptyState();
        }
    }

    function s3fUpdateFilterStats(itemStats) {
        const statById = new Map();
        for (const stat of itemStats) {
            const id = String(stat && stat.id ? stat.id : '');
            if (id) {
                statById.set(id, stat);
            }
        }
        const rows = document.querySelectorAll('#s3f-filters-box .s3f-filter-row');
        for (const row of rows) {
            const statEl = row.querySelector('.s3f-filter-stat');
            if (!statEl) {
                continue;
            }
            const valueInput = row.querySelector('.s3f-value');
            if (!valueInput || valueInput.value.trim() === '') {
                statEl.innerHTML = '';
                continue;
            }
            const stat = statById.get(row.dataset.filterId || '');
            if (!stat) {
                statEl.innerHTML = '';
                continue;
            }
            const filtered = Number(stat.filtered_count) || 0;
            const remaining = Number(stat.remaining_count) || 0;
            statEl.innerHTML = `<span class="s3f-reject">过滤 ${filtered.toLocaleString()}</span> <span class="s3f-pass">剩余 ${remaining.toLocaleString()}</span>`;
        }
    }

    function s3fClearFilterStats() {
        const rows = document.querySelectorAll('#s3f-filters-box .s3f-filter-row');
        for (const row of rows) {
            const statEl = row.querySelector('.s3f-filter-stat');
            if (statEl) {
                statEl.innerHTML = '';
            }
        }
    }

    function s3fBuildMetricRef(industry, feature, window) {
        return {
            industry: s3fNormalizeIndustryForFeature(industry, feature),
            feature,
            window,
        };
    }

    function s3fBuildValueExpr(lhs, arithOp = '', rhs = null) {
        const expr = {
            lhs,
            arith_op: arithOp,
        };
        if (arithOp) {
            assert(rhs, 'rhs metric ref 缺失');
            expr.rhs = rhs;
        }
        return expr;
    }

    function s3fMoneyPowerForFeature(feature) {
        return _s3fMoneyFeatures.has(feature) ? 1 : 0;
    }

    function s3fScaleValueByMoneyPower(value, moneyPower) {
        const num = Number(value);
        assert(Number.isFinite(num), '阈值必须是有效数字');
        if (moneyPower === 0) {
            return num;
        }
        const scaled = num * Math.pow(1e6, moneyPower);
        assert(Number.isFinite(scaled), '阈值换算后超出范围');
        return scaled;
    }

    function s3fBuildFilterItemForRow(row) {
        assert(row && row.dataset.filterId, 'filter row id 缺失');
        const arith = row.querySelector('.s3f-arith').value;
        const compareOp = row.querySelector('.s3f-op').value;
        const valueText = row.querySelector('.s3f-value').value.trim();
        if (valueText === '') {
            return null;
        }

        const lhs = s3fBuildMetricRef(
            row.querySelector('.s3f-industry').value,
            row.querySelector('.s3f-feature').value,
            row.querySelector('.s3f-window').value
        );
        let rhs = null;
        let moneyPower = s3fMoneyPowerForFeature(lhs.feature);
        if (arith) {
            rhs = s3fBuildMetricRef(
                row.querySelector('.s3f-rhs-industry').value,
                row.querySelector('.s3f-rhs-feature').value,
                row.querySelector('.s3f-rhs-window').value
            );
            if (arith === '*') {
                moneyPower += s3fMoneyPowerForFeature(rhs.feature);
            } else if (arith === '/') {
                moneyPower -= s3fMoneyPowerForFeature(rhs.feature);
            } else {
                assert(false, `不支持的算术运算符: ${arith}`);
            }
        }
        const expr = s3fBuildValueExpr(lhs, arith, rhs);
        // 用户始终按 USD 量纲输入，前端按表达式中的 money 次幂换算成后端原始单位
        const compareValue = s3fScaleValueByMoneyPower(valueText, moneyPower);
        return {
            id: row.dataset.filterId,
            expr,
            compare_op: compareOp,
            compare_value: compareValue,
        };
    }

    function s3fBuildSortSpec() {
        const sortIndustry = document.getElementById('s3f-sort-industry').value;
        const sortFeature = document.getElementById('s3f-sort-feature').value;
        const sortWindow = document.getElementById('s3f-sort-window').value;
        const sortDir = document.getElementById('s3f-sort-dir').value;

        _s3fLastSortFeature = sortFeature;

        return {
            expr: s3fBuildValueExpr(s3fBuildMetricRef(sortIndustry, sortFeature, sortWindow)),
            asc: sortDir === 'asc',
        };
    }

    function s3fEscapeAddr(addr) {
        return String(addr || '').replace(/'/g, "\\'");
    }

    function s3fBuildPayload() {
        assert(_s3fMaxBucket >= 0, 'bucket 未初始化，请稍后重试');

        const items = [];
        const rows = document.querySelectorAll('#s3f-filters-box .s3f-filter-row');
        for (const row of rows) {
            const item = s3fBuildFilterItemForRow(row);
            if (item) {
                items.push(item);
            }
        }

        return {
            anchor_bucket: _s3fMaxBucket,
            items,
            sort: s3fBuildSortSpec(),
            limit: 100,
        };
    }

    function s3fFormatSortValue(rawValue) {
        // 金钱相关特征 (exp, vol) 需要除以 1e6 转换为 USD
        const val = Number(rawValue || 0);
        if (_s3fMoneyFeatures.has(_s3fLastSortFeature)) {
            const usd = val / 1e6;
            return usd.toFixed(2) + ' USD';
        }
        return val.toFixed(6);
    }

    function s3fFormatInt(rawValue) {
        const val = Number(rawValue || 0);
        return val.toLocaleString();
    }

    function s3fFormatUsd(rawValue) {
        const usd = Number(rawValue || 0) / 1e6;
        return usd.toFixed(2) + ' USD';
    }

    function s3fFormatBlocks(rawValue) {
        const val = Number(rawValue || 0);
        return val.toLocaleString() + ' blk';
    }

    function s3fRenderRows(users) {
        const body = document.getElementById('s3f-body');
        if (!users.length) {
            body.innerHTML = '<tr><td colspan="8" class="s3f-empty">没有匹配结果</td></tr>';
            return;
        }
        body.innerHTML = users.map((u, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><button class="s3f-addr-btn" onclick="s3fOpenUser('${s3fEscapeAddr(u.addr)}')">${u.addr || '-'}</button></td>
        <td>${s3fFormatSortValue(u.sort_value)}</td>
        <td>${s3fFormatInt(u.month_avg_tok)}</td>
        <td>${s3fFormatUsd(u.month_avg_exp)}</td>
        <td>${s3fFormatBlocks(u.month_avg_hp)}</td>
        <td>${s3fFormatUsd(u.pnl)}</td>
        <td><button class="s3f-btn s3f-btn-small" onclick="s3fOpenUser('${s3fEscapeAddr(u.addr)}')">查看</button></td>
      </tr>
    `).join('');
    }

    function s3fOpenUser(addr) {
        const user = String(addr || '').trim();
        if (!user) return;
        const input = document.getElementById('s3-user-input');
        if (input) {
            input.value = user;
        }
        if (typeof s3LoadUser === 'function') {
            s3LoadUser();
        }
    }

    async function s3fRunFilter() {
        // 防止并发请求
        if (_s3fIsRunning) {
            return;
        }
        _s3fIsRunning = true;

        const runBtn = document.getElementById('s3f-run-btn');
        const summary = document.getElementById('s3f-summary');
        const errorEl = document.getElementById('s3f-error');

        errorEl.textContent = '';
        runBtn.disabled = true;
        runBtn.textContent = '准备中...';
        let payload;
        try {
            await s3fRefreshMaxBucket();
            payload = s3fBuildPayload();
        } catch (e) {
            errorEl.textContent = e.message || String(e);
            runBtn.disabled = false;
            runBtn.textContent = '执行过滤';
            _s3fIsRunning = false;
            return;
        }

        runBtn.textContent = '过滤中...';

        try {
            const resp = await fetch('/api/stage3-filter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.error || '请求失败');
            }
            const users = Array.isArray(data.users) ? data.users : [];
            s3fRenderRows(users);
            const scannedUserCount = Number(data.scanned_user_count);
            const matchedUserCount = Number(data.matched_user_count);
            const scannedText = Number.isFinite(scannedUserCount) ? scannedUserCount.toLocaleString() : '-';
            const matchedText = Number.isFinite(matchedUserCount) ? matchedUserCount.toLocaleString() : users.length.toLocaleString();
            summary.textContent = `bucket=${data.anchor_bucket} | 参与 ${scannedText} | 命中 ${matchedText} | 返回 ${users.length} 地址`;
            const itemStats = Array.isArray(data.item_stats) ? data.item_stats : [];
            s3fUpdateFilterStats(itemStats);
        } catch (e) {
            errorEl.textContent = e.message || String(e);
            s3fClearFilterStats();
        } finally {
            runBtn.disabled = false;
            runBtn.textContent = '执行过滤';
            _s3fIsRunning = false;
        }
    }

    function assert(cond, msg) {
        if (!cond) throw new Error(msg || 'Assertion failed');
    }

    // 页面加载时初始化
    s3fLoadDefaultFilters();
    s3fSyncFilterEmptyState();
    s3fInit();
</script>
